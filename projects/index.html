<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Nick</title>
    
    <link rel="icon" type="image/png" href="../assets/favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Local Fonts routed through a CDN to fix mobile CORS blocking and MIME type errors */
        @font-face { font-family: 'Inter'; src: url('https://cdn.jsdelivr.net/gh/der46er/webseite@main/assets/fonts/inter-v12-latin-regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
        @font-face { font-family: 'Inter'; src: url('https://cdn.jsdelivr.net/gh/der46er/webseite@main/assets/fonts/inter-v12-latin-900.woff2') format('woff2'); font-weight: 900; font-display: swap; }
        
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background-color: #0b0d11; 
            color: white; 
            margin: 0; 
            padding: 0; 
            position: relative;
        }

        /* Fixed locked blurred wallpaper background */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100lvh;
            background-image: url("https://cdn.jsdelivr.net/gh/der46er/webseite@main/assets/backgounds/waves-grey-black.webp");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(8px);
            transform: scale(1.05);
            opacity: 1;
            z-index: -2;
        }

        /* Seamless SVG grain noise overlay */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100lvh;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.015'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: -1;
        }
        
        .animate-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Matched directly to the backdrop glass style */
        .glass-box {
            background: rgba(18, 18, 18, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>

<body class="flex flex-col min-h-[100dvh] md:h-screen w-full overflow-x-hidden overflow-y-auto md:overflow-hidden selection:bg-white/10 relative">
    <!-- Back Arrow to Main Page --> <a href="https://thataustrianone.eu" class="fixed top-4 left-4 sm:top-6 sm:left-6 z-[100] p-2 text-zinc-500 hover:text-white transition-colors rounded-xl bg-black/20 backdrop-blur-md border border-white/10 shadow-lg group"> <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="group-hover:-translate-x-1 transition-transform"> <line x1="19" y1="12" x2="5" y2="12"></line> <polyline points="12 19 5 12 12 5"></polyline> </svg> </a>

    <main class="relative z-10 max-w-[1500px] mx-auto px-4 sm:px-6 w-full flex-grow flex flex-col justify-start py-10 md:py-6 h-full min-h-0">
        
        <div class="w-full text-center shrink-0 mb-8 sm:mb-8 animate-in" style="animation-delay: 0.1s; opacity: 0;">
            <h1 id="hero-title" class="text-4xl sm:text-5xl md:text-6xl font-black italic uppercase tracking-tighter text-white mb-2">
                Projects
            </h1>
            <p id="hero-desc" class="text-zinc-400 text-xs sm:text-sm md:text-base font-medium max-w-xl mx-auto tracking-wide">
            </p>
        </div>

        <div id="projects-grid" class="w-full grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 sm:gap-4 auto-rows-max overflow-y-auto animate-in pr-1 flex-grow-0" style="animation-delay: 0.2s; opacity: 0;">
            <div id="loading-spinner" class="col-span-full text-center py-12 text-zinc-400 font-bold uppercase tracking-widest text-xs animate-pulse">
                Loading Projects...
            </div>
        </div>
    </main>

    <footer class="w-full flex justify-between items-center px-6 py-5 md:py-4 shrink-0 relative z-10 select-none">
        <button onclick="toggleLang()" id="lang-indicator" class="focus:outline-none hover:scale-105 active:scale-95 transition-all duration-200">
        </button>
        <p onclick="window.location.href='https://thataustrianone.eu/legal/'" class="cursor-pointer text-zinc-600 text-[10px] sm:text-xs font-black italic tracking-widest uppercase opacity-70 hover:opacity-100 hover:text-white transition-all duration-300">
            © <span id="year">2026</span> — @der_46er
        </p>
    </footer>

    <div id="cookie-banner" class="hidden fixed bottom-0 left-0 w-full bg-[#0b0d11]/95 backdrop-blur-xl border-t border-white/10 p-4 sm:p-6 z-[200] flex flex-col sm:flex-row justify-between items-center gap-4 animate-in">
        <div class="text-xs sm:text-sm text-zinc-300 max-w-3xl font-medium leading-relaxed">
            <p id="cookie-text"></p>
        </div>
        <div class="flex gap-3 flex-shrink-0 w-full sm:w-auto">
            <button onclick="handleCookie('denied')" id="cookie-decline" class="flex-1 sm:flex-none px-6 py-3 rounded-xl font-bold text-xs text-zinc-500 hover:text-white hover:bg-white/5 border border-white/10 transition-colors uppercase tracking-widest"></button>
            <button onclick="handleCookie('granted')" id="cookie-accept" class="flex-1 sm:flex-none px-6 py-3 rounded-xl font-bold text-xs bg-white text-black hover:bg-zinc-200 transition-colors uppercase tracking-widest shadow-lg"></button>
        </div>
    </div>

    <script>
        function escapeHTML(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        document.getElementById('year').innerText = new Date().getFullYear();

        const GITHUB_API_URL = "https://api.github.com/repos/der46er/webseite/contents/projects";
        const GITHUB_RAW_BASE = "https://raw.githubusercontent.com/der46er/webseite/main/projects";
        const arrowUpRight = '<line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline>';

        // SVG Icon Library for dynamic rendering based on info.json
        const iconsMap = {
            web: `<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>`,
            theme: `<path d="M18.37 2.63a2.12 2.12 0 0 1 3 3L13.5 13.5l-4 1 1-4Z"/><path d="M9 14.5 4 19.5c-.83.83-2.17.83-3 0 0 0 0 0 0 0s.83-2.17 0-3L6 11.5"/>`,
            hardware: `<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/>`,
            energy: `<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>`
        };

        const translations = {
            de: {
                flag: "https://cdn.jsdelivr.net/gh/der46er/webseite@main/assets/flags/austria-flag.webp",
                alt: "Austria Flag",
                heroDesc: "Eine Sammlung meiner digitalen Arbeiten und Experimente",
                cookieText: "Wir verwenden Cookies und Google Analytics, um unsere Website zu verbessern und den Traffic zu analysieren. Stimmst du der Nutzung zu?",
                cookieDecline: "Ablehnen", cookieAccept: "Akzeptieren",
                noProjects: "Momentan sind keine Projekte verfügbar."
            },
            en: {
                flag: "https://cdn.jsdelivr.net/gh/der46er/webseite@main/assets/flags/united-kingdom-flag.webp",
                alt: "UK Flag",
                heroDesc: "A collection of my digital works and experiments",
                cookieText: "We use cookies and Google Analytics to improve our website and analyze traffic. Do you accept the use of cookies?",
                cookieDecline: "Decline", cookieAccept: "Accept",
                noProjects: "No projects available at the moment."
            }
        };

        let currentLang = localStorage.getItem('siteLang') || 'en';
        let fetchedProjects = [];

        async function fetchProjects() {
            try {
                const response = await fetch(GITHUB_API_URL);
                if (!response.ok) throw new Error("Failed to fetch");
                const data = await response.json();
                
                // STAGE 1: Strictly filter ONLY subdirectories (type === 'dir')
                const directories = data.filter(file => file.type === 'dir');

                // STAGE 2: Fetch info.json inside each directory; exclude folders without a valid info.json
                const projectPromises = directories.map(async (folder) => {
                    const infoUrl = `${GITHUB_RAW_BASE}/${folder.name}/info.json`;
                    try {
                        const infoRes = await fetch(infoUrl);
                        if (!infoRes.ok) return null; // Excludes folders without info.json

                        const info = await infoRes.json();
                        const p = info.project || info;

                        let titleDe = p.title || folder.name.replace(/_/g, ' ');
                        let titleEn = p.title_en || titleDe;
                        let descriptionDe = p.description || "Website / Projekt";
                        let descriptionEn = p.description_en || descriptionDe;
                        let iconType = (p.icon && iconsMap[p.icon.toLowerCase()]) ? p.icon.toLowerCase() : 'web';

                        return {
                            name: { de: titleDe, en: titleEn },
                            description: { de: descriptionDe, en: descriptionEn },
                            icon: iconType,
                            url: `https://thataustrianone.eu/projects/${folder.name}/`
                        };
                    } catch (err) {
                        return null; // Excludes folder if JSON parsing fails
                    }
                });

                const resolved = await Promise.all(projectPromises);
                // Filter out any folder that returned null
                fetchedProjects = resolved.filter(p => p !== null);
                
                render();
            } catch (e) {
                console.error("Fetch error:", e);
                render();
            }
        }

        function render() {
            const t = translations[currentLang];
            
            document.getElementById('hero-desc').innerText = t.heroDesc;

            const langBtn = document.getElementById('lang-indicator');
            langBtn.innerHTML = '';
            const img = document.createElement('img');
            img.src = t.flag;
            img.alt = t.alt;
            img.className = 'w-7 h-auto rounded-md shadow-md object-cover opacity-80 hover:opacity-100 transition-opacity duration-200';
            langBtn.appendChild(img);
            
            document.getElementById('cookie-text').innerText = t.cookieText;
            document.getElementById('cookie-decline').innerText = t.cookieDecline;
            document.getElementById('cookie-accept').innerText = t.cookieAccept;

            const grid = document.getElementById('projects-grid');

            if (fetchedProjects.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-zinc-500 font-bold uppercase tracking-widest text-xs">${t.noProjects}</div>`;
                return;
            }

            grid.innerHTML = fetchedProjects.map(p => {
                const title = currentLang === 'en' ? p.name.en : p.name.de;
                const desc = currentLang === 'en' ? p.description.en : p.description.de;
                const iconSvg = iconsMap[p.icon] || iconsMap['web'];

                return `
                <a href="${p.url}" class="group relative glass-box rounded-[1.2rem] transition-all duration-300 hover:border-zinc-300/80 hover:shadow-[0_0_50px_-5px_rgba(212,212,216,0.4)] active:scale-[0.99] p-5 md:p-6 flex flex-col justify-between overflow-hidden h-[160px] w-full">
                    
                    <div class="flex items-start justify-start w-full">
                        <div class="w-11 h-11 rounded-xl flex items-center justify-center shrink-0 transition-transform duration-500 group-hover:-translate-y-1 text-zinc-300 bg-zinc-300/10 z-10">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                                ${iconSvg}
                            </svg>
                        </div>
                    </div>
                    
                    <div class="z-10 mt-auto flex items-end justify-between w-full">
                        <div class="flex flex-col justify-end min-w-0 pr-4">
                            <h2 class="text-lg sm:text-xl md:text-xl font-black text-white tracking-tight italic uppercase leading-tight mb-1 group-hover:text-white transition-colors truncate pr-1">${escapeHTML(title)}</h2>
                            <p class="text-zinc-500 text-[10px] sm:text-xs font-bold uppercase tracking-widest truncate pr-1">${escapeHTML(desc)}</p>
                        </div>
                        
                        <div class="text-zinc-700 group-hover:text-white transition-all transform group-hover:translate-x-1 group-hover:-translate-y-1 shrink-0 pb-0.5">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${arrowUpRight}</svg>
                        </div>
                    </div>
                </a>
                `;
            }).join('');
        }

        window.toggleLang = () => {
            currentLang = currentLang === 'en' ? 'de' : 'en';
            localStorage.setItem('siteLang', currentLang);
            render();
        };

        const cookieBanner = document.getElementById('cookie-banner');
        const cookieConsent = localStorage.getItem('siteCookieConsent');

        function injectGA() {
            if (document.getElementById('ga-script')) return;
            const script1 = document.createElement('script');
            script1.id = 'ga-script';
            script1.async = true;
            script1.src = 'https://www.googletagmanager.com/gtag/js?id=G-0WHX0WMFTC';
            document.head.appendChild(script1);

            const script2 = document.createElement('script');
            script2.innerHTML = `
                window.dataLayer = window.dataLayer || [];
                function gtag(){dataLayer.push(arguments);}
                gtag('js', new Date());
                gtag('config', 'G-0WHX0WMFTC');
            `;
            document.head.appendChild(script2);
        }

        if (!cookieConsent) {
            cookieBanner.classList.remove('hidden');
        } else if (cookieConsent === 'granted') {
            injectGA();
        }

        window.handleCookie = (status) => {
            localStorage.setItem('siteCookieConsent', status);
            cookieBanner.classList.add('opacity-0', 'translate-y-full');
            setTimeout(() => cookieBanner.classList.add('hidden'), 400);
            if (status === 'granted') injectGA();
        };

        fetchProjects();
    </script>
</body>
</html>
