<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TAO | Local QR</title>
    
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @font-face {
            font-family: 'Inter';
            src: url('https://raw.githubusercontent.com/der46er/webseite/main/assets/fonts/Inter-VariableFont_slnt,wght.ttf') format('truetype');
            font-weight: 100 900;
            font-display: swap;
            font-style: normal;
        }

        :root {
            --theme-color: #007bff;
            --theme-rgb: 0, 123, 255;
            --app-font: 'Inter', sans-serif;
        }

        body {
            font-family: var(--app-font);
            background-color: #0b0d11;
            color: white;
            overflow-x: hidden;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding: 1.5rem 1.5rem 0 1.5rem;
        }

        .animate-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .theme-text { color: var(--theme-color); }
        .theme-bg-glow { background-color: rgba(var(--theme-rgb), 0.15); }
        .theme-border-hover:hover { border-color: rgba(var(--theme-rgb), 0.5) !important; }
        .theme-drop-shadow { filter: drop-shadow(0 0 8px var(--theme-color)); }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            isolation: isolate;
        }

        .format-control { padding: 4px; display: flex; }
        .format-control button { color: rgba(255,255,255,0.5); border-radius: 1rem; transition: all 0.3s; flex: 1; border: 1px solid transparent; }
        .format-control button.active {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        #qr-gradient-wrapper {
            padding: 8px; 
            border-radius: 1.5rem;
            display: flex; 
            align-items: center;
            justify-content: center;
            transition: background 0.5s ease;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            margin: 1.5rem 0;
            background: #444; 
            width: fit-content;
        }
        
        #qr-white-zone {
            background: #ffffff;
            padding: 16px; 
            border-radius: 1rem;
            display: flex; 
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        canvas { 
            display: block; 
            width: 100%; 
            height: auto;
            max-width: 220px;
            aspect-ratio: 1/1;
            object-fit: contain;
            margin: 0; padding: 0;
            image-rendering: pixelated; 
        }

        #qrText {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            color: #fff;
        }
        #qrText:focus {
            border-color: var(--theme-color);
            outline: none;
            box-shadow: 0 0 0 4px rgba(var(--theme-rgb), 0.2);
        }

        .template-buttons button.active {
            background: rgba(255, 255, 255, 0.1) !important;
            border-color: rgba(255, 255, 255, 0.3) !important;
            color: #fff;
        }

        @media (max-width: 768px) {
            body { padding: 1rem 1rem 0 1rem; align-items: flex-start; overflow-y: auto; }
            canvas { max-width: 200px !important; }
        }
    </style>
</head>
<body class="selection:bg-emerald-500/30">

    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute -top-[5%] -left-[5%] w-[40%] h-[40%] blur-[100px] rounded-full theme-bg-glow transition-all duration-1000"></div>
        <div class="absolute -bottom-[5%] -right-[5%] w-[40%] h-[40%] blur-[100px] rounded-full theme-bg-glow transition-all duration-1000"></div>
    </div>

    <div class="fixed top-4 right-4 z-50 flex items-center p-1 gap-1 glass-panel rounded-full shadow-lg scale-90 sm:scale-100 origin-top-right">
        <button onclick="openTutorial()" title="How to use" class="w-10 h-10 rounded-full flex items-center justify-center text-zinc-400 hover:text-white hover:bg-white/10 transition-all active:scale-95">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </button>
        
        <button onclick="toggleLanguage()" id="langToggleBtn" title="Switch to English" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-white/10 transition-all active:scale-95 overflow-hidden p-2.5">
            <img id="langFlagImg" src="../assets/flags/uk-flag.webp" alt="Language Flag" class="w-full h-full object-cover rounded-sm">
        </button>
        
        <a href="https://thataustrianone.eu/socials/" target="_blank" title="My Social Links" class="w-10 h-10 rounded-full flex items-center justify-center text-zinc-400 hover:text-white hover:bg-white/10 transition-all active:scale-95">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 00-5.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>

    <div id="tutorialModal" class="hidden fixed inset-0 z-[100] items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-in" onclick="closeTutorialModal(event)">
        <div class="bg-[#161920] border border-white/10 rounded-[1.5rem] p-6 max-w-sm w-full shadow-2xl relative" onclick="event.stopPropagation()">
            <button onclick="closeTutorialModal(true)" class="absolute top-4 right-4 text-zinc-500 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h2 class="font-black italic text-xl uppercase tracking-wide text-white mb-4">How to use</h2>
            <ul class="text-zinc-300 text-sm space-y-3 font-medium">
                <li><strong class="text-white">1.</strong> Type your desired text or URL in the input field.</li>
                <li><strong class="text-white">2.</strong> Select a social preset for quick profile templates.</li>
                <li><strong class="text-white">3.</strong> Customize the look using the gradient and color buttons.</li>
                <li><strong class="text-white">4.</strong> Choose PNG or JPG and click save, or print directly.</li>

    </div>

    <div class="flex-grow flex flex-col relative z-10 max-w-xl mx-auto px-4 w-full pb-8 justify-center items-center h-full min-h-0 animate-in">
        <div class="bg-white/[0.03] border border-white/[0.05] shadow-2xl rounded-[2.5rem] p-8 w-full flex flex-col items-center">
            
            <div class="relative w-full mb-6">
                 <input type="text" id="qrText" placeholder="Enter text or URL" class="w-full rounded-[1.2rem] px-6 py-4 pr-12 text-center font-bold tracking-wider text-sm transition-colors shadow-lg">
                 <button id="resetTextButton" class="absolute right-4 top-1/2 -translate-y-1/2 text-white/40 hover:text-red-400 transition-colors">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>
                 </button>
            </div>

            <div class="template-buttons flex flex-wrap justify-center gap-2 mb-6 w-full"></div>

            <div id="qr-gradient-wrapper">
                <div id="qr-white-zone">
                    <canvas id="qrCodeCanvas"></canvas>
                </div>
            </div>

            <div class="w-full flex flex-col items-center gap-5 mt-4">
                <div class="format-control flex w-[180px] p-1 bg-white/[0.03] border border-white/[0.05] rounded-[1.2rem] shadow-lg">
                    <button data-format="jpeg" class="flex-1 py-2 text-[11px] font-bold tracking-widest uppercase">JPG</button>
                    <button data-format="png" class="flex-1 py-2 text-[11px] font-bold tracking-widest uppercase active">PNG</button>
                </div>
                
                <div class="flex gap-3 justify-center w-full">
                    <button id="printQrCodeButton" class="flex items-center justify-center w-14 h-14 bg-white/[0.03] hover:bg-white/[0.07] border border-white/[0.05] hover:border-white/[0.12] rounded-[1.2rem] transition-all duration-200 active:scale-[0.99] shadow-lg" title="Print">
                        <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M19,8H5C3.34,8,2,9.34,2,11v6h4v4h12v-4h4v-6C22,9.34,20.66,8,19,8z M16,19H8v-5h8V19z M19,12c-0.55,0-1-0.45-1-1 s0.45-1,1-1s1,0.45,1,1S19.55,12,19,12z M18,3H6v4h12V3z"/></svg>
                    </button>
                    <button id="saveQrCodeButton" class="flex items-center justify-center w-14 h-14 bg-white/[0.03] hover:bg-white/[0.07] border border-white/[0.05] hover:border-white/[0.12] rounded-[1.2rem] transition-all duration-200 active:scale-[0.99] shadow-lg" title="Save">
                        <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M5 20h14v-2H5v2zm14-9h-4V3H9v8H5l7 7 7-7z"/></svg>
                    </button>
                    <button id="refreshGradientButton" class="flex items-center justify-center w-14 h-14 bg-white/[0.03] hover:bg-white/[0.07] border border-white/[0.05] hover:border-white/[0.12] rounded-[1.2rem] transition-all duration-200 active:scale-[0.99] shadow-lg" title="New Gradient">
                         <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                    </button>
                    <label class="flex items-center justify-center w-14 h-14 bg-white/[0.03] hover:bg-white/[0.07] border border-white/[0.05] hover:border-white/[0.12] rounded-[1.2rem] transition-all duration-200 active:scale-[0.99] shadow-lg relative cursor-pointer" title="Change Color">
                        <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-3.58-8-8-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                        <input type="color" id="bgColorPicker" value="#000000" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    </label>
                </div>
            </div>
        </div>
    </div>

    <div id="save-preview-overlay" class="hidden fixed inset-0 flex items-center justify-center p-4 sm:p-6 animate-in text-zinc-100 z-[9999] bg-[#0b0d11]/90 backdrop-blur-md" onclick="closePreview(event)">
        <div class="rounded-[2.5rem] w-full max-w-sm overflow-hidden flex flex-col shadow-2xl border border-white/10 bg-[#0b0d11] p-8 md:p-10 text-center relative" onclick="event.stopPropagation()">
            <button onclick="closePreview(true)" class="absolute top-6 right-6 p-2 text-zinc-500 hover:text-white transition-all">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <h3 id="preview-title" class="text-xl md:text-2xl font-black italic uppercase tracking-tighter text-white mb-6">Preview</h3>
            <canvas id="preview-canvas" class="mx-auto rounded-xl shadow-2xl mb-6 border border-white/10" style="max-width: 240px; image-rendering: pixelated;"></canvas>
            <a href="#" id="preview-download-button" class="block w-full bg-white text-black hover:bg-gray-200 py-4 rounded-[1.2rem] font-black text-xs uppercase tracking-widest transition-all duration-200 active:scale-[0.99] shadow-lg">Download</a>
        </div>
    </div>

    <footer class="w-full flex justify-center items-center px-6 py-4 shrink-0 relative z-10 select-none mt-auto">
        <p onclick="window.location.href='https://thataustrianone.eu/legal/'" class="cursor-pointer text-zinc-600 text-[10px] sm:text-xs font-black italic tracking-widest uppercase opacity-70 hover:opacity-100 hover:text-white transition-all duration-300">
            © <span id="year">2026</span> — @der_46er
        </p>
    </footer>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Elements ---
            const qrText = document.getElementById('qrText');
            const qrCodeCanvas = document.getElementById('qrCodeCanvas');
            const qrGradientWrapper = document.getElementById('qr-gradient-wrapper');
            const bgColorPicker = document.getElementById('bgColorPicker');
            const savePreviewOverlay = document.getElementById('save-preview-overlay');
            const savePreviewCanvas = document.getElementById('preview-canvas');
            const formatControl = document.querySelector('.format-control');
            const tutorialModal = document.getElementById('tutorialModal');
            
            // --- State ---
            let currentSaveFormat = 'png';
            let currentLang = 'en';
            let gradientParams = {};

            // Set Footer Year
            document.getElementById('year').innerText = new Date().getFullYear();

            // --- Theme Integration ---
            const hexToRgbString = (hex) => {
                let cleanHex = hex.replace('#', '');
                if (cleanHex.length === 3) cleanHex = cleanHex.split('').map(x => x + x).join('');
                const r = parseInt(cleanHex.substr(0, 2), 16);
                const g = parseInt(cleanHex.substr(2, 2), 16);
                const b = parseInt(cleanHex.substr(4, 2), 16);
                return `${r}, ${g}, ${b}`;
            };

            // --- Templates & Translations ---
            const socialTemplates = [
                { name: "Facebook", prefix: "https://www.facebook.com/" },
                { name: "Instagram", prefix: "https://www.instagram.com/" },
                { name: "TikTok", prefix: "https://www.tiktok.com/" },
                { name: "YouTube", prefix: "https://www.youtube.com/" },
                { name: "X", prefix: "https://twitter.com/" },
                { name: "LinkedIn", prefix: "https://www.linkedin.com/in/" },
                { name: "WhatsApp", prefix: "https://wa.me/" },
                { name: "GitHub", prefix: "https://github.com/" },
                { name: "Discord", prefix: "https://discord.com/" }
            ];

            const translations = {
                en: { 
                    qrPlaceholder: "Text or URL", 
                    saveButton: "Save", printButtonTitle: "Print", resetButtonTitle: "Clear input", refreshGradientButtonText: "New Gradient", 
                    initialQrValue: "Hello World!", fileName: "local_qr_pro", previewTitle: "Preview", previewDownload: "Download"
                },
                de: { 
                    qrPlaceholder: "Text oder URL", 
                    saveButton: "Speichern", printButtonTitle: "Drucken", resetButtonTitle: "Eingabe löschen", refreshGradientButtonText: "Neuer Verlauf", 
                    initialQrValue: "Hallo Welt!", fileName: "local_qr_pro", previewTitle: "Vorschau", previewDownload: "Herunterladen"
                }
            };

            // Setup QRious
            const qr = new QRious({ element: qrCodeCanvas, size: 1024, padding: 0, background: '#ffffff', foreground: '#000000' });

            // --- Core Logic ---
            const applyRandomGradient = () => {
                const angle = Math.floor(Math.random() * 360);
                const colors = ['#dc2626', '#007bff', '#8b5cf6', '#ec4899', '#06b6d4', '#3b82f6', '#1DB954', '#FF6600', '#FFD700', '#ff2d55', '#4ade80'];
                const color1 = colors[Math.floor(Math.random() * colors.length)];
                let color2 = colors[Math.floor(Math.random() * colors.length)];
                while(color1 === color2) color2 = colors[Math.floor(Math.random() * colors.length)];
                
                qrGradientWrapper.style.background = `linear-gradient(${angle}deg, ${color1}, ${color2})`;
                
                // Update Socials Theme Variable
                document.documentElement.style.setProperty('--theme-color', color1);
                document.documentElement.style.setProperty('--theme-rgb', hexToRgbString(color1));

                gradientParams = { angle, color1, color2 };
            };

            const updateQr = () => {
                const txt = qrText.value || (translations[currentLang] ? translations[currentLang].initialQrValue : translations['en'].initialQrValue);
                qr.value = txt;
                qr.foreground = bgColorPicker.value || '#000000';
                qr.update();
            };

            const getFinalImage = () => {
                const tempCanvas = document.createElement('canvas');
                const ctx = tempCanvas.getContext('2d');
                
                const qrSize = 1024; 
                const quietZone = 128; 
                const borderThickness = 64; 
                
                const totalSize = qrSize + (quietZone * 2) + (borderThickness * 2);
                
                tempCanvas.width = totalSize;
                tempCanvas.height = totalSize;
                
                // 1. Draw Gradient Background
                const grad = ctx.createLinearGradient(0, 0, totalSize, totalSize);
                grad.addColorStop(0, gradientParams.color1);
                grad.addColorStop(1, gradientParams.color2);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.roundRect ? ctx.roundRect(0, 0, totalSize, totalSize, 128) : ctx.rect(0,0,totalSize,totalSize);
                ctx.fill();
                
                // 2. Draw White Quiet Zone Background
                ctx.fillStyle = '#ffffff'; 
                ctx.beginPath();
                ctx.roundRect ? ctx.roundRect(borderThickness, borderThickness, totalSize - (borderThickness*2), totalSize - (borderThickness*2), 64) : ctx.rect(borderThickness, borderThickness, totalSize - (borderThickness*2), totalSize - (borderThickness*2));
                ctx.fill();
                
                // 3. Draw the actual QR Code
                const offset = borderThickness + quietZone;
                ctx.drawImage(qrCodeCanvas, offset, offset, qrSize, qrSize);
                
                return tempCanvas;
            };

            const safeSetText = (id, text) => {
                const el = document.getElementById(id);
                if (el && text) el.textContent = text;
            };

            window.toggleLanguage = () => {
                const nextLang = currentLang === 'en' ? 'de' : 'en';
                setLanguage(nextLang);
            };

            const setLanguage = (lang) => {
                const t = translations[lang] || translations['en'];
                currentLang = translations[lang] ? lang : 'en';

                const flagImg = document.getElementById('langFlagImg');
                const toggleBtn = document.getElementById('langToggleBtn');
                
                if (flagImg && toggleBtn) {
                    if (currentLang === 'en') {
                        // English active -> Show Austria flag to toggle to German
                        flagImg.src = "../assets/flags/austria-flag.webp";
                        toggleBtn.title = "Wechseln zu Deutsch";
                    } else {
                        // German active -> Show UK flag to toggle to English
                        flagImg.src = "../assets/flags/uk-flag.webp";
                        toggleBtn.title = "Switch to English";
                    }
                }

                safeSetText('preview-title', t.previewTitle);
                safeSetText('preview-download-button', t.previewDownload);
                
                if(qrText) qrText.placeholder = t.qrPlaceholder;
                const safeSetTitle = (id, title) => { const el = document.getElementById(id); if (el) el.title = title; };
                
                safeSetTitle('resetTextButton', t.resetButtonTitle);
                safeSetTitle('printQrCodeButton', t.printButtonTitle);
                safeSetTitle('saveQrCodeButton', t.saveButton);
                safeSetTitle('refreshGradientButton', t.refreshGradientButtonText);

                if (qrText && !qrText.value) updateQr();
                localStorage.setItem('qrGeneratorLanguage', currentLang);
            };

            const populateStaticUI = () => {
                const templateButtonsContainer = document.querySelector('.template-buttons');
                if (templateButtonsContainer) {
                    templateButtonsContainer.innerHTML = socialTemplates.map(template =>
                        `<button data-prefix="${template.prefix}" class="bg-white/[0.03] hover:bg-white/[0.07] border border-white/[0.05] hover:border-white/[0.12] px-4 py-2 text-[10px] font-bold tracking-widest uppercase rounded-[1rem] transition-all duration-200 active:scale-[0.99] shadow-sm">${template.name}</button>`
                    ).join('');
                }
            };

            // UI Functionality
            window.openTutorial = () => { if(tutorialModal) { tutorialModal.classList.remove('hidden'); tutorialModal.classList.add('flex'); } };
            window.closeTutorialModal = (force) => {
                if (tutorialModal && (force === true || event.target.id === 'tutorialModal')) { tutorialModal.classList.add('hidden'); tutorialModal.classList.remove('flex'); }
            };
            window.closePreview = (force) => {
                if (savePreviewOverlay && (force === true || event.target.id === 'save-preview-overlay')) savePreviewOverlay.classList.add('hidden');
            };

            // Event Listeners
            const setupEventListeners = () => {
                if(qrText) qrText.addEventListener('input', updateQr);
                if(bgColorPicker) bgColorPicker.addEventListener('input', updateQr);
                
                const refreshBtn = document.getElementById('refreshGradientButton');
                if(refreshBtn) refreshBtn.addEventListener('click', applyRandomGradient);
                
                const resetBtn = document.getElementById('resetTextButton');
                if(resetBtn) {
                    resetBtn.addEventListener('click', () => { 
                        qrText.value = ''; 
                        document.querySelectorAll('.template-buttons button').forEach(b => b.classList.remove('active'));
                        updateQr(); 
                        qrText.focus(); 
                    });
                }
                
                if(formatControl) {
                    formatControl.addEventListener('click', (e) => {
                        if (e.target.tagName === 'BUTTON') {
                            currentSaveFormat = e.target.dataset.format;
                            formatControl.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
                            e.target.classList.add('active');
                            localStorage.setItem('qrGeneratorSaveFormat', currentSaveFormat);
                        }
                    });
                }

                const tbContainer = document.querySelector('.template-buttons');
                if(tbContainer) {
                    tbContainer.addEventListener('click', (e) => {
                        if (e.target.tagName === 'BUTTON') {
                            document.querySelectorAll('.template-buttons button').forEach(b => b.classList.remove('active'));
                            e.target.classList.add('active');
                            
                            const prefix = e.target.dataset.prefix;
                            if(qrText) {
                                qrText.value = prefix;
                                updateQr();
                                qrText.focus();
                            }
                        }
                    });
                }

                // Export logic
                const saveBtn = document.getElementById('saveQrCodeButton');
                if(saveBtn) {
                    saveBtn.addEventListener('click', () => {
                        const final = getFinalImage();
                        if(savePreviewCanvas) {
                            savePreviewCanvas.width = final.width;
                            savePreviewCanvas.height = final.height;
                            savePreviewCanvas.getContext('2d').drawImage(final, 0, 0);
                        }
                        if(savePreviewOverlay) savePreviewOverlay.classList.remove('hidden');
                    });
                }
                
                const pDwnBtn = document.getElementById('preview-download-button');
                if(pDwnBtn) {
                    pDwnBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        const link = document.createElement('a');
                        link.download = `${translations[currentLang].fileName}.${currentSaveFormat === 'jpeg' ? 'jpg' : 'png'}`;
                        link.href = savePreviewCanvas.toDataURL(`image/${currentSaveFormat}`, 1.0);
                        link.click();
                        if(savePreviewOverlay) savePreviewOverlay.classList.add('hidden');
                    });
                }

                const printBtn = document.getElementById('printQrCodeButton');
                if(printBtn) {
                    printBtn.addEventListener('click', () => {
                        const dataUrl = getFinalImage().toDataURL('image/png');
                        const win = window.open('', '_blank');
                        win.document.write(`<img src="${dataUrl}" style="max-width:100%; border-radius:16px;" onload="window.print(); setTimeout(()=>window.close(), 100)">`);
                        win.document.close();
                    });
                }
            };

            // Init
            const init = () => {
                populateStaticUI();
                setupEventListeners();
                
                currentSaveFormat = localStorage.getItem('qrGeneratorSaveFormat') || 'png';
                if(formatControl) {
                    formatControl.querySelectorAll('button').forEach(btn => {
                        if(btn.dataset.format === currentSaveFormat) btn.classList.add('active');
                        else btn.classList.remove('active');
                    });
                }

                setLanguage(localStorage.getItem('qrGeneratorLanguage') || 'en');
                applyRandomGradient();
                updateQr();
            };

            init();
        });
    </script>
</body>
</html>
