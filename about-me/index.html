                            <h1 className="responsive-title font-black italic uppercase tracking-tighter text-white leading-none mb-6 md:mb-10 text-balance break-word-custom">
                                {t.title}
                            </h1>
                            
                            <p className="text-zinc-400 text-base md:text-2xl font-medium italic max-w-3xl leading-relaxed mx-auto text-balance px-4 md:px-0">"{t.intro}"</p>
                        </header>

                        <div className="grid grid-cols-1 lg:grid-cols-4 gap-4 md:gap-6 mb-16 md:mb-24 text-left items-stretch">
                            <div className="lg:col-span-1 glass-card rounded-[1.5rem] md:rounded-[2.5rem] p-6 md:p-10 flex flex-col justify-between">
                                <h3 className="text-cyan-500 font-black uppercase text-[8px] md:text-[10px] tracking-[0.4em] mb-8 md:mb-10 italic text-left">{t.factsTitle}</h3>
                                <div className="grid grid-cols-2 lg:grid-cols-1 gap-6 md:gap-8">
                                    {t.facts.map((f, i) => (
                                        <div key={i} className="flex flex-col group/item text-left">
                                            <span className="text-zinc-600 text-[8px] md:text-[10px] font-black uppercase tracking-widest mb-1 group-hover/item:text-cyan-500 transition-colors">{f.label}</span>
                                            <span className="text-white font-black italic uppercase text-sm md:text-lg leading-tight break-words">{f.value}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            
                            <div className="lg:col-span-3 glass-card rounded-[1.5rem] md:rounded-[3rem] p-6 md:p-14 cyan-glow flex flex-col justify-between relative overflow-hidden text-left">
                                <div className="absolute top-0 right-0 p-8 opacity-5 text-cyan-500 rotate-12 pointer-events-none hidden md:block"><Zap size={200} /></div>
                                <div>
                                    <h3 className="text-cyan-500 font-black uppercase text-[8px] md:text-[10px] tracking-[0.4em] mb-8 md:mb-12 italic">{t.bioTitle}</h3>
                                    <p className="text-zinc-300 text-base md:text-xl font-medium leading-relaxed italic mb-10 max-w-2xl">
                                        "{t.bioText}"
                                    </p>
                                    <h3 className="text-cyan-500 font-black uppercase text-[8px] md:text-[10px] tracking-[0.4em] mb-8 md:mb-12 italic">{t.skillsTitle}</h3>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-8 md:gap-x-12 gap-y-6 md:gap-y-10">
                                        {[
                                            { name: "Hardware Specialist", level: "100%" },
                                            { name: "Smartphone Tech & Repair", level: "95%" },
                                            { name: "System Setup & Optimizing", level: "92%" },
                                            { name: "C++ Programming (Basics)", level: "40%" }
                                        ].map((skill, i) => (
                                            <div key={i} className="space-y-2 md:space-y-3">
                                                <div className="flex justify-between items-end">
                                                    <span className="text-[9px] md:text-xs font-black uppercase tracking-widest text-zinc-100">{skill.name}</span>
                                                    <span className="text-[8px] md:text-[10px] font-black text-cyan-500">{skill.level}</span>
                                                </div>
                                                <div className="h-1 md:h-1.5 w-full bg-white/5 rounded-full overflow-hidden">
                                                    <div className="h-full bg-cyan-600 rounded-full transition-all duration-1000 delay-300" style={{ width: skill.level }}></div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="mt-10 md:mt-16 flex flex-wrap gap-2 md:gap-3 justify-start">
                                    {["PC Hardware", "Smartphones", "Windows 11", "Software Deployment", "C++ Basics"].map((tag, i) => (
                                        <span key={i} className="px-3 py-1.5 md:px-4 md:py-2 bg-white/5 border border-white/5 rounded-lg md:rounded-xl text-[8px] md:text-[9px] font-black uppercase tracking-widest text-zinc-500">#{tag}</span>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <section className="mb-16 md:mb-24 px-4 md:px-0 text-left">
                            <div className="flex flex-col lg:flex-row justify-between lg:items-end mb-8 md:mb-12 gap-6 md:gap-8">
                                <div className="text-left">
                                    <h2 className="text-3xl md:text-6xl font-black italic uppercase tracking-tighter mb-2 md:mb-4">{t.setupTitle}</h2>
                                    <div className="h-1 md:h-1.5 w-12 md:w-24 bg-cyan-600 rounded-full"></div>
                                </div>
                                <div className="flex gap-1 md:gap-2 p-1 bg-white/5 rounded-lg md:rounded-2xl border border-white/5 overflow-x-auto whitespace-nowrap custom-scroll">
                                    {t.setupCats.map(cat => (
                                        <button key={cat} onClick={() => setActiveSetup(cat)} className={`px-4 md:px-6 py-2.5 md:py-3 rounded-lg md:rounded-xl text-[8px] md:text-[10px] font-black uppercase tracking-widest transition-all ${activeSetup === cat ? 'setup-tab-active shadow-lg' : 'text-zinc-500 hover:text-zinc-300'}`}>{cat}</button>
                                    ))}
                                </div>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 md:gap-6 animate-in">
                                {t.setupData[activeSetup].map((item, i) => (
                                    <div key={i} className="glass-card rounded-[1.2rem] md:rounded-[2.5rem] p-5 md:p-8 group/card flex items-center gap-4 md:gap-6 text-left">
                                        <div className="w-10 h-10 md:w-14 md:h-14 rounded-xl md:rounded-2xl bg-cyan-500/10 flex items-center justify-center text-cyan-500 group-hover/card:scale-110 transition-transform shrink-0">
                                            {activeSetup === "Gaming PC" ? <Cpu size={20} /> : activeSetup === "Equipment" ? <Monitor size={20} /> : <Zap size={20} />}
                                        </div>
                                        <div className="text-left overflow-hidden">
                                            <p className="text-[7px] md:text-[10px] font-black text-zinc-600 uppercase tracking-widest mb-0.5 md:mb-1">{item.item}</p>
                                            <p className="text-xs md:text-sm font-bold text-zinc-100 uppercase italic tracking-tight truncate">{item.value}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>

                        {/* LIVE SPOTIFY SECTION */}
                        <section className="mb-24 px-4 md:px-0">
                            <div className="flex items-center gap-4 mb-10 justify-center md:justify-start text-left">
                                <h2 className="text-2xl md:text-5xl font-black italic uppercase tracking-tighter">{t.vibingTitle}</h2>
                                <SpotifyIcon size={32} className="hidden md:block" />
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8 text-left">
                                <div className="glass-card rounded-[2.5rem] p-8 flex flex-col justify-center relative overflow-hidden group min-h-[160px]">
                                    <div className="absolute top-0 right-0 p-6 opacity-10 text-cyan-500 group-hover:scale-110 transition-transform duration-500"><MusicIcon size={80} /></div>
                                    <div className="flex items-center gap-6">
                                        <div className="w-24 h-24 rounded-2xl bg-black/40 flex items-center justify-center border border-white/5 relative overflow-hidden shrink-0 shadow-inner">
                                            {spotify && spotify.album_art_url ? (
                                                <img src={spotify.album_art_url} className="w-full h-full object-cover animate-in" alt="Cover" />
                                            ) : (
                                                <img src="https://raw.githubusercontent.com/der46er/webseite/main/assets/favicon.png" className="w-12 h-12 object-contain opacity-20 grayscale" alt="Logo" />
                                            )}
                                            {spotify && (
                                                <div className="absolute bottom-3 w-full flex gap-1 items-end justify-center">
                                                    <div className="visualizer-bar"></div>
                                                    <div className="visualizer-bar bar-2"></div>
                                                    <div className="visualizer-bar bar-3"></div>
                                                    <div className="visualizer-bar bar-4"></div>
                                                </div>
                                            )}
                                        </div>
                                        <div className="text-left overflow-hidden">
                                            <p className="text-[9px] font-black text-cyan-500 uppercase tracking-[0.3em] mb-1">{spotify ? t.nowPlaying : t.notPlaying}</p>
                                            <p className="text-xl md:text-2xl font-black italic uppercase text-white truncate">
                                                {spotify ? spotify.song : "Quiet Mode"}
                                            </p>
                                            <p className="text-zinc-500 text-sm font-bold uppercase tracking-widest mt-1 truncate">
                                                {spotify ? spotify.artist : "thataustrianone"}
                                            </p>
                                        </div>
                                    </div>
                                </div>
                                <div className="rounded-[1.5rem] overflow-hidden border border-white/5 shadow-2xl bg-black">
                                    <iframe style={{borderRadius:'12px'}} src="https://open.spotify.com/embed/playlist/0XZQFKzgRWqT3Rm9E0YgwX?utm_source=generator&theme=0" width="100%" height="160" frameBorder="0" allowFullScreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
                                </div>
                            </div>
                        </section>

                        <section className="mb-20 md:mb-32 px-4 md:px-0 text-left">
                            <h3 className="text-cyan-500 font-black uppercase text-[8px] md:text-[10px] tracking-[0.4em] mb-10 md:mb-16 italic text-center">{t.journeyTitle}</h3>
                            <div className="relative">
                                <div className="absolute left-1/2 -translate-x-1/2 top-0 bottom-0 w-px bg-white/10 hidden md:block" />
                                <div className="space-y-8 md:space-y-12 relative">
                                    {t.journey.map((m, i) => (
                                        <div key={i} className={`flex flex-col md:flex-row items-center gap-6 md:gap-8 ${i % 2 === 0 ? 'md:flex-row-reverse' : ''}`}>
                                            <div className="flex-1 w-full text-center md:text-left">
                                                <div className={`glass-card rounded-[1.5rem] md:rounded-[2.5rem] p-6 md:p-10 hover:translate-y-[-5px] transition-transform ${i % 2 === 0 ? 'md:text-left' : 'md:text-right'}`}>
                                                    <span className="text-cyan-500 font-black italic text-xl md:text-3xl mb-1 md:mb-4 block">{m.year}</span>
                                                    <h4 className="text-base md:text-xl font-black uppercase italic mb-2 md:mb-3 text-white leading-tight">{m.title}</h4>
                                                    <p className="text-zinc-500 font-medium text-[11px] md:text-sm leading-relaxed">{m.desc}</p>
                                                </div>
                                            </div>
                                            <div className="w-8 h-8 md:w-12 md:h-12 rounded-full bg-[#0b0d11] border-4 border-cyan-600 z-10 hidden md:flex items-center justify-center shadow-[0_0_20px_rgba(6,182,212,0.4)]">
                                                <div className="w-2 md:w-3 h-2 md:h-3 rounded-full bg-cyan-400 animate-pulse" />
                                            </div>
                                            <div className="flex-1 hidden md:block" />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </section>

                        <footer className="mt-20 md:mt-32 text-center flex flex-col items-center gap-8 md:gap-12">
                            <div className="w-full h-px bg-gradient-to-r from-transparent via-zinc-800 to-transparent"></div>
                            <button onClick={() => setShowLegal(true)} className="flex items-center gap-3 px-8 py-4 md:px-14 md:py-5 bg-white/5 hover:bg-white/10 border border-white/5 rounded-full text-[10px] md:text-[13px] font-black tracking-[0.3em] md:tracking-[0.4em] transition-all text-zinc-500 hover:text-white uppercase italic">
                                <Info size={18} /> {t.legal}
                            </button>
                            <div className="text-zinc-800 text-[9px] md:text-[11px] font-black tracking-[0.5em] md:tracking-[0.8em] uppercase opacity-40 italic">© {new Date().getFullYear()} — THAT AUSTRIAN ONE</div>
                        </footer>
                    </div>

                    {showLegal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/90 backdrop-blur-xl animate-in text-zinc-100">
                            <div className="glass-modal rounded-[2rem] md:rounded-[3rem] w-full max-w-2xl max-h-[85vh] overflow-hidden flex flex-col shadow-2xl cyan-glow">
                                <div className="p-8 md:p-10 border-b border-white/5 flex justify-between items-center text-zinc-100 text-left">
                                    <h2 className="text-xl md:text-2xl font-black italic uppercase tracking-tighter text-white">{t.legalTitle}</h2>
                                    <button onClick={() => setShowLegal(false)} className="p-2 md:p-3 text-zinc-500 hover:text-white hover:bg-white/5 rounded-full transition-all">
                                        <X size={26} />
                                    </button>
                                </div>
                                <div className="p-8 md:p-10 overflow-y-auto custom-scroll space-y-10 md:space-y-12 text-left text-zinc-100">
                                    <section>
                                        <h3 className="text-cyan-500 font-black uppercase text-[9px] md:text-[10px] tracking-[0.4em] mb-4 md:mb-6 italic">Impressum</h3>
                                        <div className="space-y-4 font-bold text-zinc-100 uppercase">
                                            <p className="text-xl md:text-2xl font-black tracking-tight italic">Niklas Ausserwoeger</p>
                                            <p className="text-zinc-500 text-[10px] md:text-[11px] italic leading-relaxed lowercase tracking-normal">"{t.addressRequest}"</p>
                                            <p className="text-xs tracking-widest italic">4040 Linz, Österreich</p>
                                            <div className="pt-4 md:pt-6 text-left">
                                                <p className="text-zinc-600 text-[9px] md:text-[10px] mb-1 tracking-[0.3em] uppercase font-bold">E-Mail Kontakt</p>
                                                <p className="text-cyan-400 text-sm md:text-base font-black italic tracking-normal lowercase">niklas.ausserwoeger@gmail.com</p>
                                            </div>
                                        </div>
                                    </section>
                                    <section className="space-y-6 text-left">
                                        <div>
                                            <h3 className="text-cyan-500 font-black uppercase text-[10px] tracking-[0.4em] mb-4 italic">{t.legalPrivacy}</h3>
                                            <p className="text-zinc-500 text-xs italic leading-relaxed uppercase">{t.legalPrivacyText}</p>
                                        </div>
                                        <div>
                                            <h4 className="text-white font-bold text-xs uppercase tracking-widest mb-1 md:mb-2 italic text-left">{t.trademarkLabel}</h4>
                                            <p className="text-zinc-500 text-[10px] md:text-xs italic leading-relaxed uppercase">{t.trademarkText}</p>
                                        </div>
                                        <div>
                                            <h4 className="text-white font-bold text-xs uppercase tracking-widest mb-1 md:mb-2 italic text-left">Haftungsausschluss</h4>
                                            <p className="text-zinc-500 text-[10px] md:text-xs italic leading-relaxed uppercase">{t.liabilityText}</p>
                                        </div>
                                    </section>
                                    <div className="pt-8 md:pt-10 border-t border-white/5 text-[9px] md:text-[10px] uppercase tracking-[0.4em] md:tracking-[0.5em] text-zinc-700 font-black text-center italic">
                                        Privatprojekt • Linz (OÖ) • {new Date().getFullYear()}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
