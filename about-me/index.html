        body::before {
            content: "";

            left: 0;

            opacity: 1;
            z-index: -2;

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100lvh;

        .animate-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        @keyframes vinyl-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-vinyl {
            animation: vinyl-spin 8s linear infinite;
        }

        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        let currentLang = localStorage.getItem('siteLang') || 'en';
        let activeSetupTab = 0;
        let galleryImages = [];

        function renderSetup() {
            const t = translations[currentLang];
            const tabContainer = document.getElementById('setup-tabs');
            const itemsGrid = document.getElementById('setup-items-grid');
            const currentCat = t.setupCategories[activeSetupTab];

            tabContainer.innerHTML = t.setupCategories.map((cat, idx) => `
                <button onclick="setSetupTab(${idx})" class="w-full sm:w-auto px-3 py-2 sm:py-1.5 rounded-lg text-[10px] font-black uppercase tracking-wider text-center flex items-center justify-center transition-all duration-200 ${idx === activeSetupTab ? 'bg-blue-500 text-white shadow-lg' : 'text-zinc-400 hover:text-white'}">
                    ${cat}
                </button>
            `).join('');

            const items = t.setupData[currentCat] || [];
            itemsGrid.innerHTML = items.map(item => `
                <div class="glass-box rounded-xl p-3.5 flex flex-col justify-between border border-white/5">
                    <span class="text-[9px] font-black uppercase tracking-widest text-zinc-500 mb-1">${item.label}</span>
                    <span class="text-xs font-black italic uppercase text-white truncate">${item.val}</span>
                </div>
            `).join('');
        }

        function setSetupTab(idx) {
            activeSetupTab = idx;
            renderSetup();
        }

        async function fetchGallery() {
            try {
                const res = await fetch(GITHUB_GALLERY_API);
                if (!res.ok) throw new Error("Could not load gallery repository");
                const files = await res.json();
                
                const validExtensions = ['.webp', '.jpg', '.jpeg', '.png', '.avif'];
                galleryImages = files
                    .filter(f => f.type === 'file' && validExtensions.some(ext => f.name.toLowerCase().endsWith(ext)))
                    .map(f => f.download_url || `${GITHUB_GALLERY_RAW}/${f.name}`);
                
                renderGallery();
            } catch (err) {
                console.error("Gallery fetch failed:", err);
                renderGallery();
            }
        }

        function renderGallery() {
            const t = translations[currentLang];
            const grid = document.getElementById('gallery-grid');
            
            if (galleryImages.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-8 text-zinc-500 font-bold uppercase tracking-widest text-xs">${t.noImages}</div>`;
                return;
            }

            grid.innerHTML = galleryImages.map(imgUrl => `
                <div onclick="openLightbox('${imgUrl}')" class="aspect-square rounded-xl overflow-hidden bg-black/40 border border-white/5 cursor-pointer group relative">
                    <img src="${imgUrl}" alt="Gallery capture" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" loading="lazy" />
                    <div class="absolute inset-0 bg-blue-500/10 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>
                </div>
            `).join('');
        }

        function openLightbox(src) {
            const modal = document.getElementById('lightbox-modal');
            const img = document.getElementById('lightbox-img');
            img.src = src;
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                img.classList.remove('scale-95');
                img.classList.add('scale-100');
            }, 10);
        }

        function closeLightbox() {
            const modal = document.getElementById('lightbox-modal');
            const img = document.getElementById('lightbox-img');
            modal.classList.add('opacity-0');
            img.classList.remove('scale-100');
            img.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                img.src = '';
            }, 300);
        }

            const t = translations[currentLang];
            try {
                const res = await fetch(LANYARD_URL, { cache: 'no-cache' });
                if (!res.ok) return;
                const data = await res.json();
                
                const art = document.getElementById('spotify-art');
                const placeholder = document.getElementById('spotify-placeholder');
                const artWrap = document.getElementById('spotify-art-wrap');
                const statusText = document.getElementById('spotify-status-text');
                const title = document.getElementById('spotify-title');
                const artist = document.getElementById('spotify-artist');

                if (data.success && data.data && data.data.listening_to_spotify && data.data.spotify) {
                    const sp = data.data.spotify;
                    art.src = sp.album_art_url;
                    art.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                    artWrap.classList.add('animate-vinyl');
                    
                    statusText.innerText = t.nowPlaying;
                    statusText.className = "text-[9px] font-black uppercase tracking-widest text-emerald-400 mb-0.5";
                    title.innerText = sp.song;
                    artist.innerText = sp.artist;
                } else {
                    art.classList.add('hidden');
                    placeholder.classList.remove('hidden');
                    artWrap.classList.remove('animate-vinyl');
                    
                    statusText.innerText = t.offline;
                    statusText.className = "text-[9px] font-black uppercase tracking-widest text-zinc-500 mb-0.5";
                    title.innerText = t.notPlaying;
                    artist.innerText = "Spotify";
                }
            } catch (e) {
                console.error("Lanyard error:", e);
            }
        }

        function render() {
            const t = translations[currentLang];
            
            document.getElementById('hero-title').innerText = t.heroTitle;
            document.getElementById('hero-desc').innerText = t.heroDesc;
            document.getElementById('profile-bio').innerText = t.profileBio;
            document.getElementById('setup-heading').innerText = t.setupHeading;
            document.getElementById('setup-subheading').innerText = t.setupSubheading;
            document.getElementById('gallery-heading').innerText = t.galleryHeading;

            document.getElementById('lang-indicator').innerHTML = `<img src="${t.flag}" alt="${t.alt}" class="w-7 h-auto rounded-md shadow-md object-cover opacity-80 hover:opacity-100 transition-opacity duration-200">`;
            
            document.getElementById('cookie-text').innerText = t.cookieText;
            document.getElementById('cookie-decline').innerText = t.cookieDecline;
            document.getElementById('cookie-accept').innerText = t.cookieAccept;

            renderSetup();
            renderGallery();
            fetchLanyard();
        }

        window.toggleLang = () => {
            currentLang = currentLang === 'en' ? 'de' : 'en';
            localStorage.setItem('siteLang', currentLang);
            render();
        };

        const cookieBanner = document.getElementById('cookie-banner');
        const cookieConsent = localStorage.getItem('siteCookieConsent');

        function injectGA() {
            if (document.getElementById('ga-script')) return;
            const script1 = document.createElement('script');
            script1.id = 'ga-script';
            script1.async = true;
            script1.src = 'https://www.googletagmanager.com/gtag/js?id=G-0WHX0WMFTC';
            document.head.appendChild(script1);

            const script2 = document.createElement('script');
            script2.innerHTML = `
                window.dataLayer = window.dataLayer || [];
                function gtag(){dataLayer.push(arguments);}
                gtag('js', new Date());
                gtag('config', 'G-0WHX0WMFTC');
            `;
            document.head.appendChild(script2);
        }

        if (!cookieConsent) {
            cookieBanner.classList.remove('hidden');
        } else if (cookieConsent === 'granted') {
            injectGA();
        }

        window.handleCookie = (status) => {
            localStorage.setItem('siteCookieConsent', status);
            cookieBanner.classList.add('opacity-0', 'translate-y-full');
            setTimeout(() => cookieBanner.classList.add('hidden'), 400);
            if (status === 'granted') injectGA();
        };

        render();
        fetchGallery();
        setInterval(fetchLanyard, 10000);
    </script>
</body>
</html>
