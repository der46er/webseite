                                {t.setupData[activeSetup].map((item, i) => (
                                    <div key={i} className="glass-card rounded-[1.5rem] sm:rounded-[2rem] p-5 sm:p-8 flex items-center gap-4">
                                        <div className="w-12 h-12 rounded-xl bg-cyan-500/10 flex items-center justify-center text-cyan-500 shrink-0">
                                            {activeSetup === "Gaming PC" ? <Cpu size={20} /> : activeSetup === "Equipment" ? <Monitor size={20} /> : <Zap size={20} />}
                                        </div>
                                        <div className="overflow-hidden">
                                            <p className="text-[9px] sm:text-[10px] font-black text-zinc-600 uppercase tracking-widest mb-0.5">{item.item}</p>
                                            <p className="text-xs sm:text-sm font-bold text-zinc-100 uppercase italic truncate">{item.value}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>

                        {/* Spotify Section */}
                        <section className="mb-20 sm:mb-24">
                            <div className="flex items-center gap-4 mb-8 sm:mb-10 justify-center sm:justify-start">
                                <h2 className="text-2xl sm:text-5xl font-black italic uppercase tracking-tighter">{t.vibingTitle}</h2>
                                <SpotifyIcon size={28} />
                            </div>
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 sm:gap-8">
                                <div className="glass-card rounded-[2rem] p-6 sm:p-8 flex flex-col justify-center relative overflow-hidden group">
                                    <div className="absolute top-0 right-0 p-6 opacity-5 text-cyan-500 group-hover:scale-110 transition-transform duration-500"><MusicIcon size={60} /></div>
                                    <div className="flex items-center gap-6 sm:gap-8">
                                        <div className={`w-20 h-20 sm:w-28 sm:h-28 rounded-full bg-[#161920] flex items-center justify-center border-4 border-white/5 relative overflow-hidden shrink-0 shadow-2xl ${spotify ? 'animate-vinyl' : ''}`}>
                                            {spotify && spotify.album_art_url ? (
                                                <>
                                                    <img src={spotify.album_art_url} className="w-full h-full object-cover rounded-full" alt="Cover" />
                                                    <div className="absolute w-3 h-3 bg-[#0b0d11] rounded-full border border-white/20 z-10"></div>
                                                </>
                                            ) : (
                                                <img src="https://raw.githubusercontent.com/der46er/webseite/main/assets/favicon.png" className="w-10 h-10 object-contain opacity-20 grayscale" alt="Logo" />
                                            )}
                                        </div>
                                        <div className="overflow-hidden text-left">
                                            <p className="text-[9px] font-black text-cyan-500 uppercase tracking-[0.3em] mb-1">{spotify ? t.nowPlaying : t.notPlaying}</p>
                                            <p className="text-lg sm:text-2xl font-black italic uppercase text-white truncate">{spotify ? spotify.song : "Quiet Mode"}</p>
                                            <p className="text-zinc-500 text-xs font-bold uppercase tracking-widest mt-1 truncate">{spotify ? spotify.artist : "thataustrianone"}</p>
                                        </div>
                                    </div>
                                </div>
                                <div className="rounded-[1.5rem] overflow-hidden border border-white/5 shadow-2xl bg-black">
                                    <iframe style={{borderRadius:'12px'}} src="https://open.spotify.com/embed/playlist/0XZQFKzgRWqT3Rm9E0YgwX?utm_source=generator&theme=0" width="100%" height="152" frameBorder="0" allowFullScreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
                                </div>
                            </div>
                        </section>

                        {/* Journey/Milestones Section */}
                        <section className="mb-20 sm:mb-32">
                            <h3 className="text-cyan-500 font-black uppercase text-[10px] tracking-[0.4em] mb-10 italic text-center">{t.journeyTitle}</h3>
                            <div className="relative max-w-4xl mx-auto">
                                {/* Desktop Timeline Line */}
                                <div className="absolute left-1/2 -translate-x-1/2 top-0 bottom-0 w-px bg-white/10 hidden md:block" />
                                {/* Mobile Timeline Line */}
                                <div className="absolute left-4 top-0 bottom-0 w-px bg-white/10 md:hidden" />
                                
                                <div className="space-y-10 sm:space-y-12 relative">
                                    {t.journey.map((m, i) => (
                                        <div key={i} className={`flex flex-col md:flex-row items-start md:items-center gap-6 sm:gap-8 ${i % 2 === 0 ? 'md:flex-row-reverse' : ''}`}>
                                            <div className="flex-1 w-full pl-10 md:pl-0">
                                                <div className={`glass-card rounded-[1.5rem] sm:rounded-[2.5rem] p-6 sm:p-10 hover:translate-y-[-5px] transition-transform text-left ${i % 2 === 0 ? 'md:text-left' : 'md:text-right'}`}>
                                                    <span className="text-cyan-500 font-black italic text-xl sm:text-3xl mb-2 sm:mb-4 block">{m.year}</span>
                                                    <h4 className="text-base sm:text-xl font-black uppercase italic mb-2 text-white">{m.title}</h4>
                                                    <p className="text-zinc-500 font-medium text-xs sm:text-sm leading-relaxed">{m.desc}</p>
                                                </div>
                                            </div>
                                            {/* Dot */}
                                            <div className="absolute left-4 md:left-1/2 -translate-x-1/2 w-8 h-8 rounded-full bg-[#0b0d11] border-4 border-cyan-600 z-10 flex items-center justify-center shadow-[0_0_15px_rgba(6,182,212,0.3)]">
                                                <div className="w-2 h-2 rounded-full bg-cyan-400" />
                                            </div>
                                            <div className="flex-1 hidden md:block" />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </section>

                        <footer onClick={() => window.location.href='https://thataustrianone.eu/legal/'} className="w-full text-center py-6 mt-auto cursor-pointer group select-none">
    <p className="text-zinc-600 text-[10px] sm:text-xs font-black italic tracking-widest uppercase opacity-70 group-hover:opacity-100 group-hover:text-white transition-all duration-200">
        © 2026 — @der_46er
    </p>
</footer>
                    </div>

                    {/* Legal Modal */}
                    {showLegal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6 bg-black/95 backdrop-blur-xl animate-in text-zinc-100">
                            <div className="glass-modal rounded-[2rem] sm:rounded-[2.5rem] w-full max-w-xl max-h-[85vh] overflow-hidden flex flex-col shadow-2xl">
                                <div className="p-6 sm:p-8 border-b border-white/5 flex justify-between items-center text-left">
                                    <h2 className="text-xl sm:text-2xl font-black italic uppercase tracking-tighter text-white">{t.legalTitle}</h2>
                                    <button onClick={() => setShowLegal(false)} className="p-2 text-zinc-500 hover:text-white hover:bg-white/5 rounded-full transition-all">
                                        <X size={24} />
                                    </button>
                                </div>
                                <div className="p-6 sm:p-8 overflow-y-auto custom-scroll space-y-8 sm:space-y-10 text-left">
                                    <section>
                                        <h3 className="text-cyan-500 font-black uppercase text-[10px] tracking-[0.4em] mb-4 italic">Impressum</h3>
                                        <div className="space-y-4 font-bold uppercase">
                                            <p className="text-xl sm:text-2xl font-black tracking-tight italic">Niklas Ausserwoeger</p>
                                            <p className="text-zinc-500 text-[9px] sm:text-[10px] italic leading-relaxed lowercase tracking-normal">"{t.addressRequest}"</p>
                                            <p className="text-xs tracking-widest italic">4040 Linz, Österreich</p>
                                            <div className="pt-2">
                                                <p className="text-zinc-600 text-[9px] mb-1 tracking-[0.3em] uppercase font-bold">E-Mail Kontakt</p>
                                                <p className="text-cyan-400 text-sm font-black italic lowercase">niklas.ausserwoeger@gmail.com</p>
                                            </div>
                                        </div>
                                    </section>
                                    <section className="space-y-6">
                                        <div>
                                            <h3 className="text-cyan-500 font-black uppercase text-[10px] tracking-[0.4em] mb-3 italic">{t.legalPrivacy}</h3>
                                            <p className="text-zinc-500 text-[10px] italic leading-relaxed uppercase">{t.legalPrivacyText}</p>
                                        </div>
                                        <div>
                                            <h4 className="text-white font-bold text-xs uppercase tracking-widest mb-1 italic">{t.trademarkLabel}</h4>
                                            <p className="text-zinc-500 text-[10px] italic leading-relaxed uppercase">{t.trademarkText}</p>
                                        </div>
                                        <div>
                                            <h4 className="text-white font-bold text-xs uppercase tracking-widest mb-1 italic">Haftungsausschluss</h4>
                                            <p className="text-zinc-500 text-[10px] italic leading-relaxed uppercase">{t.liabilityText}</p>
                                        </div>
                                    </section>
                                    <div className="pt-8 border-t border-white/5 text-[9px] uppercase tracking-[0.4em] text-zinc-700 font-black text-center italic">
                                        Privatprojekt • Linz (OÖ) • {new Date().getFullYear()}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
