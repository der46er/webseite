                        const canvas = document.createElement("canvas"); canvas.width = img.width; canvas.height = img.height;

                });
                await addLogo();
                doc.setFont("helvetica", "bold").setFontSize(26).setTextColor("#d946ef").text("Tech-Angebot", 20, 30);
                doc.setFontSize(10).setTextColor("#9ca3af").text(`Erstellt am ${new Date().toLocaleDateString('de-DE')}`, 20, 38);
                doc.setDrawColor("#d946ef").line(20, 45, 190, 45);
                doc.setFontSize(12).setTextColor("#1f2937").text("Deine Anfrage:", 20, 60);
                doc.setFont("helvetica", "normal");
                const splitText = doc.splitTextToSize(input, 160); doc.text(splitText, 25, 70);
                const yPos = 75 + (splitText.length * 7);
                doc.setFillColor("#f3f4f6").roundedRect(20, yPos, 170, 40, 3, 3, 'F');
                doc.setFont("helvetica", "bold").setFontSize(10).setTextColor("#6b7280").text("ZUSAMMENFASSUNG", 30, yPos + 10);
                doc.setFontSize(14).setTextColor("#1f2937").text(`Dauer: ~ ${result.minutes} Minuten`, 30, yPos + 22);
                doc.setFontSize(18).setTextColor("#d946ef").text(`Preis: ${result.price} €`, 140, yPos + 22);
                // Added distinct red warning notice
                doc.setFontSize(12).setTextColor("#ef4444").text(t.pdfNotice, 20, yPos + 55); 
                
                doc.save(`Tech-Angebot-${Date.now()}.pdf`);
                setIsGenerating(false);
            };

            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/90 backdrop-blur-md animate-in">
                    <div className="glass-modal rounded-[2.5rem] w-full max-w-lg shadow-2xl overflow-hidden magenta-glow text-zinc-100">
                        <div className="p-8 border-b border-white/5 flex justify-between items-center text-zinc-100">
                            <h2 className="text-2xl font-black uppercase italic tracking-tighter">{t.configModalTitle}</h2>
                            <button onClick={onClose} className="w-10 h-10 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-zinc-400 hover:text-white transition-all"><X size={20} /></button>
                        </div>
                        <div className="p-8 space-y-6">
                            <textarea value={input} onChange={(e) => setInput(e.target.value)} placeholder={t.configPlaceholder} className="w-full h-32 bg-black/30 border border-white/10 rounded-2xl p-5 text-white placeholder-zinc-600 focus:outline-none focus:border-fuchsia-500/50 transition-all resize-none font-medium" />
                            {!isInputValid && input.length > 0 && <p className="text-fuchsia-500 text-[10px] font-black uppercase tracking-widest">{t.configHint}</p>}
                            <div className="flex gap-4">
                                <div className="flex-1 bg-white/5 p-5 rounded-2xl border border-white/5">
                                    <p className="text-[10px] text-zinc-500 font-black uppercase tracking-widest mb-1">{t.durationLabel}</p>
                                    <p className="text-3xl font-black italic">{result.minutes} <span className="text-base not-italic text-zinc-600">Min</span></p>
                                </div>
                                <div className="flex-1 bg-white/5 p-5 rounded-2xl border border-white/5 text-right">
                                    <p className="text-[10px] text-zinc-500 font-black uppercase tracking-widest mb-1">{t.priceLabel}</p>
                                    <p className="text-3xl font-black italic text-fuchsia-500">{result.price}€</p>
                                </div>
                            </div>
                            <button onClick={generatePDF} disabled={!isInputValid} className="w-full py-4 btn-magenta disabled:opacity-20 rounded-xl font-black uppercase tracking-[0.2em] text-xs transition-all shadow-lg flex items-center justify-center gap-2 text-white">
                                <Download size={16} /> {isGenerating ? "Generiere..." : t.configExport}
                            </button>

                    </div>
                </div>
            );
        };

        const ImageGallery = ({ images }) => {
            const [index, setIndex] = useState(0);
            useEffect(() => {
                const timer = setInterval(() => setIndex((prev) => (prev + 1) % images.length), 3500);
                return () => clearInterval(timer);
            }, [images]);
            return (
                <div className="w-full h-full relative">
                    {images.map((img, i) => (
                        <img key={i} src={img} className={`absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 ${i === index ? 'opacity-100' : 'opacity-0'}`} alt="" />
                    ))}
                </div>
            );
        };

        const App = () => {
            const [lang, setLang] = useState('de');
            const [showLegal, setShowLegal] = useState(false);
            const [showConfig, setShowConfig] = useState(false);
            const [showLangMenu, setShowLangMenu] = useState(false);
            const [selectedPkg, setSelectedPkg] = useState(null);
            const [descIndex, setDescIndex] = useState(0);
            const menuRef = useRef(null);
            const t = translations[lang];

            useEffect(() => {
                const interval = setInterval(() => setDescIndex(prev => (prev + 1) % t.dynamicDescriptions.length), 4000);
                return () => clearInterval(interval);
            }, [t.dynamicDescriptions]);

            useEffect(() => {
                const handleClickOutside = (event) => { if (menuRef.current && !menuRef.current.contains(event.target)) setShowLangMenu(false); };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);

                    </div>

                    <nav className="fixed top-0 w-full z-50 h-24 flex items-center px-6 md:px-12 backdrop-blur-md border-b border-white/5 bg-black/20">
                        <div className="flex-1"><a href="../" className="text-[10px] font-black tracking-[0.2em] text-zinc-500 hover:text-white transition-all flex items-center gap-2 uppercase italic"><ChevronLeft size={14} /> {t.back}</a></div>
                        <div className="flex items-center gap-3">
                             <img src="https://raw.githubusercontent.com/der46er/webseite/main/assets/favicon.png" alt="Logo" className="w-10 h-10 object-contain" />
                             <span className="header-logo-text text-2xl">that<span className="text-fuchsia-500">austrianone.</span></span>
                        </div>
                        <div className="flex-1 flex justify-end relative" ref={menuRef}>
                            <button onClick={() => setShowLangMenu(!showLangMenu)} className="flex items-center gap-3 px-8 py-3.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-full transition-all text-[11px] font-black uppercase tracking-[0.2em] text-white shadow-lg">
                                <span>{t.flag}</span> <span>{t.langName}</span> <ChevronDown size={14} className={showLangMenu ? 'rotate-180 transition-transform' : ''} />

                                </div>
                                <div className="flex flex-wrap items-center gap-3">
                                    <a href="mailto:niklas.ausserwoeger@gmail.com" className="w-16 h-16 glass-card rounded-full flex items-center justify-center text-zinc-400 hover:text-fuchsia-500 hover:scale-110 transition-all shadow-lg" title="E-Mail"><Mail size={28} /></a>

                                </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

                                    <div className="flex justify-between items-center mt-8"><span className="text-5xl font-black tracking-tighter italic">{pkg.price}</span><div className="w-12 h-12 rounded-full bg-white/5 flex items-center justify-center text-zinc-600 group-hover:bg-fuchsia-600 group-hover:text-white transition-all"><ChevronRight size={22} /></div></div>

                            <button onClick={() => setShowConfig(true)} className="relative group glass-card rounded-[2.5rem] p-10 text-left border-fuchsia-500/20 flex flex-col min-h-[360px] overflow-hidden text-zinc-100">

                            </button>
                        </div>

                        <div className="mt-8 glass-card rounded-[3.5rem] p-12 flex flex-col md:flex-row items-center justify-between gap-8 border-dashed border-zinc-800">
                            <div className="text-left text-zinc-100">
                                <h3 className="text-3xl font-black italic uppercase tracking-tight mb-2 uppercase">{t.hourlyRateTitle}</h3>
                                <p className="text-zinc-500 text-lg font-bold italic uppercase">{t.hourlyRateDesc}</p>
                            </div>
                            <div className="text-7xl font-black text-fuchsia-500 italic tracking-tighter">45€ / Std.</div>
                        </div>

                        <footer className="mt-32 flex flex-col items-center w-full">
                            <div className="glass-card rounded-[2.5rem] p-12 text-center w-full max-w-4xl border-zinc-900/50 mb-16 magenta-glow">
                                <div className="mb-6 flex justify-center text-zinc-100"><div className="w-12 h-12 rounded-full border border-fuchsia-500/30 flex items-center justify-center text-fuchsia-500"><Info size={24} /></div></div>
                                <p className="text-zinc-400 text-[10px] md:text-[12px] font-black uppercase tracking-[0.3em] leading-loose max-w-2xl mx-auto">{t.privateNotice}</p>
                                <div className="w-20 h-1 bg-fuchsia-500/20 mx-auto mt-8 rounded-full" />
                            </div>
                            <button onClick={() => setShowLegal(true)} className="px-12 py-4 bg-white/5 border border-white/5 rounded-full text-[12px] font-black tracking-[0.5em] text-zinc-500 hover:text-white transition-all uppercase mb-8 uppercase italic tracking-widest">{t.legal}</button>
                            <div className="text-zinc-800 text-[10px] font-black tracking-[0.7em] uppercase opacity-50">© {new Date().getFullYear()} — THAT AUSTRIAN ONE</div>
                        </footer>
                    </div>

                    {/* DETAIL VIEW / OVERLAY */}
                    {selectedPkg && (
                        <div className="fixed inset-0 z-[150] bg-[#0f1115] text-white overflow-y-auto animate-in custom-scroll">
                            <nav className="fixed w-full z-50 bg-[#0f1115]/80 backdrop-blur-xl border-b border-white/5 h-20 flex items-center px-6">
                                <button onClick={() => setSelectedPkg(null)} className="flex items-center gap-2 text-zinc-400 hover:text-white transition-all font-black uppercase tracking-widest text-[10px]">
                                    <ChevronLeft size={16} /> {t.back}
                                </button>
                            </nav>
                            <div className="pt-32 pb-20 px-6 max-w-5xl mx-auto">
                                <div className="relative rounded-[3rem] overflow-hidden bg-[#161920] border border-white/5 shadow-2xl">
                                    <div className="aspect-video w-full relative bg-black/40 flex items-center justify-center overflow-hidden">
                                        {selectedPkg.video ? (
                                            <video src={selectedPkg.video} autoPlay loop muted playsInline className="w-full h-full object-cover opacity-90" />

                                            <ImageGallery images={selectedPkg.images} />

                                            <img src={selectedPkg.image} className={`w-full h-full ${selectedPkg.id === 'windows' ? 'object-contain scale-90' : 'object-cover'} opacity-90`} alt="" />
                                        )}
                                        <div className="absolute inset-0 bg-gradient-to-t from-[#161920] via-transparent to-transparent" />
                                        <div className="absolute bottom-10 left-10"><h1 className="text-4xl md:text-6xl font-black tracking-tight text-white uppercase italic">{selectedPkg.title}</h1></div>
                                        {selectedPkg.attribution && <div className="absolute top-6 right-8 text-[9px] text-zinc-500 font-bold uppercase tracking-widest opacity-60 italic">{selectedPkg.attribution}</div>}
                                    </div>
                                    <div className="p-10 md:p-14">
                                        <div className="flex flex-col md:flex-row gap-16 items-start">
                                            <div className="flex-grow text-left">
                                                <p className="text-zinc-400 text-xl leading-relaxed mb-12 font-medium italic">{selectedPkg.details}</p>
                                                {selectedPkg.partners && (
                                                    <div className="flex gap-6 mb-12 flex-wrap">
                                                        {selectedPkg.partners.map(p => (
                                                            <div key={p.name} className="flex items-center gap-3 bg-white/5 p-4 rounded-[1.5rem] border border-white/5">
                                                                <img src={p.logo} className="h-7 w-auto object-contain" alt="" />
                                                                <span className="text-[10px] font-black uppercase tracking-[0.2em] text-zinc-300">{p.name}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                                    {selectedPkg.features.map((f, i) => (
                                                        <div key={i} className="flex items-center gap-4 text-zinc-100 font-bold text-sm uppercase italic">
                                                            <div className="w-6 h-6 rounded-full bg-fuchsia-500/10 flex items-center justify-center text-fuchsia-500 shrink-0 border border-fuchsia-500/20"><Check size={12} /></div>
                                                            {f}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="w-full md:w-80 shrink-0">
                                                <div className="p-10 rounded-[2.5rem] bg-white/[0.02] border border-white/5 text-center shadow-2xl">
                                                    
                                                    {/* RustDesk Logic for Online Support */}
                                                    {selectedPkg.id === 'online' && (
                                                        <div className="mb-8 p-6 bg-fuchsia-900/20 border border-fuchsia-500/20 rounded-2xl">
                                                            <div className="text-fuchsia-500 mb-2 flex justify-center"><MonitorDown size={28} /></div>
                                                            <p className="text-[10px] font-black uppercase tracking-wider text-fuchsia-100 mb-4 leading-relaxed">{t.rustDeskReq}</p>
                                                            <a href="https://rustdesk.com/" target="_blank" className="block w-full py-3 bg-fuchsia-500/10 hover:bg-fuchsia-500/20 text-fuchsia-400 border border-fuchsia-500/20 rounded-xl font-bold transition-all text-[9px] uppercase tracking-widest">{t.rustDeskLink}</a>
                                                        </div>

                                                    <div className="text-zinc-500 text-[10px] font-black uppercase tracking-[0.3em] mb-3 italic">{t.fixpreisLabel}</div>
                                                    <div className="text-6xl font-black text-white mb-10 tracking-tighter italic">{selectedPkg.price}</div>
                                                    <a href={`mailto:niklas.ausserwoeger@gmail.com?subject=Anfrage: ${selectedPkg.title}`} className="block w-full py-5 bg-fuchsia-600 hover:bg-fuchsia-500 text-white rounded-2xl font-black transition-all shadow-xl shadow-fuchsia-500/20 uppercase tracking-widest text-[10px]">{t.contactBtn}</a>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    <ConfiguratorModal isOpen={showConfig} onClose={() => setShowConfig(false)} t={t} />
                    
                    {/* Legal Modal */}
                    {showLegal && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-black/95 backdrop-blur-3xl animate-in">
                            <div className="glass-modal rounded-[3rem] w-full max-w-3xl max-h-[85vh] overflow-hidden flex flex-col shadow-2xl magenta-glow">
                                <div className="p-10 border-b border-white/5 flex justify-between items-center text-zinc-100">
                                    <h2 className="text-2xl font-black uppercase italic tracking-tighter">{t.infoTitle}</h2>
                                    <button onClick={() => setShowLegal(false)} className="p-3 text-zinc-500 hover:text-white transition-all"><X size={24} /></button>
                                </div>
                                <div className="p-10 overflow-y-auto custom-scroll space-y-12 text-left">
                                    <section>
                                        <h3 className="text-fuchsia-500 font-black uppercase text-[10px] tracking-[0.4em] mb-6 italic">{t.legalModal.imprint}</h3>
                                        <div className="space-y-4 font-bold text-zinc-100 uppercase">
                                            <p className="text-2xl font-black tracking-tight italic">Niklas Ausserwoeger</p>
                                            <p className="text-zinc-500 text-[10px] italic leading-relaxed lowercase tracking-normal">"{t.legalModal.addressRequest}"</p>
                                            <p className="text-xs tracking-widest italic">{t.legalModal.address}</p>
                                            <div className="pt-4">
                                                <p className="text-zinc-600 text-[9px] mb-1 tracking-[0.3em] uppercase">{t.legalModal.contact}</p>
                                                <p className="text-fuchsia-400 text-sm font-black italic tracking-normal lowercase">niklas.ausserwoeger@gmail.com</p>

                                        </div>

                                    <section>

                                        <p className="text-zinc-500 text-[11px] font-bold leading-relaxed italic uppercase tracking-wider">{t.legalModal.liabilityText}</p>
                                    </section>
                                    <div className="pt-10 border-t border-white/5 text-[10px] uppercase tracking-[0.4em] text-zinc-700 font-black text-center italic uppercase">Österreichische Privatseite • Nachbarschaftshilfe</div>

        const root = ReactDOM.createRoot(document.getElementById('root'));

</body>
