        const translations = {
            de: {
                flag: "🇦🇹", langName: "Deutsch", back: "ZURÜCK", offer: "HOBBY-SUPPORT",
                title: "Tech-Support & Hilfe.",
                dynamicDescriptions: [
                    "Ich helfe dir privat bei Hardware-Problemen.",
                    "Nachbarschaftshilfe für deine Tech-Sorgen.",
                    "Unterstützung als Schüler aus Leidenschaft.",
                    "Kein Gewerbe, reine private Unterstützung."
                ],
                consultationPrice: "5€ Spende", consultationTitle: "AUFWAND", consultationDesc: "Orientierung für investierte Zeit.",
                pricingTitle: "Wähle einen Bereich", hourlyRateTitle: "SONSTIGES",
                configTitle: "ZEIT-RECHNER", configDesc: "Schreibe mir, was du brauchst (mit Beistrichen).",
                configModalTitle: "AUFWANDS-BERECHNER",
                configPlaceholder: "z.B. BIOS Update, SSD Klonen...",
                configExport: "PDF SPEICHERN", durationLabel: "DAUER", priceLabel: "RICHTWERT",
                legal: "RECHTLICHES & INFO", 
                privateNotice: "ICH BIN EINE PRIVATPERSON. DIES IST KEINE GEWERBLICHE DIENSTLEISTUNG, SONDERN PRIVATHILFE.",
                disclaimerNotice: "Alle Preise dienen lediglich als Referenz für eine Zeitentschädigung. Freiwillige Spenden sind willkommen und werden sehr geschätzt!",
                contactBtn: "ANFRAGE SENDEN",
                packages: [
                    { id: "pc-bau", title: "PC BAU-HILFE", short: "Support beim Zusammenbau deines PCs.", price: "70€*", details: "Ich helfe dir privat beim Aufbau deines PCs, achte auf das Kabelmanagement und wir testen alles gemeinsam.", features: ["Gefälligkeit beim Bau", "Kabel-Hilfe", "BIOS Setup", "Technik-Test"] },
                    { id: "windows", title: "SOFTWARE-HILFE", short: "Hilfe bei Installation & Einrichtung.", price: "45€*", details: "Ich helfe dir bei der Neuinstallation von Windows und deiner gewünschten Programme.", features: ["Windows Hilfe", "Einrichtung", "Treiber-Check", "Updates"] },
                    { id: "cleaning", title: "REINIGUNG", short: "Hobby-Pflege für deine Hardware.", price: "35€*", details: "Wir säubern deinen PC gemeinsam und tragen bei Bedarf neue Paste auf.", features: ["Hobby-Reinigung", "Paste erneuern", "Lüfterpflege", "Checkup"] },
                    { id: "diagnosis", title: "FEHLERSUCHE", short: "Wir schauen uns das Problem an.", price: "20€*", details: "Analyse von Fehlern im Rahmen einer privaten Hilfestellung.", features: ["Checkup", "Analyse", "Beratung", "Planung"] },
                    { id: "online", title: "FERN-SUPPORT", short: "Hilfe via Discord oder RustDesk.", price: "15€*", details: "Ich schalte mich privat bei dir auf, um Software-Fragen zu klären.", features: ["Discord Support", "RustDesk Hilfe", "Privat-Sitzung", "Gefälligkeit"] }
                ]
            },
            en: {
                flag: "🇬🇧", langName: "English", back: "BACK", offer: "HOBBY SUPPORT",
                title: "Tech Support & Help.",
                dynamicDescriptions: [
                    "Private support for hardware issues.",
                    "Neighborhood help for your tech worries.",
                    "Support as a student driven by passion.",
                    "Non-commercial, purely private support."
                ],
                consultationPrice: "5€ donation", consultationTitle: "EFFORT", consultationDesc: "Orientation for time spent.",
                pricingTitle: "Categories", hourlyRateTitle: "OTHERS",
                configTitle: "TIME CALCULATOR", configDesc: "Describe what you need (separated by commas).",
                configModalTitle: "EFFORT CALCULATOR",
                configPlaceholder: "e.g., BIOS Update, SSD Cloning...",
                configExport: "SAVE PDF", durationLabel: "DURATION", priceLabel: "REFERENCE",
                legal: "LEGAL & INFO", 
                privateNotice: "I AM A PRIVATE INDIVIDUAL. THIS IS PRIVATE NEIGHBORHOOD HELP.",
                disclaimerNotice: "All prices are for reference only. Voluntary donations are welcome and highly appreciated!",
                contactBtn: "SEND INQUIRY",
                packages: [
                    { id: "pc-bau", title: "PC BUILD HELP", short: "Support for assembling your PC.", price: "70€*", details: "Private build assistance and testing.", features: ["Build help", "Cables", "BIOS Setup", "Test"] }
                ]
            }
        };

        const ConfiguratorModal = ({ isOpen, onClose, t }) => {
            const [input, setInput] = useState('');
            const [result, setResult] = useState({ minutes: 0, price: 0 });
            const isInputValid = input.trim().length >= 3;

            useEffect(() => {
                if (!isInputValid) { setResult({ minutes: 0, price: 0 }); return; }
                const items = input.split(',').map(i => i.trim()).filter(i => i.length >= 3);
                const mins = items.length * 20 + 10;
                setResult({ minutes: mins, price: Math.round((mins/60)*45/5)*5 + 5 });
            }, [input, isInputValid]);

            const generatePDF = async () => {
                if (!isInputValid) return;
                await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
                const doc = new window.jspdf.jsPDF();
                doc.setFont("helvetica", "bold").setFontSize(22).setTextColor("#d946ef").text("Hobby-Support Schätzung", 20, 30);
                doc.setFontSize(10).setTextColor("#9ca3af").text(`Erstellt am ${new Date().toLocaleDateString('de-DE')}`, 20, 38);
                doc.save(`Support-Anfrage-${Date.now()}.pdf`);
            };

            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[150] flex items-center justify-center p-4 bg-black/95 backdrop-blur-md animate-in">
                    <div className="glass-modal rounded-[2rem] w-full max-w-lg shadow-2xl overflow-hidden magenta-glow">

                        <div className="p-6 sm:p-8 space-y-6">

                            <div className="flex gap-3 sm:gap-4">

                                    <p className="text-[9px] text-zinc-500 font-black uppercase tracking-widest mb-1">{t.durationLabel}</p>
                                    <p className="text-xl sm:text-3xl font-black italic">{result.minutes} <span className="text-xs not-italic text-zinc-600">Min</span></p>
                                </div>
                                <div className="flex-1 bg-white/5 p-4 sm:p-5 rounded-2xl border border-white/5 text-center">
                                    <p className="text-[9px] text-zinc-500 font-black uppercase tracking-widest mb-1">{t.priceLabel}</p>
                                    <p className="text-xl sm:text-3xl font-black italic text-fuchsia-500">{result.price}€*</p>
                                </div>
                            </div>
                            <div className="bg-fuchsia-500/5 border border-fuchsia-500/10 p-4 rounded-xl">
                                <p className="text-[9px] sm:text-[10px] text-zinc-400 font-medium italic leading-relaxed text-center">
                                    {t.disclaimerNotice}
                                </p>
                            </div>
                            <button onClick={generatePDF} disabled={!isInputValid} className="w-full py-4 btn-magenta disabled:opacity-20 rounded-xl font-black uppercase tracking-[0.2em] text-[10px] transition-all shadow-lg flex items-center justify-center gap-2 text-white">
                                <Download size={16} /> {t.configExport}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [lang, setLang] = useState('de');
            const [showLegal, setShowLegal] = useState(false);
            const [showConfig, setShowConfig] = useState(false);
            const [showLangMenu, setShowLangMenu] = useState(false);
            const [selectedPkg, setSelectedPkg] = useState(null);
            const [descIndex, setDescIndex] = useState(0);
            const menuRef = useRef(null);
            const t = translations[lang];

            useEffect(() => {
                const interval = setInterval(() => setDescIndex(prev => (prev + 1) % t.dynamicDescriptions.length), 4000);
                return () => clearInterval(interval);
            }, [t.dynamicDescriptions]);

            useEffect(() => {
                const handleClickOutside = (event) => { if (menuRef.current && !menuRef.current.contains(event.target)) setShowLangMenu(false); };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            return (
                <div className="min-h-screen bg-[#0b0d11] text-zinc-100 selection:bg-fuchsia-500/30 overflow-x-hidden relative pb-12">
                    {/* Background Glow */}
                    <div className="fixed inset-0 pointer-events-none z-0">
                        <div className="absolute top-[-10%] left-20 w-[60%] h-[40%] bg-fuchsia-600/5 blur-[120px] rounded-full" />

                             <span className="header-logo-text text-lg sm:text-2xl">that<span className="text-fuchsia-500">austrianone.</span></span>
                        </div>
                        <div className="flex-1 flex justify-end relative" ref={menuRef}>

                                <span>{t.flag}</span> <span className="hidden xs:inline">{t.langName}</span> <ChevronDown size={14} className={showLangMenu ? 'rotate-180 transition-transform' : ''} />
                            </button>
                            {showLangMenu && (
                                <div className="absolute right-0 top-14 sm:top-16 w-36 sm:w-48 glass-modal rounded-xl sm:rounded-2xl overflow-hidden shadow-2xl animate-in z-50">
                                    {Object.keys(translations).map((key) => (
                                        <button key={key} onClick={() => { setLang(key); setShowLangMenu(false); }} className={`flex items-center gap-3 w-full px-4 py-4 sm:px-6 sm:py-5 text-left text-[10px] sm:text-[11px] font-black uppercase transition-colors hover:bg-white/5 ${lang === key ? 'text-fuchsia-500 bg-fuchsia-500/5' : 'text-zinc-400'}`}>
                                            <span>{translations[key].flag}</span> <span>{translations[key].langName}</span>
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>
                    </nav>

                    <div className="relative z-10 max-w-6xl mx-auto px-4 sm:px-6 pt-32 sm:pt-48 animate-in text-center sm:text-left">

                            <p className="text-zinc-500 text-lg sm:text-2xl font-medium italic mb-10 max-w-2xl leading-relaxed fade-text min-h-[3rem]">"{t.dynamicDescriptions[descIndex]}"</p>
