<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Nick</title>
    
    <link rel="icon" type="image/png" href="./assets/favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Local Fonts */
        @font-face { font-family: 'Inter'; src: url('./assets/fonts/inter-v12-latin-regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
        @font-face { font-family: 'Inter'; src: url('./assets/fonts/inter-v12-latin-900.woff2') format('woff2'); font-weight: 900; font-display: swap; }
        
        :root { --theme-color: #22c55e; --theme-rgb: 34, 197, 94; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0b0d11; 
            color: white; 
            margin: 0; 
            padding: 0; 
            position: relative;
        }

        /* Fixed blurred WebP background layer using direct raw asset streaming url endpoints */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("https://raw.githubusercontent.com/der46er/webseite/main/assets/backgounds/waves.webp");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(8px);
            transform: scale(1.05);
            opacity: 0.4;
            z-index: -2;
        }

        /* Seamless SVG grain noise overlay positioned on top of the image */
        body::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.015'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: -1;
        }
        
        .animate-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Dynamic Theme Classes */
        .theme-text { color: var(--theme-color); }
        .theme-bg-glow { background-color: rgba(var(--theme-rgb), 0.12); filter: blur(180px); }
        .theme-border-hover:hover { border-color: rgba(var(--theme-rgb), 0.5) !important; }
    </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden selection:bg-white/10 relative">
    
    <div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute -top-[25%] -left-[25%] w-[80%] h-[80%] rounded-full theme-bg-glow transition-all duration-1000 opacity-50"></div>
        <div class="absolute -bottom-[25%] -right-[25%] w-[80%] h-[80%] rounded-full theme-bg-glow transition-all duration-1000 opacity-50"></div>
    </div>

    <main class="relative z-10 max-w-5xl mx-auto px-4 sm:px-6 w-full flex-grow flex flex-col justify-center py-6 sm:py-8 h-full min-h-0">
        
        <div class="w-full text-center shrink-0 mb-6 sm:mb-8 animate-in" style="animation-delay: 0.1s; opacity: 0;">
            <h1 id="hero-title" class="text-4xl sm:text-5xl md:text-6xl font-black italic uppercase tracking-tighter text-white mb-2">
                </h1>
            <p id="hero-desc" class="text-zinc-400 text-xs sm:text-sm md:text-base font-medium max-w-xl mx-auto tracking-wide">
                </p>
        </div>

        <div id="bento-grid" class="w-full grid grid-cols-2 md:grid-cols-4 grid-rows-5 md:grid-rows-3 gap-3 sm:gap-4 flex-grow min-h-0 animate-in" style="animation-delay: 0.2s; opacity: 0;">
            </div>
    </main>

    <footer class="w-full flex justify-between items-center px-6 py-4 shrink-0 relative z-10 select-none">
        <button onclick="toggleLang()" id="lang-indicator" class="focus:outline-none hover:scale-105 active:scale-95 transition-all duration-200">
        </button>
        <p onclick="window.location.href='https://thataustrianone.eu/legal/'" class="cursor-pointer text-zinc-600 text-[10px] sm:text-xs font-black italic tracking-widest uppercase opacity-70 hover:opacity-100 hover:text-white transition-all duration-300">
            © <span id="year">2026</span> — @der_46er
        </p>
    </footer>

    <div id="cookie-banner" class="hidden fixed bottom-0 left-0 w-full bg-[#0b0d11]/95 backdrop-blur-xl border-t border-white/10 p-4 sm:p-6 z-[200] flex flex-col sm:flex-row justify-between items-center gap-4 animate-in">
        <div class="text-xs sm:text-sm text-zinc-300 max-w-3xl font-medium leading-relaxed">
            <p id="cookie-text"></p>
        </div>
        <div class="flex gap-3 flex-shrink-0 w-full sm:w-auto">
            <button onclick="handleCookie('denied')" id="cookie-decline" class="flex-1 sm:flex-none px-6 py-3 rounded-xl font-bold text-xs text-zinc-500 hover:text-white hover:bg-white/5 border border-white/10 transition-colors uppercase tracking-widest"></button>
            <button onclick="handleCookie('granted')" id="cookie-accept" class="flex-1 sm:flex-none px-6 py-3 rounded-xl font-bold text-xs bg-white text-black hover:bg-zinc-200 transition-colors uppercase tracking-widest shadow-lg"></button>
        </div>
    </div>

    <script>
        document.getElementById('year').innerText = new Date().getFullYear();

        // Standardized upward redirection arrow pointing up-right across every layout block element
        const arrowUpRight = '<line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline>';

        const cardData = [
            { 
                id: 'projects', 
                href: "https://thataustrianone.eu/projects/", 
                isExternal: false,
                gridClass: "col-span-2 row-span-1",
                iconClass: "text-zinc-300 bg-zinc-300/10",
                hoverBorder: "hover:border-zinc-300/50",
                hoverShadow: "hover:shadow-[0_0_50px_-5px_rgba(212,212,216,0.35)]",
                icon: '<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',
                arrowIcon: arrowUpRight
            },
            { 
                id: 'shop', 
                href: "https://thataustrianone.eu/shop/", 
                isExternal: false,
                gridClass: "col-span-2 row-span-1",
                iconClass: "text-orange-500 bg-orange-500/10",
                hoverBorder: "hover:border-orange-500/50",
                hoverShadow: "hover:shadow-[0_0_50px_-5px_rgba(249,115,22,0.35)]",
                icon: '<path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>',
                arrowIcon: arrowUpRight
            },
            { 
                id: 'products', 
                href: "https://thataustrianone.eu/products/", 
                isExternal: false,
                gridClass: "col-span-1 row-span-1",
                iconClass: "text-emerald-500 bg-emerald-500/10",
                hoverBorder: "hover:border-emerald-500/50",
                hoverShadow: "hover:shadow-[0_0_50px_-5px_rgba(16,185,129,0.35)]",
                icon: '<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>',
                arrowIcon: arrowUpRight
            },
            { 
                id: 'services', 
                href: "https://thataustrianone.eu/services/", 
                isExternal: false,
                gridClass: "col-span-2 row-span-1",
                iconClass: "text-purple-500 bg-purple-500/10",
                hoverBorder: "hover:border-purple-500/30",
                hoverShadow: "hover:shadow-[0_0_40px_-10px_rgba(168,85,247,0.15)]",
                icon: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
                arrowIcon: arrowUpRight
            },
            { 
                id: 'about', 
                href: "https://thataustrianone.eu/about-me/", 
                isExternal: false,
                gridClass: "col-span-1 row-span-1",
                iconClass: "text-blue-500 bg-blue-500/10",
                hoverBorder: "hover:border-blue-500/30",
                hoverShadow: "hover:shadow-[0_0_40px_-10px_rgba(59,130,246,0.15)]",
                icon: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
                arrowIcon: arrowUpRight
            },
            { 
                id: 'socials', 
                href: "https://thataustrianone.eu/socials", 
                isExternal: false,
                gridClass: "col-span-2 md:col-span-4 row-span-1",
                iconClass: "text-red-500 bg-red-500/10",
                hoverBorder: "theme-border-hover",
                hoverShadow: "hover:shadow-[0_0_40px_-10px_rgba(239,68,68,0.2)]",
                icon: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>',
                arrowIcon: arrowUpRight
            }
        ];

        // --- TRANSLATIONS ---
        const translations = {
            de: {
                flag: "https://raw.githubusercontent.com/der46er/webseite/main/assets/flags/austria-flag.webp",
                alt: "Austria Flag",
                heroTitle: "Willkommen<span class='theme-text'>.</span>",
                heroDesc: "Entdecke meine Hardware, Software-Projekte, Socials und mehr",
                cookieText: "Wir verwenden Cookies und Google Analytics, um unsere Website zu verbessern und den Traffic zu analysieren. Stimmst du der Nutzung zu?",
                cookieDecline: "Ablehnen", cookieAccept: "Akzeptieren",
                content: {
                    projects: { title: "Projekte", desc: "Webseiten, Themes & mehr" },
                    shop: { title: "Hardware Marktplatz", desc: "Check meine aktuellen Inserate" },
                    products: { title: "Produkte", desc: "Affiliate" },
                    services: { title: "Tech Tutorials", desc: "Simple Tutorials" },
                    about: { title: "Über Mich", desc: ";]]" },
                    socials: { title: "Socials", desc: "Folge mir auf meinen Kanälen" }
                }
            },
            en: {
                flag: "https://raw.githubusercontent.com/der46er/webseite/main/assets/flags/united-kingdom-flag.webp",
                alt: "UK Flag",
                heroTitle: "Welcome<span class='theme-text'>.</span>",
                heroDesc: "Explore my hardware listings, software projects, socials, and more",
                cookieText: "We use cookies and Google Analytics to improve our website and analyze traffic. Do you accept the use of cookies?",
                cookieDecline: "Decline", cookieAccept: "Accept",
                content: {
                    projects: { title: "Projects", desc: "Websites, Themes & more" },
                    shop: { title: "Hardware Marketplace", desc: "Browse my latest listings" },
                    products: { title: "Products", desc: "Affiliate" },
                    services: { title: "Tech Tutorials", desc: "Simple Tutorials" },
                    about: { title: "About Me", desc: ";]]" },
                    socials: { title: "Socials", desc: "Follow me on my channels" }
                }
            }
        };

        let currentLang = localStorage.getItem('siteLang') || 'en';

        // --- RENDER LOGIC ---
        function render() {
            const t = translations[currentLang];
            
            document.getElementById('hero-title').innerHTML = t.heroTitle;
            document.getElementById('hero-desc').innerText = t.heroDesc;
            
            document.getElementById('lang-indicator').innerHTML = `<img src="${t.flag}" alt="${t.alt}" class="w-7 h-auto rounded-md shadow-md object-cover opacity-80 hover:opacity-100 transition-opacity duration-200">`;
            
            document.getElementById('cookie-text').innerText = t.cookieText;
            document.getElementById('cookie-decline').innerText = t.cookieDecline;
            document.getElementById('cookie-accept').innerText = t.cookieAccept;

            const grid = document.getElementById('bento-grid');
            grid.innerHTML = cardData.map(c => {
                const text = t.content[c.id];
                
                // Unified card typographic header size allocations
                const titleClass = ['projects', 'shop', 'services', 'socials'].includes(c.id) ? 'text-lg sm:text-xl md:text-2xl' : 'text-base sm:text-lg';
                const descClass = ['projects', 'shop', 'services', 'socials'].includes(c.id) ? 'text-[10px] sm:text-xs md:text-sm' : 'text-[9px] sm:text-[10px]';

                // Unified structure layout logic across all cards:
                // - Icon wrapped and kept on top-left
                // - Typography details shifted down to the bottom-left edge boundary
                // - Interaction navigation icon aligned inside the bottom-right corner zone
                return `
                <a href="${c.href}" target="${c.isExternal ? '_blank' : '_self'}" class="group relative bg-white/[0.03] hover:bg-white/[0.07] border border-white/[0.05] hover:border-white/[0.12] rounded-[1.2rem] shadow-lg transition-all duration-200 ${c.hoverBorder} ${c.hoverShadow} active:scale-[0.99] ${c.gridClass} p-4 sm:p-5 md:p-6 flex flex-col justify-between overflow-hidden">
                    
                    <div class="flex items-start justify-start w-full">
                        <div class="w-10 h-10 sm:w-12 sm:h-12 md:w-14 md:h-14 rounded-xl sm:rounded-2xl flex items-center justify-center shrink-0 transition-transform duration-500 group-hover:-translate-y-1 ${c.iconClass} z-10">
                            <svg class="w-5 h-5 sm:w-6 sm:h-6 md:w-7 md:h-7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">${c.icon}</svg>
                        </div>
                    </div>
                    
                    <div class="z-10 mt-auto pt-4 flex items-end justify-between w-full">
                        <div class="flex flex-col justify-end min-w-0 pr-8">
                            <h2 class="${titleClass} font-black text-white tracking-tight italic uppercase leading-none mb-1 group-hover:text-white transition-colors truncate">${text.title}</h2>
                            <p class="text-zinc-500 ${descClass} font-bold uppercase tracking-widest truncate">${text.desc}</p>
                        </div>
                        
                        <div class="text-zinc-700 group-hover:text-white transition-all transform group-hover:translate-x-1 group-hover:-translate-y-1 shrink-0 pb-0.5">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${c.arrowIcon}</svg>
                        </div>
                    </div>
                </a>
                `;
            }).join('');
        }

        window.toggleLang = () => {
            currentLang = currentLang === 'en' ? 'de' : 'en';
            localStorage.setItem('siteLang', currentLang);
            render();
        };

        const cookieBanner = document.getElementById('cookie-banner');
        const cookieConsent = localStorage.getItem('siteCookieConsent');

        function injectGA() {
            if (document.getElementById('ga-script')) return;
            const script1 = document.createElement('script');
            script1.id = 'ga-script';
            script1.async = true;
            script1.src = 'https://www.googletagmanager.com/gtag/js?id=G-0WHX0WMFTC';
            document.head.appendChild(script1);

            const script2 = document.createElement('script');
            script2.innerHTML = `
                window.dataLayer = window.dataLayer || [];
                function gtag(){dataLayer.push(arguments);}
                gtag('js', new Date());
                gtag('config', 'G-0WHX0WMFTC');
            `;
            document.head.appendChild(script2);
        }

        if (!cookieConsent) {
            cookieBanner.classList.remove('hidden');
        } else if (cookieConsent === 'granted') {
            injectGA();
        }

        window.handleCookie = (status) => {
            localStorage.setItem('siteCookieConsent', status);
            cookieBanner.classList.add('opacity-0', 'translate-y-full');
            setTimeout(() => cookieBanner.classList.add('hidden'), 400);
            if (status === 'granted') injectGA();
        };

        render();

        fetch('./assets/theme.txt', { cache: 'no-cache' }).then(r => r.text()).then(t => {
            let hex = t.trim().startsWith('#') ? t.trim() : '#' + t.trim();
            if (/^#([0-9A-F]{3}|[0-9A-F]{6})$/i.test(hex)) {
                let c = hex.replace('#', '');
                if(c.length === 3) c = c.split('').map(x=>x+x).join('');
                document.documentElement.style.setProperty('--theme-color', hex);
                document.documentElement.style.setProperty('--theme-rgb', `${parseInt(c.substr(0,2),16)}, ${parseInt(c.substr(2,2),16)}, ${parseInt(c.substr(4,2),16)}`);
            }
        }).catch(()=>{});

    </script>
</body>
</html>
