<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>thataustrianone | Home</title>
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/der46er/webseite/main/assets/favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* Lokale Schriftarten */
        @font-face {
            font-family: 'Inter';
            src: url('./assets/fonts/inter-v12-latin-regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Inter';
            src: url('./assets/fonts/inter-v12-latin-900.woff2') format('woff2');
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0b0d11; 
            margin: 0; 
            padding: 0; 
            overflow-x: hidden;
            color: white;
        }
        
        .header-logo-text {
            font-weight: 900;
            font-style: normal;
            text-transform: lowercase;
            letter-spacing: -0.04em;
        }

        @media (min-width: 640px) {
            .header-logo-text {
                letter-spacing: -0.06em;
            }
        }

        .animate-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        .logo-themed {
            filter: sepia(100%) saturate(300%) hue-rotate(80deg) brightness(100%) drop-shadow(0 0 5px rgba(34, 197, 94, 0.5));
            transition: all 0.3s ease;
        }

        .glass-modal {
            background: #0b0d11;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Icons ---
        const ChevronRight = ({size}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>;
        const ChevronDown = ({size, className}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>;
        const Info = ({size}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>;
        const X = ({size}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
        const ShoppingCart = ({className}) => <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>;
        const Share = ({className}) => <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>;
        const UserIcon = ({className}) => <svg className={className} fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
        const TechIcon = ({className}) => <svg className={className} fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>;
        const CodeIcon = ({className}) => <svg className={className} fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>;

        const translations = {
            de: {
                code: "AT", name: "DEUTSCH", welcome: "Willkommen",
                description: "Technik Enthusiast & Content Creator",
                aboutTitle: "Meine Story", aboutDesc: "Wer steckt hinter thataustrianone?",
                shopTitle: "Hardware Marketplace", shopDesc: "Check meine aktuellen Inserate",
                servicesTitle: "Tech-Hilfe & Support", servicesDesc: "Zusammenbau, Reinigung & mehr",
                projectsTitle: "Meine Projekte", projectsDesc: "Software, Webseiten & Experimente",
                socialTitle: "Social Links", socialDesc: "Folge mir auf meinen Kanälen",
                legal: "RECHTLICHES & INFO", legalTitle: "Rechtliche Informationen",
                legalPrivacy: "Datenschutz & Dienste",
                legalPrivacyText: "Diese Webseite ist eine private Präsenz. Um die Privatsphäre der Besucher zu schützen, werden Schriftarten lokal gehostet. IP-Adressen werden technisch bedingt übertragen, jedoch nicht gespeichert.",
                addressRequest: "Die vollständige Anschrift ist aus Datenschutzgründen nur auf begründete Anfrage verfügbar.",
                trademarkLabel: "Urheberrecht & Marken",
                trademarkText: "Alle verwendeten Markennamen sind Eigentum der jeweiligen Inhaber. Fotos sind Privataufnahmen von Niklas Ausserwoeger.",
                liabilityLabel: "Haftungsausschluss",
                liabilityText: "Keine Haftung für externe Links oder Hardwareschäden bei privater Hilfe. Backups sind Pflicht!"
            },
            en: {
                code: "GB", name: "ENGLISH", welcome: "Welcome",
                description: "Tech Enthusiast & Content Creator",
                aboutTitle: "My Story", aboutDesc: "Who is thataustrianone?",
                shopTitle: "Hardware Marketplace", shopDesc: "Browse my latest listings",
                servicesTitle: "Tech Help & Support", servicesDesc: "Assembly, cleaning & more",
                projectsTitle: "My Projects", projectsDesc: "Software, websites & experiments",
                socialTitle: "Social Links", socialDesc: "Follow me on my channels",
                legal: "LEGAL & INFO", legalTitle: "Legal Information",
                legalPrivacy: "Privacy & Services",
                legalPrivacyText: "This website is a private project. Fonts are hosted locally. IP addresses are transmitted for technical purposes only.",
                addressRequest: "Full address available upon request for privacy reasons.",
                trademarkLabel: "Copyright & Trademarks",
                trademarkText: "All brand names are property of their owners. Photos are private photography by Niklas Ausserwoeger.",
                liabilityLabel: "Disclaimer",
                liabilityText: "No liability for external links or hardware damage during private assistance. Backups are mandatory!"
            }
        };

        const MainCard = ({ title, desc, icon: Icon, href, isExternal }) => (
            <a 
                href={href} 
                target={isExternal ? "_blank" : "_self"}
                className="group flex items-center gap-4 sm:gap-6 p-4 sm:p-6 bg-white/[0.03] hover:bg-white/[0.07] border border-white/[0.05] hover:border-green-500/30 rounded-[1.2rem] sm:rounded-[1.5rem] transition-all duration-200 active:scale-[0.99] shadow-lg relative overflow-hidden"
            >
                <div className="w-12 h-12 sm:w-16 sm:h-16 rounded-xl flex items-center justify-center bg-white/5 border border-white/5 group-hover:scale-105 transition-transform duration-300 shadow-inner shrink-0">
                    <Icon className="w-6 h-6 sm:w-8 sm:h-8 text-white group-hover:text-green-500 transition-colors" />
                </div>
                <div className="text-left flex-grow overflow-hidden">
                    <h2 className="text-lg sm:text-2xl font-black text-white tracking-wide group-hover:translate-x-1 transition-transform duration-300 italic uppercase leading-none mb-1 truncate">{title}</h2>
                    <p className="text-zinc-500 text-[10px] sm:text-xs font-bold uppercase tracking-widest truncate sm:whitespace-normal">{desc}</p>
                </div>
                <div className="text-zinc-700 group-hover:text-white transition-all group-hover:translate-x-1 shrink-0">
                    <ChevronRight size={24} />
                </div>
            </a>
        );

        const App = () => {
            const [lang, setLang] = useState('de');
            const [showLegal, setShowLegal] = useState(false);
            const [showLangMenu, setShowLangMenu] = useState(false);
            const menuRef = useRef(null);
            const t = translations[lang];

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (menuRef.current && !menuRef.current.contains(event.target)) setShowLangMenu(false);
                };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            return (
                <div className="min-h-screen selection:bg-green-500/30 overflow-x-hidden flex flex-col relative pb-12">
                    {/* Background Glows (Synced with Socials) */}
                    <div className="fixed inset-0 pointer-events-none z-0">
                        <div className="absolute -top-[5%] -left-[5%] w-[40%] h-[40%] blur-[100px] rounded-full bg-green-600/15 transition-all duration-1000"></div>
                        <div className="absolute -bottom-[5%] -right-[5%] w-[40%] h-[40%] blur-[100px] rounded-full bg-emerald-600/15 transition-all duration-1000"></div>
                    </div>

                    {/* Navbar */}
                    <nav className="fixed top-0 w-full z-50 h-20 md:h-24 flex items-center px-4 md:px-12 backdrop-blur-md border-b border-white/5 bg-[#0b0d11]/80">
                        <div className="flex-1 hidden md:block"></div>
                        <div className="flex items-center gap-2 sm:gap-3 flex-1 md:flex-none">
                             <img src="https://raw.githubusercontent.com/der46er/webseite/main/assets/favicon.png" alt="Logo" className="w-8 h-8 sm:w-10 sm:h-10 object-contain logo-themed" />
                             <span className="header-logo-text text-xl sm:text-2xl">that<span className="text-green-500">austrianone.</span></span>
                        </div>
                        <div className="flex-1 flex justify-end relative" ref={menuRef}>
                            <button onClick={() => setShowLangMenu(!showLangMenu)} className="flex items-center gap-3 px-4 py-2 sm:px-6 sm:py-3.5 bg-white/[0.03] hover:bg-white/[0.07] border border-white/[0.05] rounded-full transition-all text-[11px] sm:text-[12px] font-black uppercase tracking-[0.1em] text-white shadow-lg active:scale-[0.98]">
                                <span>{t.code}</span> <ChevronDown size={14} className={`transition-transform duration-300 ${showLangMenu ? 'rotate-180' : ''}`} />
                            </button>
                            {showLangMenu && (
                                <div className="absolute right-0 top-14 sm:top-16 w-40 sm:w-48 bg-[#0b0d11] border border-white/10 rounded-xl sm:rounded-2xl overflow-hidden shadow-2xl animate-in z-50">
                                    {Object.keys(translations).map((key) => (
                                        <button key={key} onClick={() => { setLang(key); setShowLangMenu(false); }} className={`flex items-center gap-3 w-full px-4 py-4 sm:px-6 sm:py-5 text-left text-[10px] sm:text-[11px] font-black uppercase transition-colors hover:bg-white/[0.07] ${lang === key ? 'bg-white/[0.05]' : ''}`}>
                                            <span className={lang === key ? 'text-green-500' : 'text-zinc-500'}>{translations[key].code}</span>
                                            <span className={lang === key ? 'text-green-500' : 'text-zinc-400'}>{translations[key].name}</span>
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>
                    </nav>

                    <div className="relative z-10 max-w-4xl mx-auto px-4 sm:px-6 pt-32 sm:pt-48 pb-20 animate-in w-full">
                        <header className="flex flex-col items-center text-center mb-12 sm:mb-20 text-zinc-100">
                            <div className="inline-block px-4 py-1.5 bg-green-500/10 text-green-500 rounded-full text-[8px] sm:text-[9px] font-black tracking-[0.2em] mb-6 sm:mb-8 border border-green-500/20 uppercase">{t.welcome}</div>
                            <h1 className="header-logo-text text-4xl sm:text-7xl md:text-9xl mb-4 sm:mb-6 text-white leading-tight">that<span className="text-green-500">austrianone.</span></h1>
                            <p className="text-zinc-400 text-base sm:text-xl font-medium max-w-sm sm:max-w-md italic leading-relaxed px-4">"{t.description}"</p>
                        </header>

                        <div className="max-w-2xl mx-auto flex flex-col gap-3 sm:gap-4 text-zinc-100">
                            <MainCard 
                                title={t.aboutTitle} 
                                desc={t.aboutDesc} 
                                icon={UserIcon} 
                                href="https://thataustrianone.eu/about-me/" 
                                isExternal={false}
                            />
                            <MainCard 
                                title={t.servicesTitle} 
                                desc={t.servicesDesc} 
                                icon={TechIcon} 
                                href="https://thataustrianone.eu/services/" 
                                isExternal={false}
                            />
                            <MainCard 
                                title={t.shopTitle} 
                                desc={t.shopDesc} 
                                icon={ShoppingCart} 
                                href="https://thataustrianone.eu/shop/" 
                                isExternal={false}
                            />
                            <MainCard 
                                title={t.projectsTitle} 
                                desc={t.projectsDesc} 
                                icon={CodeIcon} 
                                href="https://thataustrianone.eu/projects/" 
                                isExternal={false}
                            />
                            <MainCard 
                                title={t.socialTitle} 
                                desc={t.socialDesc} 
                                icon={Share} 
                                href="https://thataustrianone.eu/socials" 
                                isExternal={false}
                            />
                        </div>

                        <footer className="mt-20 sm:mt-32 text-center flex flex-col items-center gap-6 sm:gap-8">
                            <button onClick={() => setShowLegal(true)} className="flex items-center gap-2 px-8 py-3.5 sm:px-12 sm:py-4 bg-white/[0.03] hover:bg-white/[0.07] border border-white/[0.05] rounded-full text-[10px] sm:text-[12px] font-black tracking-[0.3em] sm:tracking-[0.5em] transition-all text-zinc-500 hover:text-white uppercase active:scale-[0.98]">
                                <Info size={16} /> {t.legal}
                            </button>
                            <div className="flex flex-col gap-1 opacity-50">
                                <div className="text-zinc-800 text-[8px] sm:text-[9px] font-black tracking-[0.5em] sm:tracking-[0.7em] uppercase italic">© {new Date().getFullYear()} — THAT AUSTRIAN ONE</div>
                                <div className="text-[9px] font-bold text-white/30 uppercase tracking-widest select-none italic">
                                    LIVE BUILD v1.4.0 | {new Date().toLocaleDateString('de-DE')}
                                </div>
                            </div>
                        </footer>
                    </div>

                    {/* Legal Modal */}
                    {showLegal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6 bg-[#0b0d11]/90 backdrop-blur-md animate-in text-zinc-100">
                            <div className="glass-modal rounded-[2rem] sm:rounded-[2.5rem] w-full max-w-xl max-h-[85vh] overflow-hidden flex flex-col shadow-2xl">
                                <div className="p-6 sm:p-8 border-b border-white/5 flex justify-between items-center text-left">
                                    <h2 className="text-xl sm:text-2xl font-black italic uppercase tracking-tighter text-white">{t.legalTitle}</h2>
                                    <button onClick={() => setShowLegal(false)} className="p-2 text-zinc-500 hover:text-white hover:bg-white/5 rounded-full transition-all">
                                        <X size={24} />
                                    </button>
                                </div>
                                <div className="p-6 sm:p-8 overflow-y-auto custom-scroll space-y-8 sm:space-y-10 text-left">
                                    <section>
                                        <h3 className="text-green-500 font-black uppercase text-[9px] sm:text-[10px] tracking-[0.4em] mb-4 italic">Impressum</h3>
                                        <div className="space-y-4 font-bold uppercase">
                                            <p className="text-xl sm:text-2xl font-black tracking-tight italic">Niklas Ausserwoeger</p>
                                            <p className="text-zinc-500 text-[9px] sm:text-[10px] italic leading-relaxed lowercase tracking-normal">"{t.addressRequest}"</p>
                                            <p className="text-xs tracking-widest italic">4040 Linz, Österreich</p>
                                            <div className="pt-2">
                                                <p className="text-zinc-600 text-[9px] mb-1 tracking-[0.3em] uppercase font-bold text-left">E-Mail Kontakt</p>
                                                <p className="text-blue-400 text-sm font-black italic tracking-normal lowercase text-left">niklas.ausserwoeger@gmail.com</p>
                                            </div>
                                        </div>
                                    </section>
                                    <section className="space-y-6">
                                        <div>
                                            <h3 className="text-green-500 font-black uppercase text-[10px] tracking-[0.4em] mb-3 italic">{t.legalPrivacy}</h3>
                                            <p className="text-zinc-500 text-[10px] sm:text-xs italic leading-relaxed uppercase">{t.legalPrivacyText}</p>
                                        </div>
                                        <div>
                                            <h4 className="text-white font-bold text-xs uppercase tracking-widest mb-1 italic">{t.trademarkLabel}</h4>
                                            <p className="text-zinc-500 text-[10px] italic leading-relaxed uppercase">{t.trademarkText}</p>
                                        </div>
                                        <div>
                                            <h4 className="text-white font-bold text-xs uppercase tracking-widest mb-1 italic">{t.liabilityLabel}</h4>
                                            <p className="text-zinc-500 text-[10px] italic leading-relaxed uppercase">{t.liabilityText}</p>
                                        </div>
                                    </section>
                                    <div className="pt-8 border-t border-white/5 text-[9px] uppercase tracking-[0.3em] text-zinc-700 font-black text-center italic">
                                        Privatprojekt • Linz (OÖ) • {new Date().getFullYear()}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
