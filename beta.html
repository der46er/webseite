<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Nick</title>
    
    <link rel="icon" type="image/png" href="./assets/favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Local Fonts */
        @font-face { font-family: 'Inter'; src: url('./assets/fonts/inter-v12-latin-regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
        @font-face { font-family: 'Inter'; src: url('./assets/fonts/inter-v12-latin-900.woff2') format('woff2'); font-weight: 900; font-display: swap; }
        
        :root { --theme-color: #22c55e; --theme-rgb: 34, 197, 94; }
        
        body { font-family: 'Inter', sans-serif; background-color: #0b0d11; color: white; margin: 0; padding: 0; }
        
        .animate-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Dynamic Theme Classes */
        .theme-text { color: var(--theme-color); }
        .theme-bg-glow { background-color: rgba(var(--theme-rgb), 0.15); }
    </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden selection:bg-white/10 relative">
    
    <div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute -top-[10%] -left-[10%] w-[50%] h-[50%] blur-[120px] rounded-full theme-bg-glow transition-all duration-1000 opacity-60"></div>
        <div class="absolute -bottom-[10%] -right-[10%] w-[50%] h-[50%] blur-[120px] rounded-full theme-bg-glow transition-all duration-1000 opacity-60"></div>
    </div>

    <main class="relative z-10 max-w-5xl mx-auto px-4 sm:px-6 w-full flex-grow flex flex-col justify-center py-6 sm:py-8 h-full min-h-0">
        
        <div class="w-full text-center shrink-0 mb-6 sm:mb-8 animate-in" style="animation-delay: 0.1s; opacity: 0;">
            <h1 id="hero-title" class="text-3xl sm:text-4xl md:text-5xl font-black italic uppercase tracking-tighter text-white mb-2">
                Welcome to <span class="theme-text transition-colors duration-500">My World.</span>
            </h1>
            <p id="hero-desc" class="text-zinc-400 text-xs sm:text-sm font-medium max-w-xl mx-auto tracking-wide">
                </p>
        </div>

        <div id="bento-grid" class="w-full grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4 auto-rows-[minmax(0,1fr)] flex-grow min-h-0 animate-in" style="animation-delay: 0.2s; opacity: 0;">
            </div>
    </main>

    <footer class="w-full flex justify-between items-center px-6 py-4 shrink-0 relative z-10 select-none">
        <button onclick="toggleLang()" class="text-zinc-500 hover:text-white text-[10px] sm:text-xs font-black uppercase tracking-widest transition-colors duration-200">
            <span id="lang-indicator">EN</span> / Switch
        </button>
        <p onclick="window.location.href='https://thataustrianone.eu/legal/'" class="cursor-pointer text-zinc-600 text-[10px] sm:text-xs font-black italic tracking-widest uppercase opacity-70 hover:opacity-100 hover:text-white transition-all duration-300">
            © <span id="year">2026</span> — @der_46er
        </p>
    </footer>

    <div id="cookie-banner" class="hidden fixed bottom-0 left-0 w-full bg-[#0b0d11]/95 backdrop-blur-xl border-t border-white/10 p-4 sm:p-6 z-[200] flex flex-col sm:flex-row justify-between items-center gap-4 animate-in">
        <div class="text-xs sm:text-sm text-zinc-300 max-w-3xl font-medium leading-relaxed">
            <p id="cookie-text"></p>
        </div>
        <div class="flex gap-3 flex-shrink-0 w-full sm:w-auto">
            <button onclick="handleCookie('denied')" id="cookie-decline" class="flex-1 sm:flex-none px-6 py-3 rounded-xl font-bold text-xs text-zinc-500 hover:text-white hover:bg-white/5 border border-white/10 transition-colors uppercase tracking-widest"></button>
            <button onclick="handleCookie('granted')" id="cookie-accept" class="flex-1 sm:flex-none px-6 py-3 rounded-xl font-bold text-xs bg-white text-black hover:bg-zinc-200 transition-colors uppercase tracking-widest shadow-lg"></button>
        </div>
    </div>

    <script>
        document.getElementById('year').innerText = new Date().getFullYear();

        // --- TRANSLATIONS & BENTO DATA ---
        // Layout configured to fit standard screens natively
        const cardData = [
            { 
                id: 'projects', 
                href: "https://thataustrianone.eu/projects/", 
                isExternal: false,
                gridClass: "col-span-2 md:col-span-2 row-span-2 md:row-span-2 flex flex-col justify-end p-5 sm:p-8",
                iconClass: "text-cyan-400 bg-cyan-400/10",
                hoverBorder: "hover:border-cyan-400/50",
                hoverShadow: "hover:shadow-[0_0_40px_-10px_rgba(34,211,238,0.2)]",
                icon: '<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>'
            },
            { 
                id: 'shop', 
                href: "https://thataustrianone.eu/shop/", 
                isExternal: false,
                gridClass: "col-span-2 md:col-span-2 row-span-1 flex items-center p-4 sm:p-6",
                iconClass: "text-orange-500 bg-orange-500/10",
                hoverBorder: "hover:border-orange-500/50",
                hoverShadow: "hover:shadow-[0_0_40px_-10px_rgba(249,115,22,0.2)]",
                icon: '<path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>'
            },
            { 
                id: 'services', 
                href: "https://thataustrianone.eu/services/", 
                isExternal: false,
                gridClass: "col-span-1 md:col-span-1 row-span-1 flex flex-col justify-between p-4 sm:p-6",
                iconClass: "text-purple-500 bg-purple-500/10",
                hoverBorder: "hover:border-purple-500/50",
                hoverShadow: "hover:shadow-[0_0_40px_-10px_rgba(168,85,247,0.2)]",
                icon: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>'
            },
            { 
                id: 'about', 
                href: "https://thataustrianone.eu/about-me/", 
                isExternal: false,
                gridClass: "col-span-1 md:col-span-1 row-span-1 flex flex-col justify-between p-4 sm:p-6",
                iconClass: "text-emerald-400 bg-emerald-400/10",
                hoverBorder: "hover:border-emerald-400/50",
                hoverShadow: "hover:shadow-[0_0_40px_-10px_rgba(52,211,153,0.2)]",
                icon: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'
            },
            { 
                id: 'socials', 
                href: "https://thataustrianone.eu/socials", 
                isExternal: true,
                gridClass: "col-span-2 md:col-span-4 row-span-1 flex items-center justify-between p-4 sm:p-6",
                iconClass: "text-red-500 bg-red-500/10",
                hoverBorder: "hover:border-red-500/50",
                hoverShadow: "hover:shadow-[0_0_40px_-10px_rgba(239,68,68,0.2)]",
                icon: '<path d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>'
            }
        ];

        const translations = {
            de: {
                code: "AT", 
                heroDesc: "Entdecke meine Hardware, Software-Projekte und Tech-Services.",
                cookieText: "Wir verwenden Cookies und Google Analytics, um unsere Website zu verbessern und den Traffic zu analysieren. Stimmst du der Nutzung zu?",
                cookieDecline: "Ablehnen", cookieAccept: "Akzeptieren",
                content: {
                    projects: { title: "Meine Projekte", desc: "Software, Webseiten & Experimente" },
                    shop: { title: "Hardware Market", desc: "Check meine aktuellen Inserate" },
                    services: { title: "Tech Support", desc: "Zusammenbau & Reinigung" },
                    about: { title: "Meine Story", desc: "Wer steckt dahinter?" },
                    socials: { title: "Social Links", desc: "Folge mir auf meinen Kanälen" }
                }
            },
            en: {
                code: "GB",
                heroDesc: "Explore my hardware listings, software projects, and tech services.",
                cookieText: "We use cookies and Google Analytics to improve our website and analyze traffic. Do you accept the use of cookies?",
                cookieDecline: "Decline", cookieAccept: "Accept",
                content: {
                    projects: { title: "My Projects", desc: "Software, websites & experiments" },
                    shop: { title: "Hardware Market", desc: "Browse my latest listings" },
                    services: { title: "Tech Support", desc: "Assembly & cleaning" },
                    about: { title: "My Story", desc: "Who is thataustrianone?" },
                    socials: { title: "Social Links", desc: "Follow me on my channels" }
                }
            }
        };

        let currentLang = localStorage.getItem('siteLang') || 'en';

        // --- RENDER LOGIC ---
        function render() {
            const t = translations[currentLang];
            
            document.getElementById('hero-desc').innerText = t.heroDesc;
            document.getElementById('lang-indicator').innerText = t.code;
            
            // Cookies
            document.getElementById('cookie-text').innerText = t.cookieText;
            document.getElementById('cookie-decline').innerText = t.cookieDecline;
            document.getElementById('cookie-accept').innerText = t.cookieAccept;

            // Render Grid natively scaled to the container height
            const grid = document.getElementById('bento-grid');
            grid.innerHTML = cardData.map(c => {
                const text = t.content[c.id];
                const isLarge = c.id === 'projects';
                const isWide = c.id === 'socials' || c.id === 'shop';
                
                return `
                <a href="${c.href}" target="${c.isExternal ? '_blank' : '_self'}" 
                   class="group relative overflow-hidden bg-[#12151c] border border-white/5 rounded-3xl transition-all duration-500 ${c.hoverBorder} ${c.hoverShadow} active:scale-[0.98] ${c.gridClass}">
                    
                    <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-700 bg-gradient-to-br from-white/[0.02] to-transparent pointer-events-none"></div>

                    ${isWide || !isLarge ? `
                        <div class="flex items-center gap-3 sm:gap-4 w-full z-10 h-full">
                            <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl sm:rounded-2xl flex items-center justify-center shrink-0 transition-transform duration-500 group-hover:-translate-y-1 ${c.iconClass}">
                                <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">${c.icon}</svg>
                            </div>
                            <div class="flex-grow min-w-0">
                                <h2 class="text-sm sm:text-xl font-black text-white tracking-wide italic uppercase leading-none mb-1 group-hover:text-white transition-colors truncate">${text.title}</h2>
                                <p class="text-zinc-500 text-[9px] sm:text-[10px] md:text-xs font-bold uppercase tracking-widest truncate">${text.desc}</p>
                            </div>
                            <div class="text-zinc-700 group-hover:text-white transition-all transform group-hover:translate-x-1 shrink-0">
                                <svg width="20" height="20" class="sm:w-6 sm:h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                            </div>
                        </div>
                    ` : `
                        <div class="w-12 h-12 sm:w-16 sm:h-16 rounded-xl sm:rounded-2xl flex items-center justify-center mb-auto transition-transform duration-500 group-hover:-translate-y-1 group-hover:scale-105 ${c.iconClass} z-10">
                            <svg class="w-6 h-6 sm:w-8 sm:h-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">${c.icon}</svg>
                        </div>
                        <div class="mt-4 sm:mt-8 z-10 relative">
                            <h2 class="text-2xl sm:text-3xl md:text-4xl font-black text-white tracking-tight italic uppercase leading-none mb-1 sm:mb-2">${text.title}</h2>
                            <p class="text-zinc-400 text-[10px] sm:text-xs font-bold uppercase tracking-widest">${text.desc}</p>
                        </div>
                        <div class="absolute bottom-4 right-4 sm:bottom-6 sm:right-6 text-zinc-700 group-hover:text-white transition-all transform group-hover:translate-x-1 group-hover:-translate-y-1 z-10">
                            <svg width="24" height="24" class="sm:w-7 sm:h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5"></line><polyline points="10 5 19 5 19 14"></polyline></svg>
                        </div>
                    `}
                </a>
                `;
            }).join('');
        }

        // Single button language toggle
        window.toggleLang = () => {
            currentLang = currentLang === 'en' ? 'de' : 'en';
            localStorage.setItem('siteLang', currentLang);
            render();
        };

        // --- GOOGLE ANALYTICS & COOKIES LOGIC ---
        const cookieBanner = document.getElementById('cookie-banner');
        const cookieConsent = localStorage.getItem('siteCookieConsent');

        function injectGA() {
            if (document.getElementById('ga-script')) return;
            const script1 = document.createElement('script');
            script1.id = 'ga-script';
            script1.async = true;
            script1.src = 'https://www.googletagmanager.com/gtag/js?id=G-0WHX0WMFTC';
            document.head.appendChild(script1);

            const script2 = document.createElement('script');
            script2.innerHTML = `
                window.dataLayer = window.dataLayer || [];
                function gtag(){dataLayer.push(arguments);}
                gtag('js', new Date());
                gtag('config', 'G-0WHX0WMFTC');
            `;
            document.head.appendChild(script2);
        }

        if (!cookieConsent) {
            cookieBanner.classList.remove('hidden');
        } else if (cookieConsent === 'granted') {
            injectGA();
        }

        window.handleCookie = (status) => {
            localStorage.setItem('siteCookieConsent', status);
            cookieBanner.classList.add('opacity-0', 'translate-y-full');
            setTimeout(() => cookieBanner.classList.add('hidden'), 400);
            if (status === 'granted') injectGA();
        };

        // --- THEME LOGIC ---
        function updateFaviconColor(hex) {
            const img = new Image();
            img.crossOrigin = 'Anonymous';
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                ctx.globalCompositeOperation = 'source-in';
                ctx.fillStyle = hex;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                let link = document.querySelector("link[rel~='icon']");
                if (!link) {
                    link = document.createElement('link');
                    link.rel = 'icon';
                    document.head.appendChild(link);
                }
                link.href = canvas.toDataURL('image/png');
            };
            img.src = './assets/favicon.png';
        }

        // Init UI
        updateFaviconColor('#22c55e');
        render();

        // Fetch user defined theme colors remotely
        fetch('./assets/theme.txt', { cache: 'no-cache' }).then(r => r.text()).then(t => {
            let hex = t.trim().startsWith('#') ? t.trim() : '#' + t.trim();
            if (/^#([0-9A-F]{3}|[0-9A-F]{6})$/i.test(hex)) {
                let c = hex.replace('#', '');
                if(c.length === 3) c = c.split('').map(x=>x+x).join('');
                document.documentElement.style.setProperty('--theme-color', hex);
                document.documentElement.style.setProperty('--theme-rgb', `${parseInt(c.substr(0,2),16)}, ${parseInt(c.substr(2,2),16)}, ${parseInt(c.substr(4,2),16)}`);
                updateFaviconColor(hex);
            }
        }).catch(()=>{});

    </script>
</body>
</html>
