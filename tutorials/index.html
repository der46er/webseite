        window.addEventListener('click', (e) => {

        function handleSearch(val) {
            searchQuery = val.toLowerCase().trim();
            render();
        }

        function levenshtein(a, b) {
            const matrix = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
            for (let i = 0; i <= a.length; i++) matrix[i][0] = i;
            for (let j = 0; j <= b.length; j++) matrix[0][j] = j;

            for (let i = 1; i <= a.length; i++) {
                for (let j = 1; j <= b.length; j++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    matrix[i][j] = Math.min(
                        matrix[i - 1][j] + 1,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j - 1] + cost
                    );
                }
            }
            return matrix[a.length][b.length];
        }

        function isFuzzyMatch(searchWord, targetWord) {
            if (targetWord.includes(searchWord) || searchWord.includes(targetWord)) return true;
            const maxLen = Math.max(searchWord.length, targetWord.length);
            if (maxLen <= 3) return searchWord === targetWord;
            const allowedDist = maxLen >= 7 ? 2 : 1;
            return levenshtein(searchWord, targetWord) <= allowedDist;
        }

        function smartMatch(item, query) {
            if (!query) return true;
            const queryWords = query.split(/\s+/).filter(Boolean);
            const titleDe = (item.title.de || "").toLowerCase();
            const titleEn = (item.title.en || "").toLowerCase();
            const descDe = (item.description.de || "").toLowerCase();
            const descEn = (item.description.en || "").toLowerCase();
            const catDe = (item.category.de || "").toLowerCase();
            const catEn = (item.category.en || "").toLowerCase();

            const targetTokens = `${titleDe} ${titleEn} ${descDe} ${descEn} ${catDe} ${catEn}`
                .replace(/[^a-z0-9äöüß\s]/g, ' ')
                .split(/\s+/)
                .filter(Boolean);

            return queryWords.every(qWord => {
                if (targetTokens.some(tWord => isFuzzyMatch(qWord, tWord))) return true;
                const synList = SYNONYMS[qWord] || [];
                if (synList.some(syn => targetTokens.some(tWord => isFuzzyMatch(syn, tWord)))) return true;
                return false;
            });
        }

        function handleItemClick(index) {
            const item = fetchedItems[index];
            if (!item || !item.url) return;
            window.open(item.url, '_blank');
        }

        async function fetchTutorialItems() {
            try {
                const response = await fetch(GITHUB_API_URL);
                if (!response.ok) throw new Error("Failed to fetch tutorials directory");
                const files = await response.json();
                
                const jsonFiles = files.filter(file => 
                    file.type === 'file' && 
                    file.name.toLowerCase().endsWith('.json') && 
                    file.name.toLowerCase() !== 'template.json'
                );

                const itemPromises = jsonFiles.map(async (file) => {
                    const jsonUrl = file.download_url || `${GITHUB_RAW_BASE}/${file.name}`;
                    try {
                        const res = await fetch(jsonUrl);
                        if (!res.ok) return null;

                        const item = await res.json();
                        let titleDe = item.title?.de || file.name.replace(/\.json$/i, '').replace(/_/g, ' ');
                        let titleEn = item.title?.en || titleDe;
                        let categoryDe = item.category?.de || "";
                        let categoryEn = item.category?.en || categoryDe;
                        let descriptionDe = item.description?.de || "";
                        let descriptionEn = item.description?.en || descriptionDe;

                        return {
                            title: { de: titleDe, en: titleEn },
                            category: { de: categoryDe, en: categoryEn },
                            description: { de: descriptionDe, en: descriptionEn },
                            image: item.image || 'https://api.dicebear.com/7.x/shapes/svg?seed=tech&backgroundColor=161920',
                            url: item.url || '#'
                        };
                    } catch (err) {
                        return null;
                    }
                });

                const resolved = await Promise.all(itemPromises);
                fetchedItems = resolved.filter(i => i !== null);
                
                populateCategories();
                render();
            } catch (e) {
                console.error("Fetch error:", e);
                render();
            }
        }

        function populateCategories() {
            const dropdown = document.getElementById('category-dropdown');
            const t = translations[currentLang];
            
            const uniqueCats = new Set();
            fetchedItems.forEach(item => {
                const cat = currentLang === 'en' ? item.category.en : item.category.de;
                if (cat) uniqueCats.add(cat);
            });

            let html = `
                <button onclick="setCategory('all')" class="w-full text-left px-3.5 py-2 rounded-lg text-xs font-bold uppercase tracking-wider hover:bg-white/10 transition-colors ${selectedCategory === 'all' ? 'text-purple-400 bg-white/5' : 'text-zinc-300 hover:text-white'}">
                    ${t.allCategories}
                </button>
            `;

            uniqueCats.forEach(cat => {
                const isSelected = selectedCategory.toLowerCase() === cat.toLowerCase();
                html += `
                    <button onclick="setCategory('${cat.replace(/'/g, "\\'")}')" class="w-full text-left px-3.5 py-2 rounded-lg text-xs font-bold uppercase tracking-wider hover:bg-white/10 transition-colors ${isSelected ? 'text-purple-400 bg-white/5' : 'text-zinc-300 hover:text-white'}">
                        ${cat}
                    </button>
                `;
            });

            dropdown.innerHTML = html;
        }

        function render() {
            const t = translations[currentLang];
            
            document.getElementById('hero-title').innerText = t.heroTitle;
            document.getElementById('hero-desc').innerText = t.heroDesc;
            document.getElementById('lang-indicator').innerHTML = `<img src="${t.flag}" alt="${t.alt}" class="w-7 h-auto rounded-md shadow-md object-cover opacity-80 hover:opacity-100 transition-opacity duration-200">`;
            
            document.getElementById('cookie-text').innerText = t.cookieText;
            document.getElementById('cookie-decline').innerText = t.cookieDecline;
            document.getElementById('cookie-accept').innerText = t.cookieAccept;
            document.getElementById('search-input').placeholder = t.searchPlaceholder;
            document.getElementById('category-btn-label').innerText = selectedCategory === 'all' ? t.allCategories : selectedCategory;

            populateCategories();

            const filteredItems = fetchedItems.filter(item => {
                const cat = currentLang === 'en' ? item.category.en : item.category.de;
                const matchesCat = selectedCategory === 'all' || cat.toLowerCase() === selectedCategory.toLowerCase();
                const matchesFuzzy = smartMatch(item, searchQuery);
                return matchesCat && matchesFuzzy;
            });

            const grid = document.getElementById('tutorials-grid');

            if (fetchedItems.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-zinc-500 font-bold uppercase tracking-widest text-xs">${t.noItems}</div>`;
                return;
            }

            if (filteredItems.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-zinc-500 font-bold uppercase tracking-widest text-xs">${t.noMatch}</div>`;
                return;
            }

            grid.innerHTML = filteredItems.map(item => {
                const realIndex = fetchedItems.indexOf(item);
                const title = currentLang === 'en' ? item.title.en : item.title.de;
                const desc = currentLang === 'en' ? item.description.en : item.description.de;
                const category = currentLang === 'en' ? item.category.en : item.category.de;

                return `
                <div onclick="handleItemClick(${realIndex})" class="group relative glass-box rounded-[1.2rem] transition-all duration-300 hover:border-purple-500/80 hover:shadow-[0_0_50px_-5px_rgba(168,85,247,0.3)] active:scale-[0.99] p-4 flex flex-col justify-between overflow-hidden w-full cursor-pointer">
                    
                    <div class="aspect-video w-full rounded-xl overflow-hidden bg-black/40 mb-4 border border-white/5 relative">
                        <img src="${item.image}" alt="${title}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" onerror="this.src='https://api.dicebear.com/7.x/shapes/svg?seed=tech&backgroundColor=161920'" />
                        ${category ? `<span class="absolute top-2 left-2 bg-black/60 backdrop-blur-md px-2.5 py-1 rounded-md text-[9px] font-black uppercase tracking-wider text-zinc-300 border border-white/10">${category}</span>` : ''}
                    </div>
                    
                    <div class="flex flex-col flex-grow justify-between min-w-0">
                        <div>
                            <h2 class="text-base sm:text-lg font-black text-white tracking-tight italic uppercase leading-snug truncate pr-1 mb-1 group-hover:text-purple-400 transition-colors">${title}</h2>
                            <p class="text-zinc-500 text-[10px] sm:text-xs font-bold uppercase tracking-widest line-clamp-2 leading-relaxed mb-3">${desc}</p>
                        </div>
                        
                        <div class="flex items-center justify-between pt-2 border-t border-white/5 mt-auto">
                            <span class="text-[10px] font-black uppercase tracking-widest text-zinc-500 group-hover:text-white transition-colors">${t.readTutorial}</span>
                            <div class="text-zinc-700 group-hover:text-white transition-all transform group-hover:translate-x-1 group-hover:-translate-y-1 shrink-0">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${arrowUpRight}</svg>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        window.toggleLang = () => {
            currentLang = currentLang === 'en' ? 'de' : 'en';
            localStorage.setItem('siteLang', currentLang);
            populateCategories();
            render();
        };

        const cookieBanner = document.getElementById('cookie-banner');
        const cookieConsent = localStorage.getItem('siteCookieConsent');

        function injectGA() {
            if (document.getElementById('ga-script')) return;
            const script1 = document.createElement('script');
            script1.id = 'ga-script';
            script1.async = true;
            script1.src = 'https://www.googletagmanager.com/gtag/js?id=G-0WHX0WMFTC';
            document.head.appendChild(script1);

            const script2 = document.createElement('script');
            script2.innerHTML = `
                window.dataLayer = window.dataLayer || [];
                function gtag(){dataLayer.push(arguments);}
                gtag('js', new Date());
                gtag('config', 'G-0WHX0WMFTC');
            `;
            document.head.appendChild(script2);
        }

        if (!cookieConsent) {
            cookieBanner.classList.remove('hidden');
        } else if (cookieConsent === 'granted') {
            injectGA();
        }

        window.handleCookie = (status) => {
            localStorage.setItem('siteCookieConsent', status);
            cookieBanner.classList.add('opacity-0', 'translate-y-full');
            setTimeout(() => cookieBanner.classList.add('hidden'), 400);
            if (status === 'granted') injectGA();
        };

        fetchTutorialItems();
    </script>

</body></html>
