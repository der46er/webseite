<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | thataustrianone</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/der46er/webseite/main/assets/favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0b0d11; 
            margin: 0; 
            padding: 0; 
        }

        /* Globaler Logo/Titel Style (900, normal, lowercase, enges spacing) */
        .header-logo-text {
            font-weight: 900;
            font-style: normal;
            text-transform: lowercase;
            letter-spacing: -0.06em;
        }

        .animate-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .group:hover .animate-rotate-slow {
            animation: rotate 4s linear infinite;
        }

        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        /* Logo-Theming: Orange für den Shop */
        .logo-themed {
            filter: sepia(100%) saturate(300%) hue-rotate(330deg) brightness(100%) drop-shadow(0 0 5px rgba(249, 115, 22, 0.5));
            transition: all 0.3s ease;
        }
        .group:hover .logo-themed {
            filter: sepia(100%) saturate(500%) hue-rotate(330deg) brightness(110%) drop-shadow(0 0 8px rgba(249, 115, 22, 0.8));
        }

        .glass-modal {
            background: rgba(11, 13, 17, 0.98);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Icons ---
        const ChevronLeft = ({size}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>;

        const ExternalLink = ({size}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg>;
        const Info = ({size}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>;
        const X = ({size}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;

        const translations = {
            de: {

                description: "Hier findest du Hardware und Ersatzteile aus meinem Bestand. Die Abwicklung erfolgt sicher über die verlinkten Plattformen.",
                viewOn: "Auf {platform} ansehen", comingSoon: "Bald neue Artikel...", legal: "Impressum & Rechtliches",
                legalTitle: "Rechtliche Informationen", imprintLabel: "Impressum / Offenlegung", addressLabel: "Anschrift",
                addressRequest: "Die vollständige Anschrift ist aus Datenschutzgründen nur auf begründete Anfrage per E-Mail verfügbar.",
                contactLabel: "Kontakt", trademarkLabel: "Hinweis zu Marken & Logos",
                trademarkText: "Alle verwendeten Logos (Willhaben, Vinted, eBay, HP, Intel, Corsair) sind Eigentum der jeweiligen Inhaber und dienen ausschließlich der Identifikation der Profile und Hardware.",
                liabilityLabel: "Haftung für Links", liabilityText: "Ich übernehme keine Haftung für externe Links. Für den Inhalt sind ausschließlich deren Betreiber verantwortlich.",

        };

        const ProfileCard = ({ platform, url, userImage, logoImage, lang, labelKey, logoClass }) => (

                    <div className="w-14 h-14 rounded-full overflow-hidden border-2 border-white/10 shrink-0 shadow-lg">
                        <img src={userImage} alt="User" className="w-full h-full object-cover" />
                    </div>
                    <div className="flex flex-col gap-1.5 text-left overflow-hidden">
                        <div className={`h-7 flex items-center ${logoClass}`}>
                            <img src={logoImage} alt={platform} className="h-full w-auto object-contain" />
                        </div>
                        <h4 className="text-white font-extrabold text-sm sm:text-base tracking-tight truncate">
                            {translations[lang][labelKey]}
                        </h4>
                        <div className="flex items-center gap-1.5 text-zinc-500 text-[10px] uppercase font-bold tracking-widest group-hover:text-white transition-colors">
                            {translations[lang].viewProfile} <ExternalLink size={10} />

            </a>
        );

        const ProductCard = ({ title, price, description, image, links, isSold, lang }) => (

                {!isSold && <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[200%] h-[200%] bg-[conic-gradient(transparent,transparent,transparent,#f97316,#fb7185,#fbbf24)] animate-rotate-slow opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>}

                            <div className="absolute inset-0 bg-black/60 backdrop-blur-[2px] flex items-center justify-center">
                                <span className="px-6 py-2 bg-orange-600 text-white font-black uppercase tracking-[0.2em] rounded-full text-sm shadow-2xl rotate-[-5deg]">

                                </span>
                            </div>
                        )}
                    </div>
                    <div className="flex-grow px-2 pb-4">
                        <div className="flex justify-between items-start mb-2">
                            <h3 className="text-xl font-bold text-white tracking-tight leading-tight">{title[lang]}</h3>
                            <span className={`text-orange-500 font-extrabold text-lg shrink-0 ml-2 ${isSold ? 'line-through opacity-50' : ''}`}>{price}€</span>
                        </div>
                        <p className="text-zinc-500 text-sm leading-relaxed mb-6">{description[lang]}</p>
                    </div>
                    
                    <div className="flex flex-col gap-2 mt-auto">
                        {isSold ? (
                            <div className="w-full py-3 bg-white/5 border border-white/5 text-zinc-600 rounded-[1rem] text-sm font-bold text-center italic cursor-not-allowed uppercase tracking-widest">

                            </div>
                        ) : (
                            links.map((link, idx) => (
                                <a 
                                    key={idx}
                                    href={link.url} 
                                    target="_blank" 
                                    className="flex items-center justify-center gap-2 w-full py-3 bg-white/5 hover:bg-orange-600 border border-white/5 hover:border-orange-500 text-white rounded-[1rem] text-sm font-bold transition-all duration-300 shadow-xl"

                                    {translations[lang].viewOn.replace('{platform}', link.platform)}

                                </a>
                            ))

                </div>
            </div>
        );

            const [showLegal, setShowLegal] = useState(false);
            const [showLangMenu, setShowLangMenu] = useState(false);
            const menuRef = useRef(null);
            const t = translations[lang];

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (menuRef.current && !menuRef.current.contains(event.target)) setShowLangMenu(false);
                };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            const mainLogo = "https://raw.githubusercontent.com/der46er/webseite/main/assets/favicon.png";
            const willhabenPortrait = "https://cache.willhaben.at/mmo/userProfile/31926735_8ba50daac3161ab9f45061e2408c4c70.jpg";
            const vintedCat = "https://images1.vinted.net/t/04_0104b_ughXXR9SsCv9pvoU69kXnLKB/f800/1757955583.webp?s=e9d9f4a64580b0d1ce07706d85d955ccb3380b2a";

            const profiles = {
                willhaben: {
                    url: "https://www.willhaben.at/iad/kaufen-und-verkaufen/verkaeuferprofil/31926735",
                    userImage: willhabenPortrait,
                    logo: "https://www.willhaben.at/bbx-search/_next/static/assets/logo.f8cb483ef68cd335.svg",
                    labelKey: "willhabenProfile", logoClass: ""
                },
                vinted: {
                    url: "https://www.vinted.at/member/207532481",
                    userImage: vintedCat,
                    logo: "https://marketplace-web-assets.vinted.com/_next/static/media/logo.5398230b.svg",
                    labelKey: "vintedProfile", logoClass: ""
                },
                ebay: {
                    url: "https://www.ebay.at/usr/der_46er", 
                    userImage: ebayPortrait,
                    logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/EBay_logo.svg/1280px-EBay_logo.svg.png",
                    labelKey: "ebayProfile", logoClass: ""
                }
            };

            const products = [
                {
                    title: { de: "Corsair iCue Lüfter", en: "Corsair iCue Fan" },
                    price: "15",

                    image: "https://images1.vinted.net/t/03_025af_7maZPWfUSJWjDGwzbmZZFxqS/f800/1753473025.webp?s=67e8e480fe4cc458b45ec7ee91131efc498f7276",
                    isSold: false,
                    links: [
                        { platform: "eBay", url: "https://www.ebay.at/itm/147142307233" },
                        { platform: "Willhaben", url: "https://www.willhaben.at/iad/kaufen-und-verkaufen/d/corsair-icue-luefter-1623977017" },
                        { platform: "Vinted", url: "https://www.vinted.at/items/6750436046-corsair-icue-lufter" }
                    ]
                },
                {
                    title: { de: "HP ProDesk CPU-Lüfter", en: "HP ProDesk CPU Fan" },
                    price: "5",
                    description: { de: "Originaler CPU-Lüfter für HP ProDesk 600 G4 Desktop Mini PCs.", en: "Original CPU fan for HP ProDesk 600 G4 Desktop Mini PCs." },
                    image: "https://images1.vinted.net/t/04_002e4_f2kLtTJaMnyYW8LJcdREg5k7/f800/1757955911.webp?s=29fcd3180554ad230a594e392e808728d4c2cf75",
                    isSold: false,
                    links: [
                        { platform: "Vinted", url: "https://www.vinted.at/items/7096113982-lufter-fur-hp-prodesk-600-g4" }
                    ]
                },
                {
                    title: { de: "DisplayPort Flex IO Card", en: "DisplayPort Flex IO Card" },
                    price: "15",
                    description: { de: "DisplayPort Port Flex IO Erweiterungskarte für HP ProDesk 600 G4.", en: "DisplayPort Port Flex IO expansion card for HP ProDesk 600 G4." },
                    image: "https://images1.vinted.net/t/04_024f0_3BRUMFn8vNhVf9Ev2qTcPy3a/f800/1757955451.webp?s=1e1852b48253e7bfaea4f1b446db5700c9364ba6",
                    isSold: false,
                    links: [
                        { platform: "Vinted", url: "https://www.vinted.at/items/7096039316-displayport-port-flex-io-card-fur-hp-prodesk-600-g4" }
                    ]
                },
                {
                    title: { de: "HP ProDesk Lautsprecher", en: "HP ProDesk Speakers" },
                    price: "5",

                    ]
                },
                {
                    title: { de: "SATA Anschlusskabel (HP ProDesk)", en: "SATA Adapter Cable (HP ProDesk)" },

                    image: "https://images1.vinted.net/t/01_025f1_f2YJDU1CjCkHLdFcz965PRbS/f800/1757953904.webp?s=7cbde4e8dbc6c5c64992e98bfc258c6c474b6664",
                    isSold: false,
                    links: [
                        { platform: "Vinted", url: "https://www.vinted.at/items/7095779187-sata-anschlusskabel-fur-hp-prodesk-600-g4" }

            return (

                                <div className="absolute right-0 top-16 w-48 glass-modal rounded-2xl overflow-hidden shadow-2xl animate-in z-50">
