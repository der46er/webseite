            color: white; 
            margin: 0; 
            padding: 0; 
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100lvh;
            background-image: url("https://cdn.jsdelivr.net/gh/der46er/webseite@main/assets/backgounds/waves-orange-black.webp");

            background-position: center;
            background-repeat: no-repeat;
            filter: blur(8px);
            transform: scale(1.05);
            opacity: 1;
            z-index: -2;

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100lvh;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.015'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: -1;
        }
        
        .animate-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .glass-box {
            background: rgba(18, 18, 18, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);

        .dropdown-menu {

            backdrop-filter: blur(16px);

        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>

                flag: "https://cdn.jsdelivr.net/gh/der46er/webseite@main/assets/flags/united-kingdom-flag.webp",
                alt: "UK Flag",
                heroDesc: "Explore hardware and spare parts from my personal inventory",

        const SYNONYMS = {

            'cpu': ['prozessor', 'processor', 'ryzen', 'intel', 'core', 'chip'],

            'ram': ['speicher', 'memory', 'ddr4', 'ddr5', 'arbeitsspeicher'],

            'kühler': ['fan', 'cooler', 'lüfter', 'cooling', 'heatsink', 'aio'],
            'lüfter': ['fan', 'cooler', 'kühler', 'cooling'],
            'fan': ['cooler', 'lüfter', 'kühler'],
            'cooler': ['fan', 'lüfter', 'kühler'],
            'mainboard': ['motherboard', 'board', 'mb', 'mobo'],
            'motherboard': ['mainboard', 'board', 'mb', 'mobo'],
            'netzteil': ['psu', 'power', 'supply'],

        };

        function togglePlatformMenu() {

        window.addEventListener('click', (e) => {

            if (pWrap && !pWrap.contains(e.target)) {

        function setPlatform(platform) {
            preferredPlatform = platform;
            localStorage.setItem('shopPlatform', platform);
            document.getElementById('platform-dropdown').classList.add('hidden');
            render();
        }

        function setCategory(cat) {
            selectedCategory = cat;
            document.getElementById('category-dropdown').classList.add('hidden');
            render();
        }

        function handleSearch(val) {
            searchQuery = val.toLowerCase().trim();
            render();
        }

        function levenshtein(a, b) {
            const matrix = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
            for (let i = 0; i <= a.length; i++) matrix[i][0] = i;
            for (let j = 0; j <= b.length; j++) matrix[0][j] = j;

            for (let i = 1; i <= a.length; i++) {
                for (let j = 1; j <= b.length; j++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    matrix[i][j] = Math.min(
                        matrix[i - 1][j] + 1,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j - 1] + cost
                    );
                }
            }
            return matrix[a.length][b.length];
        }

        function isFuzzyMatch(searchWord, targetWord) {
            if (targetWord.includes(searchWord) || searchWord.includes(targetWord)) return true;
            
            const maxLen = Math.max(searchWord.length, targetWord.length);
            if (maxLen <= 3) return searchWord === targetWord;
            
            const allowedDist = maxLen >= 7 ? 2 : 1;
            return levenshtein(searchWord, targetWord) <= allowedDist;
        }

        function smartMatch(item, query) {
            if (!query) return true;

            const queryWords = query.split(/\s+/).filter(Boolean);
            const titleDe = (item.title.de || "").toLowerCase();
            const titleEn = (item.title.en || "").toLowerCase();
            const descDe = (item.description.de || "").toLowerCase();
            const descEn = (item.description.en || "").toLowerCase();
            const catDe = (item.category.de || "").toLowerCase();
            const catEn = (item.category.en || "").toLowerCase();

            const targetTokens = `${titleDe} ${titleEn} ${descDe} ${descEn} ${catDe} ${catEn}`
                .replace(/[^a-z0-9äöüß\s]/g, ' ')
                .split(/\s+/)
                .filter(Boolean);

            return queryWords.every(qWord => {
                if (targetTokens.some(tWord => isFuzzyMatch(qWord, tWord))) return true;

                const synList = SYNONYMS[qWord] || [];
                if (synList.some(syn => targetTokens.some(tWord => isFuzzyMatch(syn, tWord)))) return true;

                return false;
            });
        }

        function getPlatformUrls(item) {
            const list = [];
            if (typeof item.urls === 'string' && item.urls !== '#') {
                const lower = item.urls.toLowerCase();
                if (lower.includes('willhaben')) list.push({ platform: 'willhaben', name: 'Willhaben', url: item.urls });
                else if (lower.includes('vinted')) list.push({ platform: 'vinted', name: 'Vinted', url: item.urls });
                else if (lower.includes('ebay')) list.push({ platform: 'ebay', name: 'eBay', url: item.urls });
                else list.push({ platform: 'link', name: 'Listing', url: item.urls });
            } else if (Array.isArray(item.urls)) {
                item.urls.forEach(u => {
                    const lower = u.toLowerCase();
                    if (lower.includes('willhaben')) list.push({ platform: 'willhaben', name: 'Willhaben', url: u });
                    else if (lower.includes('vinted')) list.push({ platform: 'vinted', name: 'Vinted', url: u });
                    else if (lower.includes('ebay')) list.push({ platform: 'ebay', name: 'eBay', url: u });
                    else list.push({ platform: 'link', name: 'Listing', url: u });
                });
            } else if (item.urls && typeof item.urls === 'object') {
                if (item.urls.willhaben) list.push({ platform: 'willhaben', name: 'Willhaben', url: item.urls.willhaben });
                if (item.urls.vinted) list.push({ platform: 'vinted', name: 'Vinted', url: item.urls.vinted });
                if (item.urls.ebay) list.push({ platform: 'ebay', name: 'eBay', url: item.urls.ebay });
            }
            return list;
        }

        function handleItemClick(index) {
            const item = fetchedItems[index];
            if (!item) return;

            const platforms = getPlatformUrls(item);

            if (preferredPlatform !== 'all') {
                const preferred = platforms.find(p => p.platform === preferredPlatform);
                if (preferred) {
                    window.open(preferred.url, '_blank');
                    return;
                }
            }

            if (platforms.length === 1) {
                window.open(platforms[0].url, '_blank');
                return;
            }

            if (platforms.length > 1) {
                openPlatformModal(item, platforms);
                return;
            }

            if (typeof item.urls === 'string' && item.urls !== '#') {
                window.open(item.urls, '_blank');
            }
        }

        function openPlatformModal(item, platforms) {
            const modal = document.getElementById('platform-modal');
            const card = document.getElementById('platform-modal-card');
            const list = document.getElementById('modal-platform-list');
            const t = translations[currentLang];

            const title = currentLang === 'en' ? item.title.en : item.title.de;
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = t.modalDesc;

            list.innerHTML = platforms.map(p => `
                <a href="${p.url}" target="_blank" onclick="closePlatformModal()" class="glass-box rounded-xl p-3.5 flex items-center justify-between hover:border-orange-500/80 hover:bg-white/5 transition-all duration-200 group">
                    <div class="flex items-center gap-3">
                        ${PLATFORM_ICONS[p.platform] || `<span class="font-bold text-sm text-white">${p.name}</span>`}
                    </div>
                    <div class="flex items-center gap-1.5 text-zinc-400 group-hover:text-orange-400 text-xs font-bold uppercase tracking-wider transition-colors">
                        <span>${t.openListing}</span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="group-hover:translate-x-0.5 transition-transform"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </div>
                </a>
            `).join('');

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0', 'pointer-events-none');
                card.classList.remove('scale-95');
                card.classList.add('scale-100');
            }, 10);
        }

        function closePlatformModal() {
            const modal = document.getElementById('platform-modal');
            const card = document.getElementById('platform-modal-card');
            modal.classList.add('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-100');
            card.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        document.getElementById('platform-modal').addEventListener('click', (e) => {
            if (e.target.id === 'platform-modal') closePlatformModal();
        });

        function matchesPlatform(item) {
            if (preferredPlatform === 'all') return true;
            if (typeof item.urls === 'string') {
                return item.urls.toLowerCase().includes(preferredPlatform);
            }
            if (Array.isArray(item.urls)) {
                return item.urls.some(u => u.toLowerCase().includes(preferredPlatform));
            }
            if (item.urls && typeof item.urls === 'object') {
                return !!item.urls[preferredPlatform];
            }
            return false;
        }

        async function fetchShopItems() {
            try {
                const response = await fetch(GITHUB_API_URL);
                if (!response.ok) throw new Error("Failed to fetch shop directory");
                const files = await response.json();
                
                const jsonFiles = files.filter(file => 
                    file.type === 'file' && 
                    file.name.toLowerCase().endsWith('.json') && 
                    file.name.toLowerCase() !== 'template.json'
                );

                const itemPromises = jsonFiles.map(async (file) => {
                    const jsonUrl = file.download_url || `${GITHUB_RAW_BASE}/${file.name}`;
                    try {
                        const res = await fetch(jsonUrl);
                        if (!res.ok) return null;

                        const item = await res.json();

                        let titleDe = item.title?.de || file.name.replace(/\.json$/i, '').replace(/_/g, ' ');
                        let titleEn = item.title?.en || titleDe;
                        let categoryDe = item.category?.de || "";
                        let categoryEn = item.category?.en || categoryDe;
                        let descriptionDe = item.description?.de || "";
                        let descriptionEn = item.description?.en || descriptionDe;
                        let priceEur = item.price?.eur || "";
                        let priceUsd = item.price?.usd || "";

                        return {
                            title: { de: titleDe, en: titleEn },
                            category: { de: categoryDe, en: categoryEn },
                            description: { de: descriptionDe, en: descriptionEn },
                            price: { eur: priceEur, usd: priceUsd },
                            image: item.image || 'https://api.dicebear.com/7.x/shapes/svg?seed=tech&backgroundColor=161920',
                            urls: item.urls || item.url || '#'
                        };
                    } catch (err) {
                        return null;
                    }
                });

                const resolved = await Promise.all(itemPromises);
                fetchedItems = resolved.filter(i => i !== null);
                
                populateCategories();
                render();
            } catch (e) {
                console.error("Fetch error:", e);
                render();
            }
        }

        function populateCategories() {
            const dropdown = document.getElementById('category-dropdown');
            const t = translations[currentLang];
            
            const uniqueCats = new Set();
            fetchedItems.forEach(item => {
                const cat = currentLang === 'en' ? item.category.en : item.category.de;
                if (cat) uniqueCats.add(cat);
            });

            let html = `
                <button onclick="setCategory('all')" class="w-full text-left px-3.5 py-2 rounded-lg text-xs font-bold uppercase tracking-wider hover:bg-white/10 transition-colors ${selectedCategory === 'all' ? 'text-orange-400 bg-white/5' : 'text-zinc-300 hover:text-white'}">
                    ${t.allCategories}
                </button>
            `;

            uniqueCats.forEach(cat => {
                const isSelected = selectedCategory.toLowerCase() === cat.toLowerCase();
                html += `
                    <button onclick="setCategory('${cat.replace(/'/g, "\\'")}')" class="w-full text-left px-3.5 py-2 rounded-lg text-xs font-bold uppercase tracking-wider hover:bg-white/10 transition-colors ${isSelected ? 'text-orange-400 bg-white/5' : 'text-zinc-300 hover:text-white'}">
                        ${cat}
                    </button>
                `;
            });

            dropdown.innerHTML = html;
        }

        function render() {
            const t = translations[currentLang];
            
            document.getElementById('hero-desc').innerText = t.heroDesc;
            document.getElementById('lang-indicator').innerHTML = `<img src="${t.flag}" alt="${t.alt}" class="w-7 h-auto rounded-md shadow-md object-cover opacity-80 hover:opacity-100 transition-opacity duration-200">`;
            
            document.getElementById('cookie-text').innerText = t.cookieText;
            document.getElementById('cookie-decline').innerText = t.cookieDecline;
            document.getElementById('cookie-accept').innerText = t.cookieAccept;
            document.getElementById('search-input').placeholder = t.searchPlaceholder;

            // Platform Button Label
            const platformLabels = {
                all: t.platformBtn,
                willhaben: 'Willhaben',
                vinted: 'Vinted',
                ebay: 'eBay'
            };
            document.getElementById('platform-btn-label').innerText = platformLabels[preferredPlatform];
            document.getElementById('opt-platform-all').innerText = t.allPlatforms;

            // Update Active Platform Styling
            ['all', 'willhaben', 'vinted', 'ebay'].forEach(p => {
                const opt = document.getElementById(`opt-platform-${p}`);
                if (opt) {
                    if (preferredPlatform === p) {
                        opt.className = "w-full text-left px-3.5 py-2.5 rounded-lg text-xs font-bold uppercase tracking-wider text-orange-400 bg-white/5 transition-colors";
                    } else {
                        opt.className = "w-full text-left px-3.5 py-2.5 rounded-lg text-xs font-bold uppercase tracking-wider hover:bg-white/10 text-zinc-300 hover:text-white transition-colors";
                    }
                }
            });

            // Category Button label
            document.getElementById('category-btn-label').innerText = selectedCategory === 'all' ? t.allCategories : selectedCategory;

            // Static profile button texts
            document.querySelectorAll('.profile-btn-text').forEach(el => {
                el.innerText = t.viewProfile;
            });

            populateCategories();

            // Filter items
            const filteredItems = fetchedItems.filter(item => {
                const cat = currentLang === 'en' ? item.category.en : item.category.de;
                const matchesCat = selectedCategory === 'all' || cat.toLowerCase() === selectedCategory.toLowerCase();
                const matchesPlat = matchesPlatform(item);
                const matchesFuzzy = smartMatch(item, searchQuery);

                return matchesCat && matchesPlat && matchesFuzzy;
            });

            // Render Product Cards
            const grid = document.getElementById('shop-grid');

            if (fetchedItems.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-zinc-500 font-bold uppercase tracking-widest text-xs">${t.noItems}</div>`;
                return;
            }

            if (filteredItems.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-zinc-500 font-bold uppercase tracking-widest text-xs">${t.noMatch}</div>`;
                return;
            }

            grid.innerHTML = filteredItems.map(item => {
                const realIndex = fetchedItems.indexOf(item);
                const title = currentLang === 'en' ? item.title.en : item.title.de;
                const desc = currentLang === 'en' ? item.description.en : item.description.de;
                const category = currentLang === 'en' ? item.category.en : item.category.de;
                const priceFormatted = currentLang === 'en' ? (item.price.usd ? `$${item.price.usd}` : `${item.price.eur}€`) : (item.price.eur ? `${item.price.eur}€` : `$${item.price.usd}`);

                return `
                <div onclick="handleItemClick(${realIndex})" class="group relative glass-box rounded-[1.2rem] transition-all duration-300 hover:border-orange-500/80 hover:shadow-[0_0_50px_-5px_rgba(249,115,22,0.4)] active:scale-[0.99] p-4 flex flex-col justify-between overflow-hidden w-full cursor-pointer">
                    
                    <div class="aspect-square w-full rounded-xl overflow-hidden bg-black/40 mb-4 border border-white/5 relative">
                        <img src="${item.image}" alt="${title}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" onerror="this.src='https://api.dicebear.com/7.x/shapes/svg?seed=tech&backgroundColor=161920'" />
                        ${category ? `<span class="absolute top-2 left-2 bg-black/60 backdrop-blur-md px-2.5 py-1 rounded-md text-[9px] font-black uppercase tracking-wider text-zinc-300 border border-white/10">${category}</span>` : ''}
                    </div>
                    
                    <div class="flex flex-col flex-grow justify-between min-w-0">
                        <div>
                            <div class="flex justify-between items-start mb-1 gap-2">
                                <h2 class="text-base sm:text-lg font-black text-white tracking-tight italic uppercase leading-snug truncate pr-1 group-hover:text-orange-400 transition-colors">${title}</h2>
                                ${priceFormatted ? `<span class="text-orange-500 font-extrabold text-sm shrink-0">${priceFormatted}</span>` : ''}
                            </div>
                            <p class="text-zinc-500 text-[10px] sm:text-xs font-bold uppercase tracking-widest line-clamp-2 leading-relaxed mb-3">${desc}</p>
                        </div>
                        
                        <div class="flex items-center justify-between pt-2 border-t border-white/5 mt-auto">
                            <span class="text-[10px] font-black uppercase tracking-widest text-zinc-500 group-hover:text-white transition-colors">Details</span>
                            <div class="text-zinc-700 group-hover:text-white transition-all transform group-hover:translate-x-1 group-hover:-translate-y-1 shrink-0">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${arrowUpRight}</svg>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        window.toggleLang = () => {
            currentLang = currentLang === 'en' ? 'de' : 'en';
            localStorage.setItem('siteLang', currentLang);
            populateCategories();
            render();
        };

        const cookieBanner = document.getElementById('cookie-banner');
        const cookieConsent = localStorage.getItem('siteCookieConsent');

        function injectGA() {
            if (document.getElementById('ga-script')) return;
            const script1 = document.createElement('script');
            script1.id = 'ga-script';
            script1.async = true;
            script1.src = 'https://www.googletagmanager.com/gtag/js?id=G-0WHX0WMFTC';
            document.head.appendChild(script1);

            const script2 = document.createElement('script');
            script2.innerHTML = `
                window.dataLayer = window.dataLayer || [];
                function gtag(){dataLayer.push(arguments);}
                gtag('js', new Date());
                gtag('config', 'G-0WHX0WMFTC');
            `;
            document.head.appendChild(script2);
        }

        if (!cookieConsent) {
            cookieBanner.classList.remove('hidden');
        } else if (cookieConsent === 'granted') {
            injectGA();
        }

        window.handleCookie = (status) => {
            localStorage.setItem('siteCookieConsent', status);
            cookieBanner.classList.add('opacity-0', 'translate-y-full');
            setTimeout(() => cookieBanner.classList.add('hidden'), 400);
            if (status === 'granted') injectGA();
        };

        fetchShopItems();
    </script>
</body>
</html>
