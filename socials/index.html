    <link rel="icon" type="image/png" href="https://thataustrianone.eu/assets/favicon.png">

    <style>
        /* Lokale Schriftarten */
        @font-face {
            font-family: 'Inter';
            src: url('../assets/fonts/inter-v12-latin-regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Inter';
            src: url('../assets/fonts/inter-v12-latin-900.woff2') format('woff2');
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0b0d11; 
            margin: 0; 
            padding: 0; 
            color: white;
            overflow-x: hidden;
        }

        .header-logo-text {
            font-weight: 900;
            font-style: normal;
            text-transform: lowercase;
            letter-spacing: -0.04em;
        }

        .animate-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .group:hover .animate-rotate-slow {
            animation: rotate 3s linear infinite;
        }

        /* Vinyl Rotation Animation */
        @keyframes vinyl-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-vinyl {
            animation: vinyl-spin 8s linear infinite;
        }

        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        .glass-card {
            background: rgba(22, 25, 32, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

                        <img src="https://raw.githubusercontent.com/der46er/craftify/main/assets/favicon.png" alt="Craftify Logo" className="w-12 h-12 mb-3 object-contain group-hover:scale-110 transition-transform duration-300" />
                        <h2 className="text-xl sm:text-2xl font-black uppercase italic mb-0.5 text-white tracking-wide z-10">Craftify <span className="text-[#4ade80]">Mc</span></h2>
                        <p className="text-zinc-500 text-[10px] sm:text-xs font-bold uppercase tracking-widest z-10">www.craftify-mc.eu</p>
                    </a>

                    {links.map((link) => (
                        <a key={link.id} href={link.url} target="_blank" rel="noreferrer" className="group flex items-center p-3 bg-white/[0.03] hover:bg-white/[0.07] border border-white/[0.05] hover:border-white/[0.12] rounded-[1.2rem] transition-all duration-200 active:scale-[0.99]">
                            <div className={`flex-shrink-0 w-12 h-12 rounded-xl ${link.color} flex items-center justify-center shadow-lg transition-transform group-hover:scale-105`} style={link.style || {}}>
                                <Icon path={link.path} viewBox={link.viewBox} className={link.className || "w-6 h-6 text-white"} />
                            </div>
                            <div className="ml-5 flex-grow text-left">
                                <h3 className="text-base sm:text-lg font-black italic tracking-wide text-zinc-100 group-hover:text-white transition-colors leading-none">{link.title}</h3>
                            </div>
                            <div className="text-zinc-700 group-hover:text-white transition-all mr-2">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                            </div>
                        </a>
                    ))}

                    <div className="group flex items-center p-3 bg-white/[0.03] border border-white/[0.05] rounded-[1.2rem] relative overflow-hidden">
                        <div className="absolute top-0 right-0 p-4 opacity-5 text-zinc-500 group-hover:scale-110 transition-transform duration-500 theme-text">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                <path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle>
                            </svg>
                        </div>
                        <div className="flex items-center gap-5 w-full text-left">
                            <div className={`w-14 h-14 rounded-full bg-[#161920] flex items-center justify-center border-2 border-white/5 relative overflow-hidden shrink-0 shadow-xl ${spotify ? 'animate-vinyl' : ''}`}>
                                {spotify?.album_art_url ? (
                                    <>
                                        <img src={spotify.album_art_url} className="w-full h-full object-cover rounded-full" alt="Cover" />
                                        <div className="absolute w-2 h-2 bg-[#0b0d11] rounded-full border border-white/20 z-10"></div>
                                    </>
                                ) : (
                                    <div className="w-8 h-8 opacity-20 theme-drop-shadow transition-all duration-500" style={{ backgroundColor: themeColor, WebkitMaskImage: 'url("../assets/favicon.png")', WebkitMaskSize: 'contain', WebkitMaskRepeat: 'no-repeat', WebkitMaskPosition: 'center center', maskImage: 'url("../assets/favicon.png")', maskSize: 'contain', maskRepeat: 'no-repeat', maskPosition: 'center center' }}></div>
                                )}
                            </div>
                            <div className="text-left overflow-hidden">
                                <p className="text-[8px] font-black uppercase tracking-[0.2em] mb-0.5 theme-text transition-colors duration-500">{spotify ? "Currently listening:" : "Quiet Mode"}</p>
                                <p className="text-sm sm:text-base font-black italic uppercase text-white truncate leading-tight">{spotify?.song || "Silence"}</p>
                                <p className="text-zinc-500 text-[10px] font-bold uppercase tracking-widest mt-0.5 truncate leading-none">{spotify?.artist || "thataustrianone"}</p>
                            </div>
                        </div>
                    </div>
                </main>

                <footer className="mt-4 text-center flex flex-col items-center gap-1.5 mb-8 w-full mt-auto relative z-10">
                    <a href="https://thataustrianone.eu/socials" className="text-white/20 text-[10px] font-black tracking-[0.5em] uppercase italic leading-none cursor-pointer">
                        © {new Date().getFullYear()} — Nick (@der_46er)
                    </a>
                    <div className="text-[10px] font-bold text-white/20 uppercase tracking-widest select-none leading-none">
                        LIVE BUILD v1.3.1 | {new Date().toLocaleDateString('de-DE')}
                    </div>
                    <button onClick={() => setShowLegal(true)} className="text-[9px] font-bold tracking-[0.3em] text-zinc-700 hover:text-zinc-400 transition-colors uppercase leading-none mt-0.5">
                        LEGAL & INFO
                    </button>
                </footer>
            </div>

            {showLegal && (
                <div className="fixed inset-0 flex items-center justify-center p-4 animate-in text-zinc-100" style={{ backgroundColor: '#0b0d11', zIndex: 9999 }}>
                    <div className="rounded-[2.5rem] w-full max-w-lg max-h-[85vh] overflow-hidden flex flex-col shadow-2xl border border-white/10 bg-[#0b0d11]">
                        <div className="p-8 md:p-10 border-b border-white/5 flex justify-between items-center text-left">
                            <h2 className="text-xl md:text-2xl font-black italic uppercase tracking-tighter text-white">Legal Information</h2>
                            <button onClick={() => setShowLegal(false)} className="p-2 text-zinc-500 hover:text-white transition-all">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                            </button>
                        </div>
                        <div className="p-8 md:p-10 overflow-y-auto custom-scroll text-left">
                            <div className="text-zinc-400 text-xs sm:text-sm whitespace-pre-wrap leading-relaxed font-medium italic">{legalText}</div>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
