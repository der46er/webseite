<html lang="en">
<head>

    <title>Social Links | thataustrianone</title>
    
    <link rel="icon" type="image/png" href="../assets/favicon.png">

    <style>
        /* Lokale Schriftarten */
        @font-face {
            font-family: 'Inter';
            src: url('../assets/fonts/inter-v12-latin-regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Inter';
            src: url('../assets/fonts/inter-v12-latin-900.woff2') format('woff2');
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0b0d11; 
            margin: 0; 
            padding: 0; 
            color: white;
            overflow-x: hidden;
        }

        .header-logo-text {
            font-weight: 900;
            font-style: normal;
            text-transform: lowercase;
            letter-spacing: -0.04em;
        }

        .animate-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .group:hover .animate-rotate-slow {
            animation: rotate 3s linear infinite;
        }

        /* Vinyl Rotation Animation */
        @keyframes vinyl-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-vinyl {
            animation: vinyl-spin 8s linear infinite;
        }

        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        .glass-card {
            background: rgba(22, 25, 32, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
