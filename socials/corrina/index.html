<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Links | Corrina Außerwöger</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,900;1,400;1,500;1,700;1,900&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #faf9f6; 
            color: #2d3748; 
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        
        .font-serif { 
            font-family: 'Playfair Display', serif; 
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
        }
        
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
        }

        .animate-in { 
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        }
        
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const X = ({ size }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        );

        const links = [
            {
                id: 'linkedin',
                title: 'LinkedIn',
                icon: (
                    <svg viewBox="0 0 24 24" fill="currentColor" className="w-5 h-5 text-white">
                        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                    </svg>
                ),
                color: 'bg-[#0077b5]',
                url: 'https://www.linkedin.com/in/bmst-ing-außerwöger-corrina-78a365127/'
            },
            {
                id: 'xing',
                title: 'Xing',
                icon: (
                    <svg viewBox="0 0 24 24" fill="currentColor" className="w-5 h-5 text-white">
                        <path d="M18.188 0c-.517 0-.741.325-.927.66 0 0-7.455 13.224-7.702 13.657.015.024 4.919 9.023 4.919 9.023.17.308.436.66.967.66h3.454c.217 0 .375-.078.463-.252.089-.173.089-.384-.009-.562l-4.89-8.906 7.678-13.56c.098-.188.089-.399 0-.573-.088-.174-.246-.147-.463-.147h-3.49zm-8.825 8.927a.64.64 0 0 0-.583-.343H5.474c-.217 0-.376.088-.464.262-.089.174-.089.385.009.563l2.28 3.966-3.52 6.136c-.099.188-.089.399 0 .573.088.174.246.252.463.252h3.306c.517 0 .741-.326.927-.66l3.65-6.326-2.762-4.423z"/>
                    </svg>
                ),
                color: 'bg-[#006567]',
                url: 'https://www.xing.com/profile/Corrina_Ausserwoeger'
            },
            {
                id: 'instagram',
                title: 'Instagram',
                icon: (
                    <svg viewBox="0 0 24 24" fill="currentColor" className="w-5 h-5 text-white">
                        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
                    </svg>
                ),
                color: '',
                inlineStyle: { background: 'linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%)' },
                url: 'https://www.instagram.com/cd76_at'
            },
            {
                id: 'facebook',
                title: 'Facebook',
                icon: (
                    <svg viewBox="0 0 24 24" fill="currentColor" className="w-5 h-5 text-white">
                        <path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z"/>
                    </svg>
                ),
                color: 'bg-[#1877F2]',
                url: 'https://www.facebook.com/profile.php?id=1521434868'
            },
            {
                id: 'tiktok',
                title: 'TikTok',
                icon: (
                    <svg viewBox="0 0 24 24" fill="currentColor" className="w-5 h-5 text-white">
                        <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
                    </svg>
                ),
                color: 'bg-black',
                url: 'https://www.tiktok.com/@conilo51'
            }
        ];

        const App = () => {
            const [showLegal, setShowLegal] = useState(false);
            const [legalText, setLegalText] = useState("Loading legal information...");

            useEffect(() => {
                fetch("../assets/legal.txt", { cache: 'no-cache' })
                    .then(res => res.text())
                    .then(text => setLegalText(text))
                    .catch(() => setLegalText("Error loading legal information."));
            }, []);

            return (
                <div className="min-h-screen relative flex flex-col items-center justify-center py-12 px-4 pb-16">
                    
                    {/* Background Soft Glows */}
                    <div className="fixed top-[-15%] left-[-10%] w-[60%] h-[60%] bg-[#fdf2f8] rounded-full mix-blend-multiply filter blur-[120px] opacity-80 pointer-events-none"></div>
                    <div className="fixed bottom-[-15%] right-[-10%] w-[60%] h-[60%] bg-[#f0fdfa] rounded-full mix-blend-multiply filter blur-[120px] opacity-80 pointer-events-none"></div>
                    
                    <div className="w-full max-w-[420px] relative z-10 animate-in flex flex-col gap-6">
                        
                        {/* Header Area */}
                        <header className="flex flex-col items-center text-center gap-5 mb-2">
                            <div className="w-32 h-32 sm:w-36 sm:h-36 relative">
                                <div className="absolute inset-0 rounded-full border-[3px] border-white shadow-[0_8px_30px_rgb(0,0,0,0.08)] overflow-hidden bg-white">
                                    <img 
                                        src="https://raw.githubusercontent.com/der46er/webseite/main/socials/corrina/pfp_corrina.webp" 
                                        alt="Corrina Außerwöger" 
                                        className="w-full h-full object-cover"
                                    />
                                </div>
                            </div>
                            <div className="flex flex-col gap-1.5">
                                <h1 className="text-2xl sm:text-[28px] font-serif text-[#2d3748] tracking-tight m-0">
                                    Corrina Außerwöger
                                </h1>
                                <p className="text-[#718096] font-medium text-sm sm:text-base tracking-wide m-0">
                                    Bmst. Ing.
                                </p>
                            </div>
                        </header>

                        {/* Links Container */}
                        <main className="flex flex-col gap-3 w-full">
                            {links.map(link => (
                                <a 
                                    key={link.id}
                                    href={link.url}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="group glass-card flex items-center p-3 rounded-[1.2rem] transition-all duration-300"
                                >
                                    <div 
                                        className={`flex-shrink-0 w-12 h-12 rounded-[14px] ${link.color} flex items-center justify-center shadow-md transition-transform duration-300 group-hover:scale-105`}
                                        style={link.inlineStyle || {}}
                                    >
                                        {link.icon}
                                    </div>
                                    <div className="ml-4 flex-grow">
                                        <h3 className="text-[15px] sm:text-base font-semibold text-[#4a5568] group-hover:text-[#1a202c] transition-colors m-0">
                                            {link.title}
                                        </h3>
                                    </div>
                                    <div className="text-[#cbd5e0] group-hover:text-[#a0aec0] transition-colors mr-3">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                            <polyline points="9 18 15 12 9 6"></polyline>
                                        </svg>
                                    </div>
                                </a>
                            ))}
                        </main>

                        {/* Footer - Maintained from original */}
                        <footer className="mt-8 text-center flex flex-col items-center gap-1.5">
                            <div className="text-[#718096] text-[10px] font-black tracking-[0.5em] uppercase opacity-60 italic leading-none">
                                © {new Date().getFullYear()} — THAT AUSTRIAN ONE
                            </div>
                            <div className="text-[10px] font-bold text-[#a0aec0] uppercase tracking-widest select-none leading-none">
                                LIVE BUILD v1.3.1 | {new Date().toLocaleDateString('de-DE')}
                            </div>
                            <button 
                                onClick={() => setShowLegal(true)} 
                                className="text-[9px] font-bold tracking-[0.3em] text-[#718096] hover:text-[#2d3748] transition-colors uppercase leading-none mt-0.5"
                            >
                                LEGAL & INFO
                            </button>
                        </footer>
                    </div>

                    {/* Legal Modal - Cozy/Professional adaptation */}
                    {showLegal && (
                        <div className="fixed inset-0 flex items-center justify-center p-4 animate-in text-[#2d3748]" style={{ backgroundColor: 'rgba(250, 249, 246, 0.85)', backdropFilter: 'blur(8px)', WebkitBackdropFilter: 'blur(8px)', zIndex: 9999 }}>
                            <div className="rounded-[2rem] w-full max-w-lg max-h-[85vh] overflow-hidden flex flex-col shadow-2xl border border-gray-200" style={{ backgroundColor: '#ffffff' }}>
                                <div className="p-8 md:p-10 border-b border-gray-100 flex justify-between items-center text-left">
                                    <h2 className="text-xl md:text-2xl font-black italic uppercase tracking-tighter text-[#2d3748]">Legal Information</h2>
                                    <button onClick={() => setShowLegal(false)} className="p-2 text-gray-400 hover:text-gray-800 transition-all rounded-full hover:bg-gray-50">
                                        <X size={24} />
                                    </button>
                                </div>
                                <div className="p-8 md:p-10 overflow-y-auto custom-scroll text-left">
                                    <div className="text-gray-500 text-xs sm:text-sm whitespace-pre-wrap leading-relaxed font-medium italic">
                                        {legalText}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
