    <style>
        @font-face { font-family: 'Inter'; src: url('../assets/fonts/inter-v12-latin-regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
        @font-face { font-family: 'Inter'; src: url('../assets/fonts/inter-v12-latin-900.woff2') format('woff2'); font-weight: 900; font-display: swap; }
        
        :root { --theme-color: #dc2626; --theme-rgb: 220, 38, 38; }
        
        body { font-family: 'Inter', sans-serif; background-color: #0b0d11; color: white; overflow-x: hidden; }
        .animate-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .group:hover .animate-rotate-slow { animation: rotate 3s linear infinite; }
        @keyframes vinyl-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-vinyl { animation: vinyl-spin 8s linear infinite; }
        
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        
        /* Dynamic Theme Classes */
        .theme-text { color: var(--theme-color); }
        .theme-bg-glow { background-color: rgba(var(--theme-rgb), 0.15); }
        .theme-border-hover:hover { border-color: rgba(var(--theme-rgb), 0.5) !important; }
        .theme-drop-shadow { filter: drop-shadow(0 0 8px var(--theme-color)); }
    </style>

    <script>
        // Set dynamic dates safely
        const d = new Date();
        const yearEl = document.getElementById('year');
        if (yearEl) yearEl.innerText = d.getFullYear();
        
        const dateEl = document.getElementById('date');
        if (dateEl) dateEl.innerText = d.toLocaleDateString('de-DE');

        // Function to paint the favicon dynamically
        function updateFaviconColor(hex) {
            const img = new Image();
            img.crossOrigin = 'Anonymous';
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                
                // Draw original image
                ctx.drawImage(img, 0, 0);
                
                // Paint the hex color over the non-transparent parts
                ctx.globalCompositeOperation = 'source-in';
                ctx.fillStyle = hex;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Update the favicon link
                let link = document.querySelector("link[rel~='icon']");
                if (!link) {
                    link = document.createElement('link');
                    link.rel = 'icon';
                    document.head.appendChild(link);
                }
                link.href = canvas.toDataURL('image/png');
            };
            img.src = '../assets/favicon.png';
        }

        // 1. Immediately update favicon to the default theme color (red)
        updateFaviconColor('#dc2626');

        // 2. Fetch Theme Color and optionally update again
        fetch('https://raw.githubusercontent.com/der46er/webseite/refs/heads/main/socials/matt/theme.txt', { cache: 'no-cache' }).then(r => r.text()).then(t => {
            let hex = t.trim().startsWith('#') ? t.trim() : '#' + t.trim();
            if (/^#([0-9A-F]{3}|[0-9A-F]{6})$/i.test(hex)) {
                let c = hex.replace('#', '');
                if(c.length === 3) c = c.split('').map(x=>x+x).join('');
                document.documentElement.style.setProperty('--theme-color', hex);
                document.documentElement.style.setProperty('--theme-rgb', `${parseInt(c.substr(0,2),16)}, ${parseInt(c.substr(2,2),16)}, ${parseInt(c.substr(4,2),16)}`);
                
                // Re-paint favicon if the theme file has a custom color
                updateFaviconColor(hex);
            }
        }).catch(()=>{});

        // Legal Modal Logic safely guarded
        const modal = document.getElementById('modal');
        const legalText = document.getElementById('legal-text');
        const legalBtn = document.getElementById('legal-btn');
        const closeModalBtn = document.getElementById('close-modal');
        
        if (legalBtn && modal) legalBtn.onclick = () => modal.classList.remove('hidden');
        if (closeModalBtn && modal) closeModalBtn.onclick = () => modal.classList.add('hidden');
        
        if (legalText) {
            fetch('https://raw.githubusercontent.com/der46er/webseite/main/assets/legal.txt', { cache: 'no-cache' })
                .then(r => r.text()).then(t => legalText.innerText = t)
                .catch(() => legalText.innerText = "Error loading legal information.");
        }

        // Spotify Lanyard Integration
        const fetchSpotify = async () => {
            try {
                const res = await fetch('https://api.lanyard.rest/v1/users/1134871624894656563', { cache: 'no-cache' });
                const { data } = await res.json();
                const sp = data?.listening_to_spotify ? data.spotify : null;
                
                const cont = document.getElementById('sp-cont'), cover = document.getElementById('sp-cover'), icon = document.getElementById('sp-icon'), dot = document.getElementById('sp-dot');
                if (document.getElementById('sp-title')) document.getElementById('sp-title').innerText = sp ? 'Currently listening:' : 'Spotify';
                if (document.getElementById('sp-song')) document.getElementById('sp-song').innerText = sp ? sp.song : 'Silence';
                if (document.getElementById('sp-artist')) document.getElementById('sp-artist').innerText = sp ? sp.artist : '(Not listening to music at the moment)';
                
                if (cont && cover && dot && icon) {
                    if (sp) {
                        cont.classList.add('animate-vinyl');
                        cover.src = sp.album_art_url;
                        cover.classList.remove('hidden');
                        dot.classList.remove('hidden');
                        icon.classList.add('hidden');
                    } else {
                        cont.classList.remove('animate-vinyl');
                        cover.classList.add('hidden');
                        dot.classList.add('hidden');
                        icon.classList.remove('hidden');
                    }
                }
            } catch(e) {}
        };
        fetchSpotify();
        setInterval(fetchSpotify, 10000);
    </script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const profileCards = document.querySelectorAll('.profile-card');

            profileCards.forEach(card => {
                const img = card.querySelector('.profile-img');

                if (img.complete) {
                    applyDynamicColor(img, card);
                } else {
                    img.addEventListener('load', () => applyDynamicColor(img, card));
                }
            });

            function applyDynamicColor(imgElement, containerElement) {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Keep canvas small for performance
                canvas.width = imgElement.naturalWidth || 100;
                canvas.height = imgElement.naturalHeight || 100;

                try {
                    ctx.drawImage(imgElement, 0, 0, canvas.width, canvas.height);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                    
                    let r = 0, g = 0, b = 0, count = 0;
                    
                    // Jump through pixels by 16 (rgba * 4) to speed up calculation
                    for (let i = 0; i < imageData.length; i += 16) {
                        // Ignore fully transparent pixels
                        if (imageData[i + 3] > 0) {
                            r += imageData[i];
                            g += imageData[i + 1];
                            b += imageData[i + 2];
                            count++;
                        }
                    }
                    
                    if (count > 0) {
                        r = Math.floor(r / count);
                        g = Math.floor(g / count);
                        b = Math.floor(b / count);
                        
                        // Apply the calculated RGB to the custom CSS variable
                        containerElement.style.setProperty('--dynamic-color', `rgb(${r}, ${g}, ${b})`);
                    }
                } catch (e) {
                    console.error("Could not extract image color.", e);
                }
            }
        });
    </script>
