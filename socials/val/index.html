<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Links | Valerie</title>
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/der46er/webseite/main/assets/favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Custom Fonts */
        @font-face {
            font-family: 'Inter';
            src: url('../assets/fonts/inter-v12-latin-regular.woff2') format('woff2');
            font-weight: 400; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'Inter';
            src: url('../assets/fonts/inter-v12-latin-900.woff2') format('woff2');
            font-weight: 900; font-style: normal; font-display: swap;
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0b080a; 
            margin: 0; padding: 0; color: white; overflow-x: hidden;
        }

        /* Animations */
        .animate-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes rotate-reverse { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
        
        .animate-ring-1 { animation: rotate 4s linear infinite; }
        .animate-ring-2 { animation: rotate-reverse 6s linear infinite; }

        /* Scrollbars */
        .custom-scroll::-webkit-scrollbar, .modal-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track, .modal-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #ff00aa; border-radius: 10px; }
        .modal-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        /* Glassmorphism */
        .glass-card {
            background: rgba(22, 25, 32, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Helper Functions ---
        const hexToRgb = (hex) => {
            let cleanHex = hex.replace('#', '');
            if (cleanHex.length === 3) cleanHex = cleanHex.split('').map(c => c + c).join('');
            if (cleanHex.length !== 6) return "255, 105, 180"; // Fallback color
            return `${parseInt(cleanHex.substring(0, 2), 16)}, ${parseInt(cleanHex.substring(2, 4), 16)}, ${parseInt(cleanHex.substring(4, 6), 16)}`;
        };

        // --- Icons ---
        const TiktokIcon = ({ className }) => (
            <svg className={className} fill="currentColor" viewBox="0 0 24 24">
                <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
            </svg>
        );

        const InstagramIcon = ({ className }) => (
            <svg className={className} fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
            </svg>
        );

        const ChevronRight = ({ size }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="9 18 15 12 9 6" />
            </svg>
        );

        const XIcon = ({ size }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        );

        const App = () => {
            const [showLegal, setShowLegal] = useState(false);
            const [legalText, setLegalText] = useState("Loading legal information...");
            const [themeColor, setThemeColor] = useState("#ff00aa");

            const links = [
                {
                    id: 'tiktok',
                    title: 'TikTok',
                    icon: <TiktokIcon className="w-6 h-6 text-white" />,
                    color: 'bg-black',
                    url: 'https://www.tiktok.com/@valerie_bing123'
                },
                {
                    id: 'instagram',
                    title: 'Instagram',
                    icon: <InstagramIcon className="w-6 h-6 text-white" />,
                    color: '',
                    inlineStyle: { background: 'linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%)' },
                    url: 'https://instagram.com/spider_man3607'
                }
            ];

            useEffect(() => {
                fetch("../assets/theme.txt", { cache: 'no-cache' })
                    .then(res => res.text())
                    .then(text => {
                        const trimmed = text.trim();
                        setThemeColor(/^#?([0-9A-F]{3}|[0-9A-F]{6})$/i.test(trimmed) ? (trimmed.startsWith('#') ? trimmed : '#' + trimmed) : "#ff00aa");
                    })
                    .catch(() => setThemeColor("#ff00aa"));
            }, []);

            useEffect(() => {
                fetch("https://raw.githubusercontent.com/der46er/webseite/refs/heads/main/assets/legal.txt", { cache: 'no-cache' })
                    .then(res => res.text())
                    .then(setLegalText)
                    .catch(() => setLegalText("Error loading legal information."));
            }, []);

            const themeRgb = hexToRgb(themeColor);

            return (
                <div className="flex flex-col min-h-screen bg-[#0b080a] text-white selection:bg-pink-500/30 overflow-x-hidden relative">
                    <style>
                        {`
                        .theme-text { color: ${themeColor}; }
                        .theme-bg-glow { background-color: rgba(${themeRgb}, 0.15); }
                        .theme-border-hover:hover { border-color: rgba(${themeRgb}, 0.5) !important; }
                        .theme-drop-shadow { filter: drop-shadow(0 0 10px ${themeColor}); }
                        `}
                    </style>
                    
                    {/* Background Glows */}
                    <div className="fixed top-0 left-0 w-full h-full pointer-events-none">
                        <div className="absolute top-[-5%] left-[-5%] w-[40%] h-[40%] blur-[100px] rounded-full theme-bg-glow transition-all duration-1000"></div>
                        <div className="absolute bottom-[-5%] right-[-5%] w-[40%] h-[40%] blur-[100px] rounded-full theme-bg-glow transition-all duration-1000"></div>
                    </div>
                    
                    <div className="flex-grow relative z-10 max-w-xl mx-auto px-4 pt-20 sm:pt-28 md:pt-36 animate-in flex flex-col gap-5 w-full">
                        <header className="flex flex-col items-center text-center mb-6">
                            <div className="group flex flex-col items-center gap-6 no-underline">
                                <div className="relative flex-shrink-0 mb-2 w-[clamp(100px,40vw,200px)] h-[clamp(100px,40vw,200px)]">
                                    <div className="absolute -inset-4 rounded-full border-[3px] border-pink-500/40 shadow-[0_0_20px_#ec4899] animate-ring-1"></div>
                                    <div className="absolute -inset-2 rounded-full border-[2px] border-pink-400/60 shadow-[0_0_15px_#f472b6] animate-ring-2"></div>
                                    <div className="relative w-full h-full rounded-full border-[3px] border-[#0b080a] shadow-2xl overflow-hidden bg-[#161920] z-10">
                                        <img 
                                            src="https://raw.githubusercontent.com/der46er/webseite/main/socials/val/valerie_pfp.webp" 
                                            alt="Valerie" 
                                            className="w-full h-full object-cover object-center scale-105" 
                                        />
                                    </div>
                                </div>
                                <h1 className="font-black italic uppercase tracking-tighter text-white drop-shadow-lg leading-none text-center text-[clamp(1.5rem,6vw,2.5rem)]">
                                    VALERIE 🎀
                                </h1>
                            </div>
                        </header>
                        
                        <main className="flex flex-col gap-4 w-full">
                            {links.map(link => (
                                <a key={link.id} href={link.url} target="_blank" className="group flex items-center p-3 bg-white/[0.03] hover:bg-white/[0.07] border border-white/[0.05] hover:border-pink-500/40 rounded-full transition-all duration-300 active:scale-[0.98] shadow-lg backdrop-blur-md">
                                    <div className={`flex-shrink-0 w-12 h-12 rounded-full ${link.color} flex items-center justify-center shadow-md transition-transform group-hover:scale-105`} style={link.inlineStyle || {}}>
                                        {link.icon}
                                    </div>
                                    <div className="ml-5 flex-grow text-left">
                                        <h3 className="text-base sm:text-lg font-black italic tracking-wide text-zinc-100 group-hover:text-white transition-colors leading-none">{link.title}</h3>
                                    </div>
                                    <div className="text-zinc-600 group-hover:text-[#ff00aa] transition-all mr-3">
                                        <ChevronRight size={22} />
                                    </div>
                                </a>
                            ))}
                        </main>
                    </div>

                    <footer onClick={() => window.location.href='https://thataustrianone.eu/legal/'} className="w-full text-center py-6 mt-auto cursor-pointer group select-none">
    <p className="text-zinc-600 text-[10px] sm:text-xs font-black italic tracking-widest uppercase opacity-70 group-hover:opacity-100 group-hover:text-white transition-all duration-200">
        © 2026 — @der_46er
    </p>
</footer>

                    {/* Legal Modal */}
                    {showLegal && (
                        <div className="fixed inset-0 flex items-center justify-center p-4 animate-in text-zinc-100" style={{ backgroundColor: '#0b0d11', opacity: 1, zIndex: 9999 }}>
                            <div className="rounded-[2.5rem] w-full max-w-lg max-h-[85vh] overflow-hidden flex flex-col shadow-2xl border border-white/10" style={{ backgroundColor: '#0b0d11', opacity: 1 }}>
                                <div className="p-8 md:p-10 border-b border-white/5 flex justify-between items-center text-left">
                                    <h2 className="text-xl md:text-2xl font-black italic uppercase tracking-tighter text-white">Legal Information</h2>
                                    <button onClick={() => setShowLegal(false)} className="p-2 text-zinc-500 hover:text-white transition-all">
                                        <XIcon size={24} />
                                    </button>
                                </div>
                                <div className="p-8 md:p-10 overflow-y-auto custom-scroll text-left">
                                    <div className="text-zinc-400 text-xs sm:text-sm whitespace-pre-wrap leading-relaxed font-medium italic">
                                        {legalText}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
