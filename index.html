<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Nick</title>
    
    <link rel="icon" type="image/png" href="./assets/favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Local Fonts routed through a CDN to fix mobile CORS blocking and MIME type errors */
        @font-face { font-family: 'Inter'; src: url('https://cdn.jsdelivr.net/gh/der46er/webseite@main/assets/fonts/inter-v12-latin-regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
        @font-face { font-family: 'Inter'; src: url('https://cdn.jsdelivr.net/gh/der46er/webseite@main/assets/fonts/inter-v12-latin-900.woff2') format('woff2'); font-weight: 900; font-display: swap; }
        
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background-color: #0b0d11; 
            color: white; 
            margin: 0; 
            padding: 0; 
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100lvh;
            background-image: url("https://cdn.jsdelivr.net/gh/der46er/webseite@main/assets/backgounds/waves-cyan-black.webp");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(8px);
            transform: scale(1.05);
            opacity: 1;
            z-index: -2;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100lvh;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.015'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: -1;
        }
        
        .animate-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .glass-box {
            background: rgba(18, 18, 18, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>

<body class="flex flex-col min-h-[100dvh] w-full overflow-x-hidden overflow-y-auto selection:bg-white/10 relative">

    <main class="relative z-10 max-w-[92rem] mx-auto px-4 sm:px-6 lg:px-10 w-full flex-grow flex flex-col justify-center py-8 lg:py-6">
        
        <div class="w-full text-center shrink-0 mb-6 lg:mb-8 animate-in" style="animation-delay: 0.1s; opacity: 0;">
            <h1 id="hero-title" class="text-4xl sm:text-5xl lg:text-6xl font-black italic uppercase tracking-tighter text-white mb-2">
            </h1>
            <p id="hero-desc" class="text-zinc-400 text-xs sm:text-sm lg:text-base font-medium max-w-xl mx-auto tracking-wide min-h-[1.25rem]">
            </p>
        </div>

        <!-- Dynamic 12-column grid -->
        <div id="bento-grid" class="w-full grid grid-cols-1 md:grid-cols-12 gap-3.5 sm:gap-4 flex-grow animate-in" style="animation-delay: 0.2s; opacity: 0;">
        </div>
    </main>

    <footer class="w-full flex justify-between items-center px-6 lg:px-10 py-4 shrink-0 relative z-10 select-none">
        <button onclick="toggleLang()" id="lang-indicator" class="focus:outline-none hover:scale-105 active:scale-95 transition-all duration-200">
            <img id="flag-img" src="" alt="Flag" class="w-7 h-auto rounded-md shadow-md object-contain opacity-80 hover:opacity-100 transition-opacity duration-200" style="image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges;">
        </button>
        <p onclick="window.location.href='https://thataustrianone.eu/legal/'" class="cursor-pointer text-zinc-600 text-[10px] sm:text-xs font-black italic tracking-widest uppercase opacity-70 hover:opacity-100 hover:text-white transition-all duration-300">
            © <span id="year">2026</span> — @der_46er
        </p>
    </footer>

    <div id="cookie-banner" class="hidden fixed bottom-0 left-0 w-full bg-[#0b0d11]/95 backdrop-blur-xl border-t border-white/10 p-4 sm:p-6 z-[200] flex flex-col sm:flex-row justify-between items-center gap-4 animate-in">
        <div class="text-xs sm:text-sm text-zinc-300 max-w-3xl font-medium leading-relaxed">
            <p id="cookie-text"></p>
        </div>
        <div class="flex gap-3 flex-shrink-0 w-full sm:w-auto">
            <button onclick="handleCookie('denied')" id="cookie-decline" class="flex-1 sm:flex-none px-6 py-3 rounded-xl font-bold text-xs text-zinc-500 hover:text-white hover:bg-white/5 border border-white/10 transition-colors uppercase tracking-widest"></button>
            <button onclick="handleCookie('granted')" id="cookie-accept" class="flex-1 sm:flex-none px-6 py-3 rounded-xl font-bold text-xs bg-white text-black hover:bg-zinc-200 transition-colors uppercase tracking-widest shadow-lg"></button>
        </div>
    </div>

    <script>
        function escapeHTML(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        document.getElementById('year').innerText = new Date().getFullYear();

        const arrowUpRight = '<line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline>';

        const cardData = [
            { 
                id: 'projects', 
                href: "https://thataustrianone.eu/projects/", 
                isExternal: false,
                gridClass: "col-span-1 md:col-span-6 min-h-[145px] lg:min-h-[175px]",
                iconClass: "text-zinc-300 bg-zinc-300/10",
                hoverBorder: "hover:border-zinc-300/80",
                hoverShadow: "hover:shadow-[0_0_50px_-5px_rgba(212,212,216,0.4)]",
                icon: '<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',
                arrowIcon: arrowUpRight
            },
            { 
                id: 'shop', 
                href: "https://thataustrianone.eu/shop/", 
                isExternal: false,
                gridClass: "col-span-1 md:col-span-6 min-h-[145px] lg:min-h-[175px]",
                iconClass: "text-orange-500 bg-orange-500/10",
                hoverBorder: "hover:border-orange-500/80",
                hoverShadow: "hover:shadow-[0_0_50px_-5px_rgba(249,115,22,0.4)]",
                icon: '<path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>',
                arrowIcon: arrowUpRight
            },
            { 
                id: 'products', 
                href: "https://thataustrianone.eu/products/", 
                isExternal: false,
                gridClass: "col-span-1 md:col-span-4 min-h-[145px] lg:min-h-[175px]",
                iconClass: "text-emerald-500 bg-emerald-500/10",
                hoverBorder: "hover:border-emerald-500/80",
                hoverShadow: "hover:shadow-[0_0_50px_-5px_rgba(168,85,247,0.4)]",
                icon: '<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>',
                arrowIcon: arrowUpRight
            },
            { 
                id: 'tutorials', 
                href: "https://thataustrianone.eu/tutorials/", 
                isExternal: false,
                gridClass: "col-span-1 md:col-span-4 min-h-[145px] lg:min-h-[175px]",
                iconClass: "text-purple-500 bg-purple-500/10",
                hoverBorder: "hover:border-purple-500/80",
                hoverShadow: "hover:shadow-[0_0_50px_-5px_rgba(168,85,247,0.4)]",
                icon: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
                arrowIcon: arrowUpRight
            },
            { 
                id: 'about', 
                href: "https://thataustrianone.eu/about-me/", 
                isExternal: false,
                gridClass: "col-span-1 md:col-span-4 min-h-[145px] lg:min-h-[175px]",
                iconClass: "text-blue-500 bg-blue-500/10",
                hoverBorder: "hover:border-blue-500/80",
                hoverShadow: "hover:shadow-[0_0_50px_-5px_rgba(59,130,246,0.4)]",
                icon: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
                arrowIcon: arrowUpRight
            },
            { 
                id: 'socials', 
                href: "https://thataustrianone.eu/socials", 
                isExternal: false,
                gridClass: "col-span-1 md:col-span-12 min-h-[135px] lg:min-h-[160px]",
                iconClass: "text-red-500 bg-red-500/10",
                hoverBorder: "hover:border-red-500/80",
                hoverShadow: "hover:shadow-[0_0_50px_-5px_rgba(239,68,68,0.4)]",
                icon: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>',
                arrowIcon: arrowUpRight
            }
        ];

        const translations = {
            de: {
                flag: "https://cdn.jsdelivr.net/gh/der46er/webseite@main/assets/flags/austria-flag.webp",
                alt: "Austria Flag",
                heroTitle: "Willkommen",
                heroDesc: "Entdecke meine Hardware, Software-Projekte, Socials und mehr",
                cookieText: "Wir verwenden Cookies und Google Analytics, um unsere Website zu verbessern und den Traffic zu analysieren. Stimmst du der Nutzung zu?",
                cookieDecline: "Ablehnen", cookieAccept: "Akzeptieren",
                content: {
                    projects: { title: "Projekte", desc: "Webseiten, Themes & mehr" },
                    shop: { title: "Hardware Marktplatz", desc: "Check meine aktuellen Inserate" },
                    products: { title: "Produkte", desc: "Affiliate" },
                    tutorials: { title: "Tech Tutorials", desc: "Simple Tutorials" },
                    about: { title: "Über Mich", desc: ";]]" },
                    socials: { title: "Socials", desc: "Folge mir auf meinen Kanälen" }
                }
            },
            en: {
                flag: "https://cdn.jsdelivr.net/gh/der46er/webseite@main/assets/flags/united-kingdom-flag.webp",
                alt: "UK Flag",
                heroTitle: "Welcome",
                heroDesc: "Explore my hardware listings, software projects, socials, and more",
                cookieText: "We use cookies and Google Analytics to improve our website and analyze traffic. Do you accept the use of cookies?",
                cookieDecline: "Decline", cookieAccept: "Accept",
                content: {
                    projects: { title: "Projects", desc: "Websites, Themes & more" },
                    shop: { title: "Hardware Marketplace", desc: "Browse my latest listings" },
                    products: { title: "Products", desc: "Affiliate" },
                    tutorials: { title: "Tech Tutorials", desc: "Simple Tutorials" },
                    about: { title: "About Me", desc: ";]]" },
                    socials: { title: "Socials", desc: "Follow me on my channels" }
                }
            }
        };

        let currentLang = localStorage.getItem('siteLang') || 'en';

        function initGrid() {
            const grid = document.getElementById('bento-grid');
            grid.innerHTML = cardData.map(c => `
                <a href="${c.href}" target="${c.isExternal ? '_blank' : '_self'}" class="group relative glass-box rounded-[1.2rem] transition-all duration-300 ${c.hoverBorder} ${c.hoverShadow} active:scale-[0.99] ${c.gridClass} p-5 lg:p-6 flex flex-col justify-between overflow-hidden">
                    <div class="flex items-start justify-start w-full">
                        <div class="w-12 h-12 md:w-14 md:h-14 rounded-xl sm:rounded-2xl flex items-center justify-center shrink-0 transition-transform duration-500 group-hover:-translate-y-1 ${c.iconClass} z-10">
                            <svg class="w-6 h-6 md:w-7 md:h-7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">${c.icon}</svg>
                        </div>
                    </div>
                    
                    <div class="z-10 mt-auto pt-6 flex items-end justify-between w-full">
                        <div class="flex flex-col justify-end min-w-0 pr-4">
                            <h2 id="card-title-${c.id}" class="text-xl sm:text-2xl font-black text-white tracking-tight italic uppercase leading-none mb-1 group-hover:text-white transition-colors truncate pr-2"></h2>
                            <p id="card-desc-${c.id}" class="text-zinc-500 text-[10px] sm:text-xs md:text-sm font-bold uppercase tracking-widest truncate pr-2"></p>
                        </div>
                        
                        <div class="text-zinc-700 group-hover:text-white transition-all transform group-hover:translate-x-1 group-hover:-translate-y-1 shrink-0 pb-0.5">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${c.arrowIcon}</svg>
                        </div>
                    </div>
                </a>
            `).join('');
        }

        function updateContent() {
            const t = translations[currentLang];
            
            document.getElementById('hero-title').textContent = t.heroTitle;
            document.getElementById('hero-desc').textContent = t.heroDesc;
            
            const flagImg = document.getElementById('flag-img');
            flagImg.src = t.flag;
            flagImg.alt = t.alt;
            
            document.getElementById('cookie-text').textContent = t.cookieText;
            document.getElementById('cookie-decline').textContent = t.cookieDecline;
            document.getElementById('cookie-accept').textContent = t.cookieAccept;

            cardData.forEach(c => {
                const text = t.content[c.id];
                const titleEl = document.getElementById(`card-title-${c.id}`);
                const descEl = document.getElementById(`card-desc-${c.id}`);
                if (titleEl) titleEl.textContent = text.title;
                if (descEl) descEl.textContent = text.desc;
            });
        }

        window.toggleLang = () => {
            currentLang = currentLang === 'en' ? 'de' : 'en';
            localStorage.setItem('siteLang', currentLang);
            updateContent();
        };

        const cookieBanner = document.getElementById('cookie-banner');
        const cookieConsent = localStorage.getItem('siteCookieConsent');

        function injectGA() {
            if (document.getElementById('ga-script')) return;
            const script1 = document.createElement('script');
            script1.id = 'ga-script';
            script1.async = true;
            script1.src = 'https://www.googletagmanager.com/gtag/js?id=G-0WHX0WMFTC';
            document.head.appendChild(script1);

            const script2 = document.createElement('script');
            script2.innerHTML = `
                window.dataLayer = window.dataLayer || [];
                function gtag(){dataLayer.push(arguments);}
                gtag('js', new Date());
                gtag('config', 'G-0WHX0WMFTC');
            `;
            document.head.appendChild(script2);
        }

        if (!cookieConsent) {
            cookieBanner.classList.remove('hidden');
        } else if (cookieConsent === 'granted') {
            injectGA();
        }

        window.handleCookie = (status) => {
            localStorage.setItem('siteCookieConsent', status);
            cookieBanner.classList.add('opacity-0', 'translate-y-full');
            setTimeout(() => cookieBanner.classList.add('hidden'), 400);
            if (status === 'granted') injectGA();
        };

        initGrid();
        updateContent();
    </script>
</body>
</html>
